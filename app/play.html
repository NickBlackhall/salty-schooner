<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Salty Schooner — Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/theme.css">
<style>
  /* Controller styling only. Element ids, the .card/.run/.port classes and the
     data-id/data-run/data-port/data-jb attributes are load-bearing — the tap
     handlers select on them. Restyle them; do not rename or re-nest them. */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { padding-bottom: 30px; }
  .bar { position:sticky; top:0; z-index:5; display:flex; justify-content:space-between; align-items:center;
         font-family:var(--serif); font-size:1.05rem; padding:11px 14px; color:var(--gold-lt);
         background:linear-gradient(rgba(10,20,26,.92), rgba(10,20,26,.86)), url("/assets/tex-wood.webp") center / 340px;
         border-bottom:1px solid rgba(201,162,39,.45); }
  .bar.myTurn { color:#2a1e05; border-bottom-color:var(--gold);
                background:linear-gradient(#f0d089, #c9a227); text-shadow:none; }
  section { padding: 12px 14px; }
  h3 { margin:6px 0; font-family:var(--serif); font-size:.9rem; color:var(--gold-lt);
       text-transform:uppercase; letter-spacing:.1em; font-weight:600; }
  .runsGrid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .run { background:var(--teal); border:1px solid rgba(201,162,39,.35); border-radius:12px; padding:8px; min-height:64px; }
  /* A run the selected card can legally go to. This is the main affordance on
     a phone, so it stays loud. */
  .run.legal { border-color:var(--gold); box-shadow:0 0 0 2px rgba(201,162,39,.55) inset, 0 0 16px rgba(201,162,39,.35); }
  .cardRow { display:flex; flex-wrap:wrap; gap:6px; }

  /* 5:7 faces like the hot-seat build, sized up for thumbs. */
  .card { width:44px; aspect-ratio:5/7; font-size:1.05rem; }
  .handRow .card, #holdTop { width:52px; font-size:1.15rem; }
  .asBadge { font-size:9px; }
  .card.selected { outline:3px solid var(--gold-lt); outline-offset:1px; transform:translateY(-5px);
                   box-shadow:0 0 14px rgba(240,208,137,.8), 0 6px 10px rgba(0,0,0,.5); }
  .card.slot { cursor:pointer; }

  .handRow { display:flex; flex-wrap:wrap; gap:8px; }
  .portsGrid { display:grid; grid-template-columns: repeat(4,1fr); gap:8px; }
  .port { background:var(--wood); border:1px solid rgba(201,162,39,.3); border-radius:10px; padding:8px;
          text-align:center; min-height:66px; display:flex; flex-direction:column; align-items:center; justify-content:center;
          position:relative; }
  .port .count { font-size:.72rem; color:rgba(240,208,137,.7); margin-top:4px; }
  /* Tap the count to fan the whole pile open — matches togglePortFan() in the
     hot-seat build. Separate hit target from the port tile itself (stopPropagation
     in the handler), since tapping the tile plays/discards. */
  .portBadge { position:absolute; top:-6px; right:-6px; background:var(--gold); color:#25190a;
               border-radius:999px; min-width:20px; height:20px; padding:0 5px; font-size:.72rem;
               font-weight:800; display:flex; align-items:center; justify-content:center;
               box-shadow:0 1px 4px rgba(0,0,0,.5); cursor:pointer; }

  .portFanOverlay { position:fixed; left:0; right:0; bottom:0; z-index:15; max-height:70vh;
                     background:linear-gradient(rgba(10,20,26,.97), rgba(10,20,26,.99));
                     border-top:1px solid var(--gold); box-shadow:0 -4px 18px rgba(0,0,0,.55);
                     padding:14px; overflow-y:auto; }
  .portFanOverlay h3 { margin-top:0; }
  .portFanRow { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; align-items:flex-start; }
  .portFanCell { display:flex; flex-direction:column; align-items:center; }
  /* The last card in a pile is the only one that's actually playable — mark it
     so the fan answers "which one can I use" not just "what's buried here". */
  .portFanRow .card.top { outline:2px solid var(--gold); box-shadow:0 0 10px rgba(201,162,39,.6); }
  .portFanTopLabel { font-size:9px; text-align:center; color:var(--gold-lt); margin-top:2px; }
  .holdRow { display:flex; align-items:center; gap:12px; }

  /* The hand sits on wood, as it does in the hot-seat build. */
  #handSection { background:linear-gradient(rgba(20,12,7,.55), rgba(20,12,7,.55)), url("/assets/tex-wood.webp") center / 340px;
                 border-top:1px solid rgba(201,162,39,.28); border-bottom:1px solid rgba(201,162,39,.28); }

  button { font-size:1rem; padding:12px 18px; border-radius:10px; border:none;
           font-family:var(--serif); font-weight:700; color:#25190a;
           background:linear-gradient(#f0d089, #c9a227); box-shadow:0 2px 0 #6f5510; }
  button:active { transform:translateY(1px); box-shadow:0 1px 0 #6f5510; }
  button.wide { width:100%; }
  .choiceBar { position:fixed; left:0; right:0; bottom:0; padding:14px; display:flex; gap:10px; flex-wrap:wrap; z-index:10;
               background:linear-gradient(rgba(10,20,26,.96), rgba(10,20,26,.99));
               border-top:1px solid var(--gold); box-shadow:0 -4px 18px rgba(0,0,0,.55); }
  .toast { position:fixed; top:64px; left:50%; transform:translateX(-50%); background:#7a2323; color:#fff;
           padding:10px 18px; border-radius:10px; z-index:20; border:1px solid #c9a227; }
  .hidden { display:none; }
  .center { text-align:center; padding:40px 20px; }
  #waitPanel .logo { width:min(70vw,320px); display:block; margin:0 auto 18px; }
</style>
</head>
<body class="saltyBoard">
<div id="waitPanel" class="center">
  <img class="logo" src="/assets/logo.webp" alt="Salty Schooner">
  <p>Loading your seat…</p>
</div>

<div id="gameUi" class="hidden">
  <div class="bar" id="turnBar">Waiting…</div>

  <section>
    <h3>Runs</h3>
    <div class="runsGrid" id="runsGrid"></div>
  </section>

  <section id="handSection">
    <h3>Your Hand</h3>
    <div class="handRow" id="handRow"></div>
    <button id="drawBtn" class="wide hidden" style="margin-top:10px;">Draw cards</button>
  </section>

  <section>
    <h3>Ports — tap to discard, or tap a card to pick it up</h3>
    <div class="portsGrid" id="portsGrid"></div>
  </section>

  <section class="holdRow">
    <div>
      <h3>Your HOLD</h3>
      <div id="holdCard"></div>
    </div>
    <div class="meta" id="holdCount"></div>
  </section>

  <section>
    <h3>The Brig</h3>
    <div id="brigStrip" class="cardRow"></div>
  </section>
</div>

<div id="choiceBar" class="choiceBar hidden"></div>
<div id="toast" class="toast hidden"></div>
<div id="portFanOverlay" class="portFanOverlay hidden">
  <h3 id="portFanTitle">Port</h3>
  <div class="portFanRow" id="portFanRow"></div>
  <button class="wide" id="portFanClose">Close</button>
</div>

<script src="/shared/api.js"></script>
<script src="/shared/engine.js"></script>
<script src="/shared/sfx.js"></script>
<script src="/shared/poller.js"></script>
<script src="/shared/vendor/supabase.js"></script>
<script src="/shared/realtime.js"></script>
<script>
const params = new URLSearchParams(location.search);
let roomId = params.get('room') || Persist.lastRoom();
const urlPid = params.get('pid');
const urlTok = params.get('tok');
let creds = roomId ? Persist.loadPlayer(roomId, urlPid) : null;

// Rejoin link: ?room=..&pid=..&tok=.. restores a seat on a device that no longer
// has its saved credentials. Still supported, but rejoining by name at /join is
// now the easier route for most cases.
if (roomId && urlPid && urlTok) {
  creds = { playerId: urlPid, resumeToken: urlTok };
  Persist.savePlayer(roomId, urlPid, urlTok, null, null);
  // Drop the token out of the address bar (and browser history) now that it's saved.
  if (history.replaceState) history.replaceState(null, '', '/play?room=' + roomId);
}
let selected = null; // {zone, card, index}
let lastView = null;
let fannedPort = null; // index of the Port currently spread open, or null
let lastAnnouncedStatus = null;

// Declared BEFORE the boot block below, which calls startPolling(): `const` is
// not hoisted, so defining the poller further down would put it in the temporal
// dead zone and throw on load. (poll/showPausedPanel are function declarations,
// so referencing them here is fine.)
//
// Rates are per-state on purpose: only the player actually taking a turn needs to
// feel instant. Waiting players were the bulk of the old invocation cost.
const poller = createPoller({
  poll,
  intervalFor: () => {
    // With the doorbell connected the server tells us the instant anything
    // changes, so the timer stops being how we find out and becomes a safety
    // net for a missed message. This single line is most of the invocation
    // saving — a waiting player drops from a poll every 3.5s to one every 45s.
    if (doorbell.isLive()) return 45000;
    if (!lastView) return 1200;
    if (lastView.status === 'LOBBY') return 3000;       // waiting for the host to start
    return lastView.isYourTurn ? 1200 : 3500;           // your turn vs watching
  },
  maxInterval: 10000,
  idleStopMs: 10 * 60 * 1000,
  onIdleStop: showPausedPanel
});

// Declared after the poller because its handler calls poller.wake(); function
// hoisting does not apply to `const`.
const doorbell = createDoorbell({
  roomId: () => roomId,
  label: 'play',
  // wake() rather than kick(): the idle stop may already have fired and put up
  // the paused panel, and a player returning to the table should not have to
  // find the Resume button before the game starts moving again. No DOM cleanup
  // here — render() either hides waitPanel outright or rewrites its contents,
  // so the paused card clears itself on the fetch this triggers.
  onChange: () => poller.wake(),
  // Recompute the delay immediately on a connection change, so losing the socket
  // restores fast polling now rather than after one more 45s wait.
  onLiveChange: () => poller.kick()
});

// One browser can now hold several seats (playing two sides yourself). With more
// than one saved and no ?pid= to disambiguate, ask rather than guess — silently
// resuming as the wrong player is worse than one extra tap.
function showSeatPicker(list) {
  const wait = document.getElementById('waitPanel');
  wait.innerHTML = '<p>Which seat is this?</p><div id="seatPicks"></div>';
  const box = document.getElementById('seatPicks');
  list.forEach(p => {
    const b = document.createElement('button');
    b.style.cssText = 'display:block;width:100%;max-width:320px;margin:8px auto;';
    b.textContent = p.name ? `${p.name} (seat ${p.seat + 1})` : `Seat ${p.seat + 1}`;
    b.onclick = () => {
      creds = p;
      if (history.replaceState) history.replaceState(null, '', '/play?room=' + roomId + '&pid=' + p.playerId);
      startPolling();
    };
    box.appendChild(b);
  });
}

if (!roomId) {
  document.getElementById('waitPanel').innerHTML = '<p>No saved seat found.</p><p><a href="/join" style="color:#ffe28a;">Join a room</a></p>';
} else if (creds) {
  startPolling();
} else {
  const saved = Persist.loadPlayers(roomId);
  if (saved.length > 1) showSeatPicker(saved);
  else document.getElementById('waitPanel').innerHTML = '<p>No saved seat found.</p><p><a href="/join" style="color:#ffe28a;">Join a room</a></p>';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 2200);
}

// A King played as a wildcard must still READ as a King. Showing only its
// effective value ("7♠") hides the King-on-King restriction and makes a legal
// board look like an illegal one. Mirrors renderCard() in app/index.html.
function cardHtml(c, extraClass) {
  if (!c) return '';
  const red = c.suit === '♥' || c.suit === '♦';
  const wild = c.rank === 'K' && c.effectiveValue;
  const arrow = c.playedDirection === 'up' ? '↑' : c.playedDirection === 'down' ? '↓' : '';
  const as = wild ? `<span class="asBadge">${Engine.VALUE_NAMES[c.effectiveValue]}${arrow}</span>` : '';
  return `<span class="card ${red ? 'red' : ''} ${wild ? 'king' : ''} ${extraClass || ''}">${c.rank}${c.suit}${as}</span>`;
}

// Spreads a whole Port pile open — mirrors togglePortFan() in app/index.html.
// Read-only: tapping a card inside the fan does nothing, same as hot-seat.
// Only the top (last) card is actually playable, so it gets marked.
function togglePortFan(i) {
  // Refuse while a King direction question is up — it occupies the same corner
  // of the screen and must be answered first.
  if (choiceBarOpen()) { showToast('Answer the King first.'); return; }
  fannedPort = (fannedPort === i) ? null : i;
  renderPortFan();
}
function renderPortFan() {
  const overlay = document.getElementById('portFanOverlay');
  // yourPorts is absent from a LOBBY view, so guard on it rather than on lastView
  // alone — a host reset can swap the view out while the fan is open.
  if (fannedPort === null || !lastView || !lastView.yourPorts) {
    fannedPort = null;
    overlay.classList.add('hidden');
    return;
  }
  const pile = lastView.yourPorts[fannedPort] || [];
  if (pile.length === 0) { fannedPort = null; overlay.classList.add('hidden'); return; }
  document.getElementById('portFanTitle').textContent = `Port ${fannedPort + 1} (${pile.length} card${pile.length === 1 ? '' : 's'})`;
  document.getElementById('portFanRow').innerHTML = pile.map((c, idx) => {
    const isTop = idx === pile.length - 1;
    return `<div class="portFanCell">${cardHtml(c, isTop ? 'top' : '')}${isTop ? '<div class="portFanTopLabel">TOP</div>' : ''}</div>`;
  }).join('');
  overlay.classList.remove('hidden');
}
document.getElementById('portFanClose').addEventListener('click', () => { fannedPort = null; renderPortFan(); });

function selectCard(zone, card, index) {
  if (!lastView.isYourTurn) return;
  // Picking a different card abandons any King direction question still on
  // screen — that question belongs to the card you were playing a moment ago.
  hideChoiceBar();
  // Tapping the selected card again clears it. Without this you cannot get from
  // "hand card selected" back to "nothing selected", which is the state a Port
  // pickup requires.
  if (selected && selected.card.id === card.id) { selected = null; Sfx.play('deselect'); render(lastView); return; }
  selected = { zone, card, index };
  Sfx.play('select');
  render(lastView);
}

// Mirrors window.portTap() in app/index.html: a Port tile is both the discard
// target AND the way to pick a card back out of a Port to play it to a Run.
function portTap(portIndex) {
  if (!lastView.isYourTurn) return;
  if (selected && selected.zone === 'hand') return discardTo(portIndex);
  const pile = lastView.yourPorts[portIndex] || [];
  const top = pile[pile.length - 1];
  if (top) return selectCard('discard', top, portIndex);
  showToast('Select a hand card first to discard here.');
}

function legalRunIndexes(card) {
  if (!lastView) return [];
  return lastView.runs.map((r,i)=>i).filter(i => Engine.canPlayCardOnRun(card, lastView.runs[i]));
}

async function attemptPlay(runIndex) {
  if (!selected) return;
  const card = selected.card;
  const run = lastView.runs[runIndex];
  if (!Engine.canPlayCardOnRun(card, run)) { Sfx.play('illegal'); showToast('Illegal play.'); return; }
  if (card.rank === 'K') {
    let choices;
    if (!run.direction) {
      choices = Engine.unsetNaturalKingChoices(run).map(c => ({ label: `King as ${Engine.VALUE_NAMES[c.kingValue]} — ${c.dir.toUpperCase()}`, value: c.kingValue, dir: c.dir }));
    } else {
      const required = Engine.kingRequiredValue(run);
      choices = ['up','down'].map(dir => ({ label: `Continue ${dir.toUpperCase()} as ${Engine.VALUE_NAMES[required]}`, value: required, dir }));
    }
    // Capture the card id NOW. Previously sendPlay() read `selected` at the
    // moment a choice was tapped, so changing selection while the question was
    // on screen answered it with the wrong card — committing a King and then
    // touching a hand card played the hand card instead, King untouched.
    showChoiceBar(choices, (choice) => sendPlay(card.id, runIndex, { value: choice.value, dir: choice.dir }));
    return;
  }
  sendPlay(card.id, runIndex, undefined);
}

function hideChoiceBar() {
  document.getElementById('choiceBar').classList.add('hidden');
}
function choiceBarOpen() {
  return !document.getElementById('choiceBar').classList.contains('hidden');
}
function showChoiceBar(choices, onPick) {
  // A pending King question and the Port fan are both fixed to the bottom of the
  // screen; the fan sits above and would bury the question. Close it.
  fannedPort = null; renderPortFan();
  const bar = document.getElementById('choiceBar');
  bar.innerHTML = '';
  choices.forEach(c => {
    const b = document.createElement('button');
    b.textContent = c.label;
    b.onclick = () => { bar.classList.add('hidden'); onPick(c); };
    bar.appendChild(b);
  });
  bar.classList.remove('hidden');
}

async function sendPlay(cardId, runIndex, kingChoice) {
  try {
    const res = await Api.submitAction({
      roomId, actorType: 'player', token: creds.resumeToken, playerId: creds.playerId,
      action: { type: 'PLAY_CARD', cardId, runIndex, kingChoice },
      expectedVersion: lastView.stateVersion
    });
    selected = null;
    Sfx.play('place');
    applyView(res.view);
    poller.kick();   // act, then re-sync at once rather than waiting out a backed-off delay
  } catch (e) {
    Sfx.play('illegal');
    showToast(e.message);
    selected = null;
    render(lastView);
  }
}

async function discardTo(portIndex) {
  if (!selected || selected.zone !== 'hand') { Sfx.play('illegal'); showToast('Select a card from your hand first.'); return; }
  try {
    const res = await Api.submitAction({
      roomId, actorType: 'player', token: creds.resumeToken, playerId: creds.playerId,
      action: { type: 'DISCARD_TO_PORT', cardId: selected.card.id, portIndex },
      expectedVersion: lastView.stateVersion
    });
    selected = null;
    Sfx.play('discard');
    applyView(res.view);
    poller.kick();   // act, then re-sync at once rather than waiting out a backed-off delay
  } catch (e) {
    Sfx.play('illegal');
    showToast(e.message);
  }
}

document.getElementById('drawBtn').addEventListener('click', async () => {
  try {
    const res = await Api.submitAction({
      roomId, actorType: 'player', token: creds.resumeToken, playerId: creds.playerId,
      action: { type: 'DRAW_HAND' },
      expectedVersion: lastView.stateVersion
    });
    Sfx.play('ui');
    applyView(res.view);
    poller.kick();   // act, then re-sync at once rather than waiting out a backed-off delay
  } catch (e) { Sfx.play('illegal'); showToast(e.message); }
});

function render(view) {
  // The host can reset a game back to LOBBY at any time. That response has no
  // hand/HOLD/Ports (getLobbyView, not getPlayerView) — rendering the normal
  // game UI against it would throw on view.yourHand.map(...). Show a holding
  // screen instead; your seat (name, resume token) is untouched by a reset.
  if (view.status === 'LOBBY') {
    // Drop any held selection. Card ids come from a uid counter in the engine
    // that restarts at 1 on a cold function instance, so a card dealt after the
    // reset can carry the same id as the one selected before it — a stale
    // `selected` would then match the wrong card by id in the next game.
    selected = null;
    document.getElementById('gameUi').classList.add('hidden');
    hideChoiceBar();
    // The fan is a fixed overlay outside gameUi, so hiding gameUi doesn't take it
    // down — without this it floats over the reset screen showing a dead game's cards.
    fannedPort = null; renderPortFan();
    const wait = document.getElementById('waitPanel');
    wait.classList.remove('hidden');
    wait.innerHTML = '<p>Game was reset.</p><p>Waiting for the host to start a new round — you’re still in the room.</p>';
    return;
  }
  document.getElementById('waitPanel').classList.add('hidden');
  document.getElementById('gameUi').classList.remove('hidden');

  const bar = document.getElementById('turnBar');
  bar.textContent = view.isYourTurn ? "YOUR TURN" : `${view.currentPlayerName}'s turn`;
  bar.classList.toggle('myTurn', view.isYourTurn);

  document.getElementById('runsGrid').innerHTML = view.runs.map((r,i) => {
    const legal = selected && Engine.canPlayCardOnRun(selected.card, r);
    return `<div class="run ${legal ? 'legal':''}" data-run="${i}"><div class="meta">Run ${i+1} ${r.direction?('('+r.direction+')'):''}</div><div class="cardRow">${r.cards.map(c=>cardHtml(c)).join('') || '<span class="meta">A or Q</span>'}</div></div>`;
  }).join('');
  document.querySelectorAll('#runsGrid .run').forEach(el => {
    el.addEventListener('click', () => attemptPlay(Number(el.dataset.run)));
  });

  document.getElementById('handRow').innerHTML = view.yourHand.map(c => {
    const sel = selected && selected.zone === 'hand' && selected.card.id === c.id;
    return `<span class="card slot ${c.suit==='♥'||c.suit==='♦'?'red':''} ${sel?'selected':''}" data-id="${c.id}">${c.rank}${c.suit}</span>`;
  }).join('') || '<span class="meta">Empty</span>';
  document.querySelectorAll('#handRow .card').forEach(el => {
    el.addEventListener('click', () => {
      const c = view.yourHand.find(c => c.id === el.dataset.id);
      selectCard('hand', c);
    });
  });
  // Drawing is always a choice now. The server decides eligibility (start-of-turn
  // quota, or a refill because the hand is empty) and sends the count; 0 hides it.
  const drawBtn = document.getElementById('drawBtn');
  const drawable = view.yourDrawCount || 0;
  drawBtn.classList.toggle('hidden', !(view.isYourTurn && drawable > 0));
  // Deliberately no number: how many you are owed depends on the start-of-turn
  // quota and whether the hand has been cleared, and a label stating a count is
  // one more thing that can drift out of step with what the server deals. The
  // server decides the amount; the button just offers the choice.
  drawBtn.textContent = 'Draw cards';

  document.getElementById('portsGrid').innerHTML = view.yourPorts.map((pile,i) => {
    const top = pile[pile.length-1];
    const sel = selected && selected.zone === 'discard' && selected.index === i;
    const badge = pile.length > 0 ? `<span class="portBadge" data-fan="${i}">${pile.length}</span>` : '';
    return `<div class="port" data-port="${i}">${top ? cardHtml(top, sel ? 'selected' : '') : '<span class="meta">Port '+(i+1)+'</span>'}${badge}<div class="count">${pile.length}</div></div>`;
  }).join('');
  document.querySelectorAll('#portsGrid .port').forEach(el => {
    el.addEventListener('click', () => portTap(Number(el.dataset.port)));
  });
  document.querySelectorAll('#portsGrid .portBadge').forEach(el => {
    el.addEventListener('click', (e) => { e.stopPropagation(); togglePortFan(Number(el.dataset.fan)); });
  });
  renderPortFan();

  document.getElementById('holdCard').innerHTML = (() => {
    if (!view.yourGoalTop) return '<span class="meta">Cleared!</span>';
    const sel = selected && selected.zone === 'goal';
    return `<span class="card slot ${view.yourGoalTop.suit==='♥'||view.yourGoalTop.suit==='♦'?'red':''} ${sel?'selected':''}" id="holdTop">${view.yourGoalTop.rank}${view.yourGoalTop.suit}</span>`;
  })();
  const holdTop = document.getElementById('holdTop');
  if (holdTop) holdTop.addEventListener('click', () => selectCard('goal', view.yourGoalTop));
  document.getElementById('holdCount').textContent = view.yourGoalCount + ' cards left';

  const b = view.brig;
  document.getElementById('brigStrip').innerHTML = b.active
    ? b.releasedKings.map((c,i) => {
        const sel = selected && selected.zone === 'jailbreak' && selected.card.id === c.id;
        return `<span class="card slot ${sel?'selected':''}" data-jb="${c.id}">${c.rank}${c.suit}</span>`;
      }).join('') + ' <span class="meta">JAILBREAK — play these!</span>'
    : (b.waitingKings.map(c=>cardHtml(c)).join('') || '<span class="meta">Empty</span>');
  document.querySelectorAll('#brigStrip [data-jb]').forEach(el => {
    el.addEventListener('click', () => {
      const c = view.brig.releasedKings.find(c => c.id === el.dataset.jb);
      selectCard('jailbreak', c);
    });
  });

  // Only announce on the transition — render() runs on every poll, so an
  // unguarded toast here re-fires roughly once a second.
  if (view.status !== lastAnnouncedStatus) {
    if (view.status === 'ROUND_RESULTS') showToast('Round over — waiting on the host.');
    else if (view.status === 'GAME_RESULTS') showToast('Game over — check the host screen for final scores.');
    lastAnnouncedStatus = view.status;
  }
}

function applyView(view) {
  // Drop a view that is older than what we already show. A poll GET issued just
  // before an action's POST commits will answer with pre-action state and arrive
  // afterwards, briefly reverting the board — your card visibly jumps back into
  // your hand. Only compare when both sides carry a version: a LOBBY view (host
  // reset) has none and must always be allowed through.
  if (lastView && typeof lastView.stateVersion === 'number'
      && typeof view.stateVersion === 'number'
      && view.stateVersion < lastView.stateVersion) {
    return;
  }
  lastView = view;
  render(view);
}

async function poll() {
  try {
    const view = await Api.getPlayerState(roomId, creds.playerId, creds.resumeToken);
    applyView(view);
    // Signature the poller compares to decide whether anything actually moved.
    // LOBBY views carry no stateVersion, hence the status fallback.
    return (view.status || '') + ':' + (view.stateVersion == null ? '' : view.stateVersion);
  } catch (e) {
    console.error(e);
    return 'error';
  }
}

function showPausedPanel() {
  const wait = document.getElementById('waitPanel');
  document.getElementById('gameUi').classList.add('hidden');
  hideChoiceBar();
  fannedPort = null; renderPortFan();
  wait.classList.remove('hidden');
  wait.innerHTML = '<p>Paused — this tab went quiet for a while.</p>'
    + '<p class="meta">Stopped checking for updates so it isn’t running in the background.</p>'
    + '<button id="resumeBtn" style="margin-top:14px;">Resume game</button>';
  document.getElementById('resumeBtn').addEventListener('click', () => {
    wait.classList.add('hidden');
    poller.start();
  });
}

function startPolling() {
  poller.start();
  doorbell.start();
}
</script>
