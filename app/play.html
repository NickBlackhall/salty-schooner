<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Salty Schooner — Play</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/theme.css">
<style>
  /* Controller styling only. Element ids, the .card/.run/.port classes and the
     data-id/data-run/data-port/data-jb attributes are load-bearing — the tap
     handlers select on them. Restyle them; do not rename or re-nest them. */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* theme.css paints an opaque navy on body, and CSS draws a negative-z-index
     pseudo-element BEFORE its parent's background — so body was covering
     .saltyBoard::before and hiding the board art entirely. Same bug fixed on
     /tv; it applies here too. Swap board-bg.webp for Nick's reef background
     when that asset lands. */
  body { margin:0; overflow:hidden; background:transparent; }
  .saltyBoard::before {
    background-image:
      linear-gradient(rgba(4,16,22,.34), rgba(4,16,22,.5)),
      url("/assets/board-bg.webp") !important;
  }

  /* ---- LANDSCAPE CONTROLLER -------------------------------------------------
   * Built to Nick's mockups (2026-08-02), which draw the phone held sideways.
   * Everything is sized in dvh so the whole board fits one screen with no
   * scrolling — an explicit requirement: "I don't want to have to scroll to see
   * things on that screen." Portrait gets a rotate prompt rather than a squashed
   * fallback, because the four-run row and the hand row cannot both survive a
   * narrow viewport at a usable size.
   */
  #gameUi { height:100dvh; display:flex; flex-direction:column;
            gap:1.1dvh; padding:1.4dvh 1.6dvh; }

  .topBar { flex:0 0 auto; display:flex; align-items:center; gap:1.2dvh; }
  /* Menu lives INSIDE the bar (see the markup): three separate items across the
     top read as clutter on a phone. Order is Menu / turn / round — the button is
     hard against the left edge, so its padding is trimmed on that side and the
     round text gets the roomier right inset.
     Fixed 600px rather than filling the row, to leave the logo real space.
     max-width keeps it from overflowing a narrower phone than the 926px
     landscape iPhone this was tuned against. */
  .turnPill { flex:0 1 600px; max-width:100%; display:flex; align-items:center;
              gap:1.4dvh; padding:.35dvh 2.2dvh .35dvh .5dvh; border-radius:1.4dvh;
              border:.35dvh solid var(--gold); font-family:var(--serif);
              background:linear-gradient(rgba(24,14,6,.9), rgba(24,14,6,.82));
              color:var(--gold-lt); font-size:3.4dvh; line-height:1;
              box-shadow:0 .4dvh 1.4dvh rgba(0,0,0,.5); }
  .turnPill.myTurn { background:linear-gradient(#f0d089, #c9a227); color:#2a1e05; }
  #turnText { flex:1 1 auto; }
  .turnPill .roundMeta { font-size:2.2dvh; opacity:.85; white-space:nowrap; }
  /* Stays dark in both pill states — on your turn the pill goes gold, so a gold
     button would disappear into it.
     Deliberately oversized for its text: it sits in the top strip where iOS
     Safari reveals its toolbar, so a near-miss above the button un-fullscreens
     the game. A bigger target is the cheap mitigation — the bar's own vertical
     padding was cut to pay for most of the extra height. */
  .pillMenu { flex:0 0 auto; font-size:2.6dvh; padding:2.6dvh 2.4dvh; border-radius:1dvh;
              background:linear-gradient(rgba(24,14,6,.95), rgba(16,9,4,.95));
              color:var(--gold-lt); border:.25dvh solid #c99a43; box-shadow:none; }
  /* margin-left:auto pins it to the far right, so the space the turn bar gave up
     opens between the two rather than stranding the logo mid-row.
     logo-wide.png is the wordmark cropped tight — 4.65:1, no transparent
     padding, unlike logo.webp which is two-thirds empty vertically and is still
     what /tv, /host, /join and the lobby panels use. Height is capped at the
     turn bar's own height so the logo never drives the row taller; at this
     aspect that still buys ~175px of width. */
  .topLogo { flex:0 0 auto; height:8.8dvh; width:auto; margin-left:auto;
             filter:drop-shadow(0 .3dvh .9dvh rgba(0,0,0,.8)); }

  /* Runs are TAP TARGETS ONLY — no card art, no legality highlight. Nick,
     2026-08-02: showing which runs accept the selected card "takes all the
     skill away if you're telegraphing to the player where to play the cards."
     The card contents live on /tv. Illegal plays still toast. */
  /* Grows into whatever the hand/ports column leaves over (they are pinned to
     fixed heights below, and .midRow sizes to them) — the runs were the smallest
     tap target on the screen, so the slack goes here. */
  .runsRow { flex:1 1 auto; display:grid; grid-template-columns:repeat(4,1fr); gap:1.2dvh; }
  .run { background:var(--parch); color:#4a3418; border:.35dvh solid var(--gold);
         border-radius:1.4dvh; min-height:9dvh;
         display:flex; align-items:center; justify-content:center;
         font-family:var(--serif); font-size:2.6dvh; letter-spacing:.05em;
         box-shadow:0 .4dvh 1.4dvh rgba(0,0,0,.45), inset 0 0 0 .18dvh rgba(240,208,137,.3);
         cursor:pointer; }
  .run:active { transform:translateY(.2dvh); }
  /* Direction wash, lifted from hot-seat (app/index.html .run.direction-*). This
     is NOT a legality hint: it reports the run's own established direction, which
     is public state already shown on /tv, and does not change with what you have
     selected. Direction is communicated by both hue and where the wash is
     strongest — green pooling at the top for ascending, red at the bottom for
     descending — so it survives colour-blindness better than hue alone. */
  .run.direction-up { background:
      linear-gradient(to bottom, rgba(26,145,85,.34), rgba(26,145,85,.09) 58%, rgba(26,145,85,0)),
      var(--parch); }
  .run.direction-down { background:
      linear-gradient(to bottom, rgba(184,48,42,0), rgba(184,48,42,.09) 42%, rgba(184,48,42,.34)),
      var(--parch); }
  /* Remote mode only — the shared board is not on a TV, so the phone carries it. */
  .run.showCards { flex-direction:column; gap:.5dvh; font-size:1.9dvh; padding:.8dvh; }

  /* Sizes to the hand/ports column rather than filling the screen, so the slack
     lands in .runsRow above instead of padding out the bottom of this row. */
  .midRow { flex:0 1 auto; display:grid; grid-template-columns:1fr auto; gap:1.4dvh; min-height:0; }
  /* align-items:center insets #handSection/.portsGrid below their own width
     (see those rules) rather than letting them stretch edge-to-edge — leaves
     the reef/board art visible on both sides and centers the ports under the
     hand, matching Nick's ask. */
  .leftCol { display:flex; flex-direction:column; align-items:center; gap:1.2dvh; min-height:0; }
  /* Width is tuned to keep the Brig/HOLD frames square: each is half this
     column's height, and the column now measures the hand + ports stack. Retune
     this if either of those fixed heights changes. */
  .rightCol { flex:0 0 auto; width:31.5dvh; display:flex; flex-direction:column; gap:1.2dvh; min-height:0; }

  /* Hand on planks inside the rope frame, per the mockup. */
  /* Hand and Ports share the left column. The hand gets the larger share (it is
     the primary interaction) but not all of it — an unconstrained flex:1 here
     let the plank panel swallow the column and left the cards looking tiny
     inside it. */
  /* Hand and Ports are pinned to explicit heights rather than flex shares: the
     ports were sized as a leftover and grew to fill the column. Fixed bases keep
     the hand exactly as it is while the ports shrink independently. */
  #handSection { flex:0 0 31.8dvh; width:88%; min-height:0; position:relative;
                 border:2.4dvh solid transparent;
                 border-image:url("/assets/frame-generic.png") 90 fill / 2.4dvh / 0 round;
                 display:flex; align-items:center; }
  .handInner { display:flex; align-items:center; gap:1dvh; width:100%;
               background:linear-gradient(rgba(20,12,7,.35), rgba(20,12,7,.35)), url("/assets/tex-wood.webp") center / 300px;
               padding:.8dvh; border-radius:.6dvh; min-height:0; }
  .handRow { display:flex; gap:1dvh; flex:1 1 auto; justify-content:center; }
  #drawBtn { flex:0 0 auto; font-family:var(--serif); font-size:1.9dvh; line-height:1.15;
             padding:1.4dvh 1.2dvh; border-radius:1dvh; border:.3dvh solid var(--gold);
             background:linear-gradient(rgba(120,92,16,.95), rgba(84,64,10,.95));
             color:var(--gold-lt); box-shadow:none; white-space:pre-line; }

  .cardRow { display:flex; gap:.6dvh; }
  /* 5:7 faces, sized off viewport height so the row fits a landscape phone. */
  .card { width:13dvh; aspect-ratio:5/7; font-size:4dvh; border-radius:.8dvh; }
  /* Hand cards are the primary touch target — bigger than the generic .card
     default so they don't look lost in the plank panel. Scoped to #handRow so
     port-fan and remote-mode run cards (which reuse the base .card size)
     aren't affected. */
  #handRow .card { width:18dvh; font-size:5.6dvh; }
  .asBadge { font-size:1.2dvh; }
  .card.selected { outline:.5dvh solid var(--gold-lt); outline-offset:.2dvh; transform:translateY(-.8dvh);
                   box-shadow:0 0 2dvh rgba(240,208,137,.85), 0 .8dvh 1.4dvh rgba(0,0,0,.55); }
  .card.slot { cursor:pointer; }

  /* HOLD in the ornate gold frame, Brig in the iron one — both lifted from
     hot-seat rather than restyled, same as /tv. */
  .holdBox, .brigBox { position:relative; flex:1 1 0; min-height:0;
                       display:flex; align-items:center; justify-content:center; }
  .holdBox::after { content:""; position:absolute; inset:0; pointer-events:none; z-index:2;
                    background:url("/assets/frame-hold.png") center / 100% 100% no-repeat; }
  .brigBox::after { content:""; position:absolute; inset:0; pointer-events:none; z-index:2;
                    background:url("/assets/frame-brig.png") center / 100% 100% no-repeat; }
  .holdInner, .brigInner { position:relative; z-index:1; width:66%; height:66%;
                           display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.5dvh; }
  /* 72% is measured, not guessed: frame-hold.png is 512x512 and its transparent
     window runs x=72..440, i.e. 71.9% of the image. Going wider (80% was tried)
     slides the purple panel UNDER the ornate border and reads as the frame
     clipping the card. Re-measure the art before changing this. The Brig keeps
     the shared 66%: it holds several Kings at once and needs room to wrap. */
  .holdInner { width:72%; height:72%;
               background:linear-gradient(rgba(38,18,52,.85), rgba(38,18,52,.85)), url("/assets/tex-purple.webp") center / 200px; }
  .brigInner { background:linear-gradient(rgba(24,16,14,.82), rgba(24,16,14,.88)), url("/assets/tex-stone.webp") center / 180px; }
  .holdInner .card, .brigInner .card { width:7.4dvh; font-size:2.6dvh; }
  /* HOLD shows exactly ONE card — the top of your pile — so it can be sized for
     legibility rather than to fit a row. Scoped away from .brigInner, whose
     cards must stay small enough that a multi-King Jailbreak still fits.
     Sized to leave real clearance inside the 72% window above: the card plus the
     count line has to fit its height, and a card that exactly fills it reads as
     jammed even when nothing is actually clipped. */
  .holdInner .card { width:12.5dvh; font-size:4.2dvh; }
  .holdInner .panelCount { font-size:1.3dvh; }
  .panelCount { font-size:1.5dvh; color:var(--gold-lt); }
  .brigInner .cardRow { justify-content:center; flex-wrap:wrap; }

  .portsGrid { flex:0 0 31.4dvh; width:88%; min-height:0; display:grid; grid-template-columns:repeat(4,1fr); gap:1dvh;
               background:var(--teal); border:.4dvh solid var(--gold); border-radius:1.4dvh;
               padding:1dvh; box-shadow:0 .4dvh 1.4dvh rgba(0,0,0,.45); }
  .port { background:rgba(8,40,44,.6); border:.25dvh solid rgba(201,162,39,.45); border-radius:1dvh;
          text-align:center; min-height:0; display:flex; flex-direction:column;
          align-items:center; justify-content:center; position:relative; cursor:pointer; }
  .port .count { font-size:1.4dvh; color:rgba(240,208,137,.7); }
  /* Tap the count to fan the whole pile open — matches togglePortFan() in the
     hot-seat build. Separate hit target from the port tile itself (stopPropagation
     in the handler), since tapping the tile plays/discards. */
  /* 3x its original 2.6dvh: at 11px it was both unreadable and a poor thumb
     target. Sat INSIDE the tile corner now rather than straddling it — at this
     size the old negative offsets pushed it over the Ports panel's own border
     and, on Port 4, past its right edge. */
  .portBadge { position:absolute; top:.5dvh; right:.5dvh; background:var(--gold); color:#25190a;
               border-radius:999px; min-width:7.8dvh; height:7.8dvh; padding:0 1dvh; font-size:3.4dvh;
               font-weight:800; display:flex; align-items:center; justify-content:center;
               box-shadow:0 .2dvh .5dvh rgba(0,0,0,.5); cursor:pointer; z-index:3; }

  /* ---- Modals ---------------------------------------------------------------
   * The King direction question and the Menu are both dimmed-backdrop modals,
   * matching hot-seat's showModal(). The landscape layout claims every region of
   * the screen — runs, hand, ports, HOLD, Brig — so there is no free strip left
   * for a docked bar to occupy without covering something. A modal floats above
   * all of it and cannot collide.
   */
  .modalBackdrop { position:fixed; inset:0; z-index:40; display:none;
                   align-items:center; justify-content:center; padding:2dvh;
                   background:rgba(4,10,14,.78); }
  .modalBackdrop.show { display:flex; }
  .modalCard { width:min(88vw, 92dvh); max-height:92dvh; overflow-y:auto;
               background:linear-gradient(rgba(28,16,8,.97), rgba(20,12,6,.98));
               border:.4dvh solid var(--gold); border-radius:1.6dvh; padding:2.4dvh;
               box-shadow:0 1dvh 4dvh rgba(0,0,0,.7); }
  .modalCard h2 { margin:0 0 1.4dvh; font-family:var(--serif); font-size:3dvh; color:var(--gold-lt); }
  .modalCard p { margin:.6dvh 0; font-size:2dvh; }
  .modalChoices { display:flex; flex-wrap:wrap; gap:1.2dvh; margin-top:2dvh; }
  .modalChoices button { flex:1 1 auto; font-size:2.1dvh; padding:1.6dvh 2dvh; }
  .menuSection { margin-top:2dvh; padding-top:1.6dvh; border-top:.2dvh solid rgba(201,162,39,.3); }
  .menuSection h3 { margin:0 0 1dvh; font-family:var(--serif); font-size:1.9dvh;
                    color:var(--gold-lt); text-transform:uppercase; letter-spacing:.1em; }
  .menuScore { display:flex; justify-content:space-between; font-size:2.1dvh;
               color:var(--gold-lt); padding:.5dvh 0; }
  .menuScore.turn { font-weight:700; }
  .menuBtns { display:flex; flex-wrap:wrap; gap:1dvh; }
  .menuBtns button { font-size:1.9dvh; padding:1.2dvh 1.6dvh; }

  /* Landscape is the designed orientation; portrait gets an honest prompt
     rather than a broken board. */
  #rotatePrompt { position:fixed; inset:0; z-index:60; display:none;
                  flex-direction:column; align-items:center; justify-content:center;
                  gap:2vh; padding:8vw; text-align:center;
                  background:linear-gradient(rgba(6,14,20,.96), rgba(6,14,20,.99)); }
  #rotatePrompt img { width:min(60vw,260px); }
  @media (orientation: portrait) {
    #rotatePrompt.armed { display:flex; }
  }

  .portFanOverlay { position:fixed; left:0; right:0; bottom:0; z-index:15; max-height:70vh;
                     background:linear-gradient(rgba(10,20,26,.97), rgba(10,20,26,.99));
                     border-top:1px solid var(--gold); box-shadow:0 -4px 18px rgba(0,0,0,.55);
                     padding:14px; overflow-y:auto; }
  .portFanOverlay h3 { margin-top:0; }
  .portFanRow { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; align-items:flex-start; }
  .portFanCell { display:flex; flex-direction:column; align-items:center; }
  /* The last card in a pile is the only one that's actually playable — mark it
     so the fan answers "which one can I use" not just "what's buried here". */
  .portFanRow .card.top { outline:2px solid var(--gold); box-shadow:0 0 10px rgba(201,162,39,.6); }
  .portFanTopLabel { font-size:9px; text-align:center; color:var(--gold-lt); margin-top:2px; }
  .holdRow { display:flex; align-items:center; gap:12px; }

  /* The hand sits on wood, as it does in the hot-seat build. */
  #handSection { background:linear-gradient(rgba(20,12,7,.55), rgba(20,12,7,.55)), url("/assets/tex-wood.webp") center / 340px;
                 border-top:1px solid rgba(201,162,39,.28); border-bottom:1px solid rgba(201,162,39,.28); }

  button { font-size:1rem; padding:12px 18px; border-radius:10px; border:none;
           font-family:var(--serif); font-weight:700; color:#25190a;
           background:linear-gradient(#f0d089, #c9a227); box-shadow:0 2px 0 #6f5510; }
  button:active { transform:translateY(1px); box-shadow:0 1px 0 #6f5510; }
  button.wide { width:100%; }
  .choiceBar { position:fixed; left:0; right:0; bottom:0; padding:14px; display:flex; gap:10px; flex-wrap:wrap; z-index:10;
               background:linear-gradient(rgba(10,20,26,.96), rgba(10,20,26,.99));
               border-top:1px solid var(--gold); box-shadow:0 -4px 18px rgba(0,0,0,.55); }
  .toast { position:fixed; top:64px; left:50%; transform:translateX(-50%); background:#7a2323; color:#fff;
           padding:10px 18px; border-radius:10px; z-index:20; border:1px solid #c9a227; }
  .hidden { display:none; }
  .center { text-align:center; padding:40px 20px; }
  #waitPanel .logo, #lobbyPanel .logo { width:min(70vw,320px); display:block; margin:0 auto 18px; }

  /* Lobby and round-results now live here rather than on a separate host
     screen, because the host is a player and stays on this page all game. */
  .lobbyCode { font-family:var(--serif); font-size:3.4rem; letter-spacing:.2em;
               color:var(--gold-lt); margin:6px 0; text-shadow:0 3px 12px rgba(0,0,0,.6); }
  .playerList { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:18px 0; }
  .playerChip { font-family:var(--serif); background:var(--teal); border:1px solid var(--gold);
                padding:8px 16px; border-radius:999px; font-size:1rem; color:var(--gold-lt); }
  .playerChip.you { background:linear-gradient(#f0d089, #c9a227); color:#25190a; border-color:#8a6c15; }
  .scoreRow { display:flex; justify-content:space-between; max-width:320px; margin:6px auto;
              font-size:1.05rem; color:var(--gold-lt); }
  button.secondary { background:rgba(20,12,7,.92); color:var(--gold-lt); border:1px solid #c99a43;
                     box-shadow:none; }
  button.tiny { font-size:.82rem; padding:7px 12px; }
  /* (.hostBar is gone — host controls live in the Menu modal now.) */
</style>
</head>
<body class="saltyBoard">
<div id="waitPanel" class="center">
  <img class="logo" src="/assets/logo-wide.png" alt="Salty Schooner">
  <p>Loading your seat…</p>
</div>

<div id="lobbyPanel" class="center hidden">
  <img class="logo" src="/assets/logo-wide.png" alt="Salty Schooner">
  <div class="meta">Room code</div>
  <div class="lobbyCode" id="lobbyCode"></div>
  <p class="meta" id="lobbyJoinHint"></p>
  <div class="playerList" id="lobbyPlayers"></div>
  <div id="lobbyHostControls" class="hidden">
    <button id="startBtn" disabled>Start game</button>
    <p style="margin-top:14px;"><button id="lobbyResetBtn" class="secondary tiny">Reset game</button></p>
  </div>
  <p class="meta hidden" id="lobbyWaitText">Waiting for the host to start…</p>
</div>

<div id="resultsPanel" class="center hidden"></div>

<div id="gameUi" class="hidden">
  <div class="topBar">
    <div class="turnPill" id="turnBar">
      <button id="menuBtn" class="pillMenu">Menu ☰</button>
      <span id="turnText">Waiting…</span>
      <span class="roundMeta" id="roundMeta"></span>
    </div>
    <img class="topLogo" src="/assets/logo-wide.png" alt="Salty Schooner">
  </div>

  <div class="runsRow" id="runsGrid"></div>

  <div class="midRow">
    <div class="leftCol">
      <div id="handSection">
        <div class="handInner">
          <button id="drawBtn" class="hidden">Draw&#10;Cards</button>
          <div class="handRow" id="handRow"></div>
        </div>
      </div>
      <div class="portsGrid" id="portsGrid"></div>
    </div>

    <div class="rightCol">
      <div class="holdBox">
        <div class="holdInner">
          <div id="holdCard"></div>
          <div class="panelCount" id="holdCount"></div>
        </div>
      </div>
      <!-- The Brig frame is always drawn; it only fills with Kings during YOUR
           Jailbreak. Released Kings exist solely on the turn of whoever set them
           loose, and that Jailbreak always resolves at the same discard that
           ends the turn — so no other player's turn can overlap an open one, and
           `isYourTurn && brig.active` is the whole condition. -->
      <div class="brigBox">
        <div class="brigInner">
          <div id="brigStrip" class="cardRow"></div>
          <div class="panelCount" id="brigCount"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<!-- One modal element serves both the King question and the Menu; only one can
     ever be open, and reusing it keeps a single dismissal path. -->
<div id="modalBackdrop" class="modalBackdrop">
  <div class="modalCard">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div id="modalChoices" class="modalChoices"></div>
  </div>
</div>

<div id="portFanOverlay" class="portFanOverlay hidden">
  <h3 id="portFanTitle">Port</h3>
  <div class="portFanRow" id="portFanRow"></div>
  <button class="wide" id="portFanClose">Close</button>
</div>

<div id="rotatePrompt">
  <img src="/assets/logo-wide.png" alt="Salty Schooner">
  <p style="font-size:1.2rem;color:var(--gold-lt);">Turn your phone sideways to play.</p>
</div>

<script src="/shared/api.js"></script>
<script src="/shared/engine.js"></script>
<script src="/shared/sfx.js"></script>
<script src="/shared/poller.js"></script>
<script src="/shared/vendor/supabase.js"></script>
<script src="/shared/realtime.js"></script>
<script>
const params = new URLSearchParams(location.search);
let roomId = params.get('room') || Persist.lastRoom();
const urlPid = params.get('pid');
const urlTok = params.get('tok');
let creds = roomId ? Persist.loadPlayer(roomId, urlPid) : null;

// Rejoin link: ?room=..&pid=..&tok=.. restores a seat on a device that no longer
// has its saved credentials. Still supported, but rejoining by name at /join is
// now the easier route for most cases.
if (roomId && urlPid && urlTok) {
  creds = { playerId: urlPid, resumeToken: urlTok };
  Persist.savePlayer(roomId, urlPid, urlTok, null, null);
  // Drop the token out of the address bar (and browser history) now that it's saved.
  if (history.replaceState) history.replaceState(null, '', '/play?room=' + roomId);
}
let selected = null; // {zone, card, index}
let lastView = null;
let fannedPort = null; // index of the Port currently spread open, or null

// The host is a player now, so this page carries their controls too. Holding a
// host token for THIS room is what makes them appear — /host saves it at
// creation time. Purely a display check: every host action is re-verified
// server-side against rooms.host_resume_token, so faking this in devtools
// reveals buttons that then get a 401.
let hostToken = roomId ? Persist.loadHost(roomId) : null;
const isHost = () => !!hostToken;

// Exactly one of these four is visible at a time. The choice bar and Port fan
// are fixed overlays that live OUTSIDE all of them, so leaving the board has to
// tear them down explicitly or they float over the lobby showing a dead game.
const SCREENS = ['waitPanel', 'lobbyPanel', 'resultsPanel', 'gameUi'];
function showScreen(id) {
  SCREENS.forEach(s => document.getElementById(s).classList.toggle('hidden', s !== id));
  if (id !== 'gameUi') { hideChoiceBar(); fannedPort = null; renderPortFan(); }
}

// Declared BEFORE the boot block below, which calls startPolling(): `const` is
// not hoisted, so defining the poller further down would put it in the temporal
// dead zone and throw on load. (poll/showPausedPanel are function declarations,
// so referencing them here is fine.)
//
// Rates are per-state on purpose: only the player actually taking a turn needs to
// feel instant. Waiting players were the bulk of the old invocation cost.
const poller = createPoller({
  poll,
  intervalFor: () => {
    // With the doorbell connected the server tells us the instant anything
    // changes, so the timer stops being how we find out and becomes a safety
    // net for a missed message. This single line is most of the invocation
    // saving — a waiting player drops from a poll every 3.5s to one every 45s.
    if (doorbell.isLive()) return 45000;
    if (!lastView) return 1200;
    if (lastView.status === 'LOBBY') return 3000;       // waiting for the host to start
    return lastView.isYourTurn ? 1200 : 3500;           // your turn vs watching
  },
  maxInterval: 10000,
  idleStopMs: 10 * 60 * 1000,
  onIdleStop: showPausedPanel
});

// Declared after the poller because its handler calls poller.wake(); function
// hoisting does not apply to `const`.
const doorbell = createDoorbell({
  roomId: () => roomId,
  label: 'play',
  // wake() rather than kick(): the idle stop may already have fired and put up
  // the paused panel, and a player returning to the table should not have to
  // find the Resume button before the game starts moving again. No DOM cleanup
  // here — render() either hides waitPanel outright or rewrites its contents,
  // so the paused card clears itself on the fetch this triggers.
  onChange: () => poller.wake(),
  // Recompute the delay immediately on a connection change, so losing the socket
  // restores fast polling now rather than after one more 45s wait.
  onLiveChange: () => poller.kick()
});

// One browser can now hold several seats (playing two sides yourself). With more
// than one saved and no ?pid= to disambiguate, ask rather than guess — silently
// resuming as the wrong player is worse than one extra tap.
function showSeatPicker(list) {
  const wait = document.getElementById('waitPanel');
  wait.innerHTML = '<p>Which seat is this?</p><div id="seatPicks"></div>';
  const box = document.getElementById('seatPicks');
  list.forEach(p => {
    const b = document.createElement('button');
    b.style.cssText = 'display:block;width:100%;max-width:320px;margin:8px auto;';
    b.textContent = p.name ? `${p.name} (seat ${p.seat + 1})` : `Seat ${p.seat + 1}`;
    b.onclick = () => {
      creds = p;
      if (history.replaceState) history.replaceState(null, '', '/play?room=' + roomId + '&pid=' + p.playerId);
      startPolling();
    };
    box.appendChild(b);
  });
}

if (!roomId) {
  document.getElementById('waitPanel').innerHTML = '<p>No saved seat found.</p><p><a href="/join" style="color:#ffe28a;">Join a room</a></p>';
} else if (creds) {
  startPolling();
} else {
  const saved = Persist.loadPlayers(roomId);
  if (saved.length > 1) showSeatPicker(saved);
  else document.getElementById('waitPanel').innerHTML = '<p>No saved seat found.</p><p><a href="/join" style="color:#ffe28a;">Join a room</a></p>';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 2200);
}

// A King played as a wildcard must still READ as a King. Showing only its
// effective value ("7♠") hides the King-on-King restriction and makes a legal
// board look like an illegal one. Mirrors renderCard() in app/index.html.
function cardHtml(c, extraClass) {
  if (!c) return '';
  const red = c.suit === '♥' || c.suit === '♦';
  const wild = c.rank === 'K' && c.effectiveValue;
  const arrow = c.playedDirection === 'up' ? '↑' : c.playedDirection === 'down' ? '↓' : '';
  const as = wild ? `<span class="asBadge">${Engine.VALUE_NAMES[c.effectiveValue]}${arrow}</span>` : '';
  return `<span class="card ${red ? 'red' : ''} ${wild ? 'king' : ''} ${extraClass || ''}">${c.rank}${c.suit}${as}</span>`;
}

// Spreads a whole Port pile open — mirrors togglePortFan() in app/index.html.
// Read-only: tapping a card inside the fan does nothing, same as hot-seat.
// Only the top (last) card is actually playable, so it gets marked.
function togglePortFan(i) {
  // Refuse while a King direction question is up — it occupies the same corner
  // of the screen and must be answered first.
  if (choiceBarOpen()) { showToast('Answer the King first.'); return; }
  fannedPort = (fannedPort === i) ? null : i;
  renderPortFan();
}
function renderPortFan() {
  const overlay = document.getElementById('portFanOverlay');
  // yourPorts is absent from a LOBBY view, so guard on it rather than on lastView
  // alone — a host reset can swap the view out while the fan is open.
  if (fannedPort === null || !lastView || !lastView.yourPorts) {
    fannedPort = null;
    overlay.classList.add('hidden');
    return;
  }
  const pile = lastView.yourPorts[fannedPort] || [];
  if (pile.length === 0) { fannedPort = null; overlay.classList.add('hidden'); return; }
  document.getElementById('portFanTitle').textContent = `Port ${fannedPort + 1} (${pile.length} card${pile.length === 1 ? '' : 's'})`;
  document.getElementById('portFanRow').innerHTML = pile.map((c, idx) => {
    const isTop = idx === pile.length - 1;
    return `<div class="portFanCell">${cardHtml(c, isTop ? 'top' : '')}${isTop ? '<div class="portFanTopLabel">TOP</div>' : ''}</div>`;
  }).join('');
  overlay.classList.remove('hidden');
}
document.getElementById('portFanClose').addEventListener('click', () => { fannedPort = null; renderPortFan(); });

function selectCard(zone, card, index) {
  if (!lastView.isYourTurn) return;
  // Picking a different card abandons any King direction question still on
  // screen — that question belongs to the card you were playing a moment ago.
  hideChoiceBar();
  // Tapping the selected card again clears it. Without this you cannot get from
  // "hand card selected" back to "nothing selected", which is the state a Port
  // pickup requires.
  if (selected && selected.card.id === card.id) { selected = null; Sfx.play('deselect'); render(lastView); return; }
  selected = { zone, card, index };
  Sfx.play('select');
  render(lastView);
}

// Mirrors window.portTap() in app/index.html: a Port tile is both the discard
// target AND the way to pick a card back out of a Port to play it to a Run.
function portTap(portIndex) {
  if (!lastView.isYourTurn) return;
  if (selected && selected.zone === 'hand') return discardTo(portIndex);
  const pile = lastView.yourPorts[portIndex] || [];
  const top = pile[pile.length - 1];
  if (top) return selectCard('discard', top, portIndex);
  showToast('Select a hand card first to discard here.');
}

function legalRunIndexes(card) {
  if (!lastView) return [];
  return lastView.runs.map((r,i)=>i).filter(i => Engine.canPlayCardOnRun(card, lastView.runs[i]));
}

async function attemptPlay(runIndex) {
  if (!selected) return;
  const card = selected.card;
  const run = lastView.runs[runIndex];
  if (!Engine.canPlayCardOnRun(card, run)) { Sfx.play('illegal'); showToast('Illegal play.'); return; }
  if (card.rank === 'K') {
    let choices;
    if (!run.direction) {
      choices = Engine.unsetNaturalKingChoices(run).map(c => ({ label: `King as ${Engine.VALUE_NAMES[c.kingValue]} — ${c.dir.toUpperCase()}`, value: c.kingValue, dir: c.dir }));
    } else {
      const required = Engine.kingRequiredValue(run);
      choices = ['up','down'].map(dir => ({ label: `Continue ${dir.toUpperCase()} as ${Engine.VALUE_NAMES[required]}`, value: required, dir }));
    }
    // Capture the card id NOW. Previously sendPlay() read `selected` at the
    // moment a choice was tapped, so changing selection while the question was
    // on screen answered it with the wrong card — committing a King and then
    // touching a hand card played the hand card instead, King untouched.
    showChoiceBar(choices, (choice) => sendPlay(card.id, runIndex, { value: choice.value, dir: choice.dir }));
    return;
  }
  sendPlay(card.id, runIndex, undefined);
}

// ---- Modal ------------------------------------------------------------------
// Lifted from hot-seat's showModal(): dimmed backdrop, titled card, a row of
// choice buttons. Replaces the old docked choiceBar, which had nowhere to live
// once the landscape layout claimed every region of the screen.
function hideChoiceBar() {
  document.getElementById('modalBackdrop').classList.remove('show');
}
function choiceBarOpen() {
  return document.getElementById('modalBackdrop').classList.contains('show');
}
function showModal(title, bodyHtml, choices) {
  // The Port fan is a bottom sheet and would sit under the backdrop looking
  // half-interactive. Close it before anything opens over the top.
  fannedPort = null; renderPortFan();
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml || '';
  const box = document.getElementById('modalChoices');
  box.innerHTML = '';
  (choices || []).forEach(c => {
    const b = document.createElement('button');
    b.textContent = c.label;
    if (c.secondary) b.className = 'secondary';
    b.onclick = () => { hideChoiceBar(); if (c.action) c.action(); };
    box.appendChild(b);
  });
  document.getElementById('modalBackdrop').classList.add('show');
}
// Kept under its old name so attemptPlay()'s King path needs no rewiring.
function showChoiceBar(choices, onPick) {
  showModal(
    'Captain’s Orders',
    '<p>Which direction does the run continue?</p>',
    choices.map(c => ({ label: c.label, action: () => onPick(c) }))
  );
}

async function sendPlay(cardId, runIndex, kingChoice) {
  try {
    const res = await Api.submitAction({
      roomId, actorType: 'player', token: creds.resumeToken, playerId: creds.playerId,
      action: { type: 'PLAY_CARD', cardId, runIndex, kingChoice },
      expectedVersion: lastView.stateVersion
    });
    selected = null;
    Sfx.play('place');
    applyView(res.view);
    poller.kick();   // act, then re-sync at once rather than waiting out a backed-off delay
  } catch (e) {
    Sfx.play('illegal');
    showToast(e.message);
    selected = null;
    render(lastView);
  }
}

async function discardTo(portIndex) {
  if (!selected || selected.zone !== 'hand') { Sfx.play('illegal'); showToast('Select a card from your hand first.'); return; }
  try {
    const res = await Api.submitAction({
      roomId, actorType: 'player', token: creds.resumeToken, playerId: creds.playerId,
      action: { type: 'DISCARD_TO_PORT', cardId: selected.card.id, portIndex },
      expectedVersion: lastView.stateVersion
    });
    selected = null;
    Sfx.play('discard');
    applyView(res.view);
    poller.kick();   // act, then re-sync at once rather than waiting out a backed-off delay
  } catch (e) {
    Sfx.play('illegal');
    showToast(e.message);
  }
}

document.getElementById('drawBtn').addEventListener('click', async () => {
  try {
    const res = await Api.submitAction({
      roomId, actorType: 'player', token: creds.resumeToken, playerId: creds.playerId,
      action: { type: 'DRAW_HAND' },
      expectedVersion: lastView.stateVersion
    });
    Sfx.play('ui');
    applyView(res.view);
    poller.kick();   // act, then re-sync at once rather than waiting out a backed-off delay
  } catch (e) { Sfx.play('illegal'); showToast(e.message); }
});

function renderLobby(view) {
  showScreen('lobbyPanel');
  document.getElementById('lobbyCode').textContent = view.roomCode || '';
  document.getElementById('lobbyJoinHint').textContent =
    'Others join at ' + location.host + '/join and enter this code.';

  // Mark which chip is you. seat is absent on a ?tok= rejoin, in which case
  // nothing is highlighted rather than highlighting the wrong person.
  const mySeat = creds && typeof creds.seat === 'number' ? creds.seat : null;
  const players = view.players || [];
  document.getElementById('lobbyPlayers').innerHTML =
    players.map(p => `<div class="playerChip ${p.seat === mySeat ? 'you' : ''}">${p.name}</div>`).join('')
    || '<span class="meta">Nobody yet…</span>';

  document.getElementById('lobbyHostControls').classList.toggle('hidden', !isHost());
  document.getElementById('lobbyWaitText').classList.toggle('hidden', isHost());
  if (isHost()) {
    // The host occupies a seat, so this is 1 already — one other player is enough.
    document.getElementById('startBtn').disabled = players.length < 2;
  }
}

function renderResults(view) {
  showScreen('resultsPanel');
  const panel = document.getElementById('resultsPanel');
  const gameOver = view.status === 'GAME_RESULTS';
  // Lowest total wins — hand and HOLD cards are penalty points.
  const rows = gameOver ? [...view.players].sort((a, b) => a.total - b.total) : view.players;

  let html = gameOver
    ? `<h2>Game over — ${rows[0].name} wins</h2>`
    : `<h2>Round ${view.round} complete</h2>`;
  html += rows.map(p => `<div class="scoreRow"><span>${p.name}</span><span>${
    gameOver ? p.total : `+${p.roundScore} (${p.total})`
  }</span></div>`).join('');

  if (!isHost()) {
    html += '<p class="meta" style="margin-top:22px;">Waiting for the host…</p>';
  } else if (gameOver) {
    html += '<p style="margin-top:22px;"><button id="resultsResetBtn" class="secondary">Back to the lobby</button></p>';
  } else if (view.pendingClinch) {
    html += `<p style="margin-top:18px;"><b>${view.pendingClinch}</b> has clinched the game.</p>`
      + '<p><button id="endNowBtn">End game now</button></p>'
      + '<p><button id="nextRoundBtn" class="secondary">Keep playing</button></p>';
  } else {
    html += '<p style="margin-top:22px;"><button id="nextRoundBtn">Start next round</button></p>'
      + '<p style="margin-top:12px;"><button id="resultsResetBtn" class="secondary tiny">Reset game</button></p>';
  }
  panel.innerHTML = html;

  // Rebuilt every render, so these are wired fresh rather than once at load.
  const next = document.getElementById('nextRoundBtn');
  if (next) next.onclick = () => advanceRound(false, view);
  const end = document.getElementById('endNowBtn');
  if (end) end.onclick = () => advanceRound(true, view);
  const rst = document.getElementById('resultsResetBtn');
  if (rst) rst.onclick = doReset;
}

async function advanceRound(endNow, view) {
  try {
    await Api.submitAction({
      roomId, actorType: 'host', token: hostToken,
      action: { type: 'ADVANCE_ROUND', endNow },
      expectedVersion: view.stateVersion
    });
    poller.kick();
  } catch (e) { showToast(e.message); }
}

async function doReset() {
  if (!isHost()) return;
  if (!confirm('Reset this game for everyone? Progress will be lost. Players keep their seats and do not need to rejoin.')) return;
  try {
    await Api.resetGame(roomId, hostToken);
    poller.kick();
  } catch (e) { showToast(e.message); }
}

function render(view) {
  // A LOBBY response is getLobbyView, not getPlayerView — no hand, HOLD or
  // Ports — so the board code below would throw on view.yourHand.map(...).
  // This is also the state a host reset drops everyone into mid-game.
  if (view.status === 'LOBBY') {
    // Drop any held selection. Card ids come from a uid counter in the engine
    // that restarts at 1 on a cold function instance, so a card dealt after the
    // reset can carry the same id as the one selected before it — a stale
    // `selected` would then match the wrong card by id in the next game.
    selected = null;
    renderLobby(view);
    return;
  }
  if (view.status === 'ROUND_RESULTS' || view.status === 'GAME_RESULTS') {
    selected = null;
    renderResults(view);
    return;
  }
  showScreen('gameUi');
  document.getElementById('rotatePrompt').classList.add('armed');

  const bar = document.getElementById('turnBar');
  document.getElementById('turnText').textContent =
    view.isYourTurn ? 'Your Turn' : `${view.currentPlayerName}'s turn`;
  document.getElementById('roundMeta').textContent = `Round ${view.round}/${view.maxRounds}`;
  bar.classList.toggle('myTurn', view.isYourTurn);

  // Runs are bare tap targets in couch mode. NO legality highlight anywhere —
  // Nick, 2026-08-02: telegraphing where a card can go removes the skill. Remote
  // mode adds the card contents back, because then no TV is carrying them.
  // The direction- class is a different thing and stays in both modes: it states
  // the run's own direction, not whether your selection fits there.
  const showCards = displayMode() === 'remote';
  document.getElementById('runsGrid').innerHTML = view.runs.map((r, i) => {
    const cards = showCards
      ? `<div class="cardRow">${r.cards.slice(-3).map(c => cardHtml(c)).join('')}</div>`
      : '';
    return `<div class="run direction-${r.direction || 'unset'} ${showCards ? 'showCards' : ''}" data-run="${i}">`
      + `<div>RUN ${i + 1}</div>${cards}</div>`;
  }).join('');
  document.querySelectorAll('#runsGrid .run').forEach(el => {
    el.addEventListener('click', () => attemptPlay(Number(el.dataset.run)));
  });

  document.getElementById('handRow').innerHTML = view.yourHand.map(c => {
    const sel = selected && selected.zone === 'hand' && selected.card.id === c.id;
    return `<span class="card slot ${c.suit==='♥'||c.suit==='♦'?'red':''} ${sel?'selected':''}" data-id="${c.id}">${c.rank}${c.suit}</span>`;
  }).join('') || '<span class="meta">Empty</span>';
  document.querySelectorAll('#handRow .card').forEach(el => {
    el.addEventListener('click', () => {
      const c = view.yourHand.find(c => c.id === el.dataset.id);
      selectCard('hand', c);
    });
  });
  // Drawing is always a choice now. The server decides eligibility (start-of-turn
  // quota, or a refill because the hand is empty) and sends the count; 0 hides it.
  const drawBtn = document.getElementById('drawBtn');
  const drawable = view.yourDrawCount || 0;
  drawBtn.classList.toggle('hidden', !(view.isYourTurn && drawable > 0));
  // Deliberately no number: how many you are owed depends on the start-of-turn
  // quota and whether the hand has been cleared, and a label stating a count is
  // one more thing that can drift out of step with what the server deals. The
  // server decides the amount; the button just offers the choice.
  drawBtn.textContent = 'Draw\nCards';

  document.getElementById('portsGrid').innerHTML = view.yourPorts.map((pile,i) => {
    const top = pile[pile.length-1];
    const sel = selected && selected.zone === 'discard' && selected.index === i;
    const badge = pile.length > 0 ? `<span class="portBadge" data-fan="${i}">${pile.length}</span>` : '';
    return `<div class="port" data-port="${i}">${top ? cardHtml(top, sel ? 'selected' : '') : '<span class="meta">Port '+(i+1)+'</span>'}${badge}<div class="count">${pile.length}</div></div>`;
  }).join('');
  document.querySelectorAll('#portsGrid .port').forEach(el => {
    el.addEventListener('click', () => portTap(Number(el.dataset.port)));
  });
  document.querySelectorAll('#portsGrid .portBadge').forEach(el => {
    el.addEventListener('click', (e) => { e.stopPropagation(); togglePortFan(Number(el.dataset.fan)); });
  });
  renderPortFan();

  document.getElementById('holdCard').innerHTML = (() => {
    if (!view.yourGoalTop) return '<span class="meta">Cleared!</span>';
    const sel = selected && selected.zone === 'goal';
    return `<span class="card slot ${view.yourGoalTop.suit==='♥'||view.yourGoalTop.suit==='♦'?'red':''} ${sel?'selected':''}" id="holdTop">${view.yourGoalTop.rank}${view.yourGoalTop.suit}</span>`;
  })();
  const holdTop = document.getElementById('holdTop');
  if (holdTop) holdTop.addEventListener('click', () => selectCard('goal', view.yourGoalTop));
  document.getElementById('holdCount').textContent = view.yourGoalCount + ' cards';

  // Your Brig fills ONLY during your own Jailbreak. The waiting Kings are public
  // and live on /tv; what belongs here are the Kings you personally have to play
  // before you discard. Released Kings only exist on the turn of whoever sprang
  // them, so this condition already scopes it to the right player.
  const b = view.brig;
  const mineToPlay = b.active && view.isYourTurn;
  document.getElementById('brigStrip').innerHTML = mineToPlay
    ? b.releasedKings.map(c => {
        const sel = selected && selected.zone === 'jailbreak' && selected.card.id === c.id;
        return `<span class="card slot ${sel ? 'selected' : ''}" data-jb="${c.id}">${c.rank}${c.suit}</span>`;
      }).join('')
    : '';
  document.getElementById('brigCount').textContent = mineToPlay
    ? `JAILBREAK — play ${b.releasedKings.length}`
    : '';
  document.querySelectorAll('#brigStrip [data-jb]').forEach(el => {
    el.addEventListener('click', () => {
      const c = view.brig.releasedKings.find(c => c.id === el.dataset.jb);
      selectCard('jailbreak', c);
    });
  });

}

function applyView(view) {
  // Drop a view that is older than what we already show. A poll GET issued just
  // before an action's POST commits will answer with pre-action state and arrive
  // afterwards, briefly reverting the board — your card visibly jumps back into
  // your hand. Only compare when both sides carry a version: a LOBBY view (host
  // reset) has none and must always be allowed through.
  if (lastView && typeof lastView.stateVersion === 'number'
      && typeof view.stateVersion === 'number'
      && view.stateVersion < lastView.stateVersion) {
    return;
  }
  lastView = view;
  render(view);
}

async function poll() {
  try {
    const view = await Api.getPlayerState(roomId, creds.playerId, creds.resumeToken);
    applyView(view);
    // Signature the poller compares to decide whether anything actually moved.
    // LOBBY views carry no stateVersion, hence the status fallback.
    return (view.status || '') + ':' + (view.stateVersion == null ? '' : view.stateVersion);
  } catch (e) {
    console.error(e);
    return 'error';
  }
}

function showPausedPanel() {
  const wait = document.getElementById('waitPanel');
  showScreen('waitPanel');
  wait.innerHTML = '<p>Paused — this tab went quiet for a while.</p>'
    + '<p class="meta">Stopped checking for updates so it isn’t running in the background.</p>'
    + '<button id="resumeBtn" style="margin-top:14px;">Resume game</button>';
  document.getElementById('resumeBtn').addEventListener('click', () => {
    wait.classList.add('hidden');
    poller.start();
  });
}

// ---- Display mode -----------------------------------------------------------
// PER-DEVICE, not per-room. The server sends every device the same payload; the
// only difference is what a device chooses to draw. "couch" hides the shared
// board because a /tv is carrying it; "remote" draws it here instead. This is
// what lets one room mix both — Nick's mother playing remote while everyone
// else is on a couch. Stored locally, so each phone keeps its own answer.
// Sound preference persists per device too. Sfx exposes setEnabled/isEnabled but
// keeps no storage of its own, so the choice would reset on every reload without
// this; the stored value is pushed back into Sfx at boot, below.
const SOUND_KEY = 'salty-sound-on';
function soundOn() { return Sfx.isEnabled(); }
function setSoundOn(v) {
  Sfx.setEnabled(v);
  localStorage.setItem(SOUND_KEY, v ? '1' : '0');
}
if (localStorage.getItem(SOUND_KEY) === '0') Sfx.setEnabled(false);

const MODE_KEY = 'salty-display-mode';
function displayMode() { return localStorage.getItem(MODE_KEY) || 'couch'; }
function setDisplayMode(m) {
  localStorage.setItem(MODE_KEY, m);
  if (lastView) render(lastView);
}

// ---- Menu -------------------------------------------------------------------
// Everything that is not a card play lives here: scoreboard, sound, the mode
// switch, and (for the host) the round controls that used to sit in a corner
// strip. Nick, 2026-08-02 — "the host controls should live in the menu also,
// along with the reset/admin page button."
function openMenu() {
  const v = lastView;
  if (!v) return;
  const mode = displayMode();

  let html = '<div class="menuSection"><h3>Scores</h3>';
  html += (v.players || []).map(p =>
    `<div class="menuScore ${p.seat === v.currentSeat ? 'turn' : ''}">`
    + `<span>${p.name}${p.seat === v.yourSeat ? ' (you)' : ''}</span>`
    + `<span>${p.goalCount} in HOLD · ${p.total} pts</span></div>`).join('');
  html += '</div>';

  html += `<div class="menuSection"><h3>This device</h3>
    <div class="menuBtns">
      <button id="mCouch" class="${mode === 'couch' ? '' : 'secondary'}">Couch mode</button>
      <button id="mRemote" class="${mode === 'remote' ? '' : 'secondary'}">Remote mode</button>
      <button id="mSound" class="secondary">Sound: ${soundOn() ? 'on' : 'off'}</button>
    </div>
    <p class="meta" style="font-size:1.6dvh;margin-top:1dvh;">
      Couch mode hides the shared board because the TV is showing it.
      Remote mode draws the runs here instead.</p></div>`;

  if (isHost()) {
    const roundBtn = v.status === 'ROUND_RESULTS'
      ? '<button id="mNextRound">Next round</button>' : '';
    html += `<div class="menuSection"><h3>Host</h3><div class="menuBtns">
      ${roundBtn}
      <button id="mReset" class="secondary">Reset game</button>
      <button id="mAdmin" class="secondary">Admin page</button>
    </div></div>`;
  }

  showModal('Menu', html, [{ label: 'Close', secondary: true }]);

  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on('mCouch', () => { setDisplayMode('couch'); hideChoiceBar(); });
  on('mRemote', () => { setDisplayMode('remote'); hideChoiceBar(); });
  on('mSound', () => {
    setSoundOn(!soundOn());
    hideChoiceBar();
    openMenu();   // reopen so the label reflects the new state
  });
  on('mNextRound', () => { hideChoiceBar(); advanceRound(false, v); });
  on('mReset', () => { hideChoiceBar(); doReset(); });
  on('mAdmin', () => { location.href = '/admin'; });
}
document.getElementById('menuBtn').addEventListener('click', openMenu);

// Host-only controls. These live in static markup rather than being rebuilt per
// render, so they are wired once here. They stay inert for non-hosts: the
// panels holding them are hidden, and every handler re-checks isHost().
document.getElementById('startBtn').addEventListener('click', async () => {
  if (!isHost()) return;
  const btn = document.getElementById('startBtn');
  btn.disabled = true;
  try {
    await Api.startGame(roomId, hostToken);
    poller.kick();
  } catch (e) {
    showToast(e.message);
    btn.disabled = false;   // re-enable so a failed start can be retried
  }
});
document.getElementById('lobbyResetBtn').addEventListener('click', doReset);
// (The in-game Reset button moved into the Menu modal — see openMenu().)

function startPolling() {
  poller.start();
  doorbell.start();
}
</script>
</body>
</html>
