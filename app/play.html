<script src="/shared/realtime.js"></script>
<script>
const params = new URLSearchParams(location.search);
let roomId = params.get('room') || Persist.lastRoom();
const urlPid = params.get('pid');
const urlTok = params.get('tok');
let creds = roomId ? Persist.loadPlayer(roomId, urlPid) : null;

// Rejoin link: ?room=..&pid=..&tok=.. restores a seat on a device that no longer
// has its saved credentials. Still supported, but rejoining by name at /join is
// now the easier route for most cases.
if (roomId && urlPid && urlTok) {
  creds = { playerId: urlPid, resumeToken: urlTok };
  Persist.savePlayer(roomId, urlPid, urlTok, null, null);
  // Drop the token out of the address bar (and browser history) now that it's saved.
  if (history.replaceState) history.replaceState(null, '', '/play?room=' + roomId);
}
let selected = null; // {zone, card, index}
let lastView = null;
let fannedPort = null; // index of the Port currently spread open, or null

// ---- Instrumentation --------------------------------------------------------
// Added 2026-08-13 to settle with numbers, not theory, why taps feel laggy and
// inconsistent — and worse on a phone than on a desktop. Three suspects were on
// the table, they need different fixes, so they have to be measured APART:
//   1. the input lock refusing a tap that arrives while a request is in flight
//      (produces a click that inputLocked() then drops),
//   2. a full-board innerHTML rebuild replacing the card element BETWEEN a touch
//      going down and coming up, which loses the tap before a click ever fires,
//   3. plain network/server latency before the card appears in the run.
//
// Client durations only ever subtract two performance.now() readings from the
// SAME clock. Server-side timings are reported separately and never differenced
// against client time: the clocks are unrelated, and subtracting them gives a
// number that looks precise and means nothing.
//
// Percentiles, not averages: the complaint is intermittent, so the tail is the
// whole story and a mean hides it.
//
// A phone has no console, which is where this has to be read — Menu → Timings.
const Perf = {
  MAX: 400,
  actions: [],
  renders: [],
  seq: 0,
  counts: { tapGestures: 0, lostTaps: 0, swallowed: 0, rendersSuppressed: 0, rendersDeferred: 0,
            predicted: 0, resyncs: 0 },
  // Renders split by what asked for them, and every poll tagged with whether
  // the doorbell was live at the time. Without this it is impossible to tell a
  // screen sitting on the 45s safety net from one that has silently fallen back
  // to fast polling — which changes the diagnosis completely, and is the
  // difference between "rebuilds are rare" and "rebuilds are constant".
  byCause: {},
  polls: { live: 0, down: 0 },
  device: (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ? 'touch' : 'mouse',
  now() { return performance.now(); },
  cap(a) { if (a.length > this.MAX) a.splice(0, a.length - this.MAX); },

  // One row per attempted play, carrying a unique id. The id is what lets a
  // response be matched to the tap that caused it rather than to whatever
  // happens to be in flight when it lands, and what would make a duplicate or
  // retried send identifiable if the optimistic queue is built later.
  startAction(kind) {
    const rec = { id: ++this.seq, kind, device: this.device, outcome: 'pending', t: { tap: this.now() } };
    this.actions.push(rec); this.cap(this.actions);
    return rec;
  },
  mark(rec, name) { if (rec) rec.t[name] = this.now(); },
  finish(rec, outcome) { if (rec) { rec.outcome = outcome; rec.t.done = this.now(); } },
  bump(cause, kind) {
    const k = cause || 'unknown';
    (this.byCause[k] || (this.byCause[k] = { drawn: 0, skipped: 0 }))[kind]++;
  },
  noteRender(ms, cause) {
    this.renders.push({ ms, cause: cause || 'unknown' });
    this.cap(this.renders);
    this.bump(cause, 'drawn');
  },
  notePoll(live) { this.polls[live ? 'live' : 'down']++; },

  // Suspect (2) leaves a specific fingerprint: a press on a tap target that
  // never produces a click.
  //
  // This was FIRST WRITTEN as two global counters subtracted from each other,
  // which was wrong and produced a nonsense reading in the field (-4 unmatched:
  // more clicks than presses, which cannot describe lost taps). Two counters
  // over different event scopes cannot be differenced — a click arriving
  // without a matching press silently cancelled out a real loss. Each gesture
  // is now correlated individually: one press, did its own click arrive.
  //
  // A press that MOVES is a drag or a scroll, not a lost tap, so it is excluded
  // by distance rather than left to inflate the number.
  noteTapGesture(lost) { this.counts.tapGestures++; if (lost) this.counts.lostTaps++; },
  // A refused tap is not one thing. It matters whether input was held by a
  // non-predictable action mid-flight, by the predicted queue still draining, or
  // by an old-style pending play — those have different fixes, and a bare count
  // cannot tell them apart.
  busyReasons: {},
  noteSwallowed(reason) {
    this.counts.swallowed++;
    const k = reason || 'unknown';
    this.busyReasons[k] = (this.busyReasons[k] || 0) + 1;
  },

  pct(arr, p) {
    if (!arr.length) return null;
    const s = arr.slice().sort((a, b) => a - b);
    return Math.round(s[Math.min(s.length - 1, Math.floor(p / 100 * s.length))]);
  },
  // Split by kind rather than pooled. Kings ('play-king') are excluded from both
  // because their path opens a direction modal, so tap→feedback would measure
  // how long a human took to decide and would swamp every percentile.
  //
  // Predicted and confirmed plays MUST be reported separately: the first phone
  // readout after prediction shipped showed only the confirmed rows, because
  // this filter excluded the predicted ones and nothing reported them — the
  // table showed the plays that still wait and none of the ones that no longer
  // do, which read as "no improvement" when ten plays had gone from ~400ms to
  // about one.
  spans(kind) {
    const ok = this.actions.filter(a => a.outcome === 'accepted' && a.kind === kind);
    const pick = fn => ok.map(fn).filter(v => typeof v === 'number' && isFinite(v) && v >= 0);
    return {
      feedback: pick(a => a.t.feedback - a.t.tap),
      inRun:    pick(a => a.t.rendered - a.t.tap),
      network:  pick(a => a.t.response - a.t.request),
      locked:   pick(a => a.t.done - a.t.tap)
    };
  },
  // Server stages come back as DURATIONS measured on the server's own clock, so
  // nothing here differences two different clocks. "outside" is the part of the
  // round trip the function did not account for — transit, cold start, queueing
  // — which is where a 2-second tail would have to be hiding.
  serverSpans() {
    const w = this.actions.filter(a => a.server && typeof a.server.total === 'number');
    const pick = fn => w.map(fn).filter(v => typeof v === 'number' && isFinite(v) && v >= 0);
    return {
      total:   pick(a => a.server.total),
      reads:   pick(a => a.server.reads),
      rules:   pick(a => a.server.rules),
      write:   pick(a => a.server.write),
      pulse:   pick(a => a.server.pulse),
      outside: pick(a => (a.t.response - a.t.request) - a.server.total)
    };
  },
  summary() {
    const pred = this.spans('play-predicted');
    const conf = this.spans('play');
    const srv = this.serverSpans();
    const row = (m, arr) => ({ metric: m, n: arr.length, p50: this.pct(arr, 50), p75: this.pct(arr, 75), p95: this.pct(arr, 95) });
    return {
      device: this.device,
      counts: Object.assign({}, this.counts),
      busyReasons: Object.assign({}, this.busyReasons),
      ms: [
        row('PREDICTED tap→card in run', pred.inRun),
        row('waited   tap→card in run', conf.inRun),
        row('waited   tap→feedback', conf.feedback),
        row('request→response', pred.network.concat(conf.network)),
        row('server: total in function', srv.total),
        row('server:   db reads', srv.reads),
        row('server:   rules', srv.rules),
        row('server:   db write', srv.write),
        row('server:   pulse', srv.pulse),
        row('outside function', srv.outside),
        row('render duration', this.renders.map(r => r.ms))
      ]
    };
  },
  text() {
    const s = this.summary();
    const n = v => (v == null ? '—' : v + 'ms');
    return `device: ${s.device}\n`
      + `taps on a target: ${s.counts.tapGestures}, lost (no click): ${s.counts.lostTaps}\n`
      + `taps refused while busy: ${s.counts.swallowed}`
      + ` (${Object.keys(s.busyReasons).map(k => k + ' ' + s.busyReasons[k]).join(', ') || 'none'})\n`
      + `predicted plays: ${s.counts.predicted || 0}, resyncs: ${s.counts.resyncs || 0}\n`
      + `renders: ${this.renders.length} drawn, ${s.counts.rendersSuppressed} skipped`
      + ` (unchanged), ${s.counts.rendersDeferred} held for a gesture\n`
      + `polls while realtime live: ${this.polls.live}, while down: ${this.polls.down}\n`
      + 'by cause: ' + (Object.keys(this.byCause).map(k =>
          `${k} ${this.byCause[k].drawn}drawn/${this.byCause[k].skipped}skipped`).join(', ') || '—') + '\n\n'
      + s.ms.map(r => `${r.metric}  n=${r.n}  p50 ${n(r.p50)}  p75 ${n(r.p75)}  p95 ${n(r.p95)}`).join('\n');
  }
};
window.Perf = Perf;   // so a desktop console can reach it too

// ---- Gesture-safe rendering -------------------------------------------------
// render() replaces the runs, hand, Ports, HOLD and Brig via innerHTML and
// rebinds every listener. Every gameplay tap target is bound with 'click', and a
// click only fires when the press and the release resolve to the same element —
// so a render landing between a finger going down and coming up DESTROYS the
// element the press landed on and the tap is lost outright. No CPU slowness is
// needed to produce this; it is pure DOM timing, and a touch is held longer than
// a mouse click, which is why a phone would feel it more than a desktop.
//
// So: while a pointer is down on the board, hold renders. Only the NEWEST view
// is kept — an older one that never got drawn has no value once a newer one has
// arrived, and coalescing keeps this from queueing up work.
let pointerActive = false;
let renderPending = false;
let pendingCause = null;
let pointerGuardTimer = null;
let flushGraceTimer = null;
// What triggered the next fetch, so a render can be attributed to a doorbell
// pulse rather than to the timer. Reset to 'timer' each time it is consumed.
let nextPollCause = 'timer';
// Nothing may freeze the board indefinitely. A pointer that never reports its
// release (capture lost to a system gesture, a tab switched mid-touch) would
// otherwise hold every render forever, which is a far worse bug than the one
// this guard fixes.
const POINTER_GUARD_MAX_MS = 1000;
// How long to keep holding after a release that produces NO click — a drag, a
// scroll, a press on bare board. Sized for mobile Safari, where the click after
// a touch can be dispatched in a LATER task than pointerup rather than beside
// it: a setTimeout(0) flush would beat that click and destroy the element,
// which is the exact bug this guard exists to prevent. Real taps do not wait
// this out — they flush on their own click, below.
const FLUSH_GRACE_MS = 350;
// One definition of "a thing you can tap", used for both the pointerdown and
// the click counter. Counting different sets on each side would make the
// unmatched-pointerdown figure meaningless — a click on bare board would cancel
// out a genuinely lost tap on a card.
const TAP_TARGETS = '[data-run],[data-id],[data-port],[data-jb],#holdTop';

// The gesture currently under a finger, correlated individually so a lost tap
// is measured per press rather than inferred by subtracting global totals.
let gesture = null;   // { onTarget, matched, x, y, moved }

function beginGesture(e) {
  pointerActive = true;
  gesture = {
    onTarget: !!(e && e.target.closest && e.target.closest(TAP_TARGETS)),
    matched: false,
    x: e ? e.clientX : 0,
    y: e ? e.clientY : 0,
    moved: 0
  };
  clearTimeout(flushGraceTimer);
  flushGraceTimer = null;
  clearTimeout(pointerGuardTimer);
  pointerGuardTimer = setTimeout(() => endGesture(true), POINTER_GUARD_MAX_MS);
}

// Only a press that stayed put and produced no click counts as lost; anything
// that travelled was a scroll or a drag and never wanted a click.
const TAP_SLOP_PX = 12;
function scoreGesture() {
  if (!gesture) return;
  if (gesture.onTarget) Perf.noteTapGesture(!gesture.matched && gesture.moved <= TAP_SLOP_PX);
  gesture = null;
}

function endGesture(fromTimeout) {
  if (!pointerActive) return;
  pointerActive = false;
  clearTimeout(pointerGuardTimer);
  pointerGuardTimer = null;
  // The safety timeout fires between tasks by definition, so it cannot land in
  // the pointerup→click gap and may draw at once.
  if (fromTimeout) { flushDeferredRender(); return; }
  // A normal release waits for the click it is about to produce (see
  // FLUSH_GRACE_MS). The click handler below flushes as soon as it arrives, so
  // this timer only ever pays out for gestures that were not taps.
  clearTimeout(flushGraceTimer);
  flushGraceTimer = setTimeout(flushDeferredRender, FLUSH_GRACE_MS);
}

function flushDeferredRender() {
  clearTimeout(flushGraceTimer);
  flushGraceTimer = null;
  if (pointerActive) return;
  scoreGesture();
  if (!renderPending) return;
  renderPending = false;
  const cause = pendingCause;
  pendingCause = null;
  if (lastView) render(shownView(), (cause ? cause + '+' : '') + 'deferred');
}

// Bound once, on the persistent container — #gameUi itself is never rebuilt,
// only its children are. Capture phase so this is seen even if a handler below
// stops propagation (the Port badge does).
const gameUiEl = document.getElementById('gameUi');
gameUiEl.addEventListener('pointerdown', beginGesture, true);
gameUiEl.addEventListener('click', (e) => {
  if (gesture && e.target.closest(TAP_TARGETS)) gesture.matched = true;
  // Capture phase runs BEFORE the card's own handler, so yielding one task lets
  // that handler finish — and paint its optimistic feedback — before the board
  // is rebuilt underneath it.
  setTimeout(flushDeferredRender, 0);
}, true);
// pointerup can land outside the element — or outside the window — so the
// release is watched on the document, not on #gameUi.
document.addEventListener('pointermove', (e) => {
  if (!gesture) return;
  gesture.moved = Math.max(gesture.moved,
    Math.abs(e.clientX - gesture.x) + Math.abs(e.clientY - gesture.y));
}, true);
document.addEventListener('pointerup', () => endGesture(false), true);
document.addEventListener('pointercancel', () => endGesture(false), true);
window.addEventListener('blur', () => endGesture(true));

// ---- Optimistic play feedback ----------------------------------------------
// A play costs a ~300ms server round-trip that no amount of tuning removes (the
// DB work measured as a rounding error; it is invocation and network), so the
// tap has to LOOK answered before the answer arrives.
//
// The hard rule: this NEVER fakes state. lastView is not mutated, no card is
// moved into a run, nothing is rendered as though the action succeeded. It only
// fades the source card and rings the target, so the worst case on rejection is
// a card fading back in — never a board that disagrees with the server. That is
// the failure this project has hit twice; it is not worth re-opening for
// perceived speed.
//
// Kings, Jailbreak plays, discards and draws are deliberately excluded: Kings
// route through a modal, and the others have consequences (Brig release, payout)
// that this feedback would misrepresent.
let pendingPlay = null;      // { cardId, runIndex } while a PLAY_CARD is in flight
let pendingTimer = null;
const PENDING_TIMEOUT_MS = 8000;

function beginPendingPlay(cardId, runIndex) {
  pendingPlay = { cardId, runIndex };
  Sfx.play('place');         // sound now, not when the server agrees
  paintPending();
  // Failsafe: if the request never settles — phone loses WiFi mid-tap — neither
  // then() nor catch() runs and input would stay locked forever. This releases
  // it and repaints the authoritative view; a late response still applies
  // correctly afterwards because applyView is version-guarded.
  clearTimeout(pendingTimer);
  pendingTimer = setTimeout(() => {
    if (!pendingPlay) return;
    clearPendingPlay();
    if (lastView) render(shownView());
    showToast('Still waiting on the server — try again.');
  }, PENDING_TIMEOUT_MS);
}

function clearPendingPlay() {
  pendingPlay = null;
  clearTimeout(pendingTimer);
  pendingTimer = null;
  document.querySelectorAll('#gameUi .card.pending').forEach(el => el.classList.remove('pending'));
  document.querySelectorAll('#runsGrid .run.pendingTarget').forEach(el => el.classList.remove('pendingTarget'));
}

// Re-applied at the end of render() as well as on tap: the poller is still
// running during those ~300ms, and a tick landing mid-flight rebuilds the hand
// and would silently restore the card that was just faded out.
function paintPending() {
  if (!pendingPlay) return;
  const card = document.querySelector(`#handRow .card[data-id="${pendingPlay.cardId}"]`)
            || document.querySelector(`#portsGrid .card[data-id="${pendingPlay.cardId}"]`);
  if (card) card.classList.add('pending');
  const run = document.querySelector(`#runsGrid .run[data-run="${pendingPlay.runIndex}"]`);
  if (run) run.classList.add('pendingTarget');
}

// ---- Scoped optimistic play -------------------------------------------------
// Measured on a real phone, 2026-08-13: tap→feedback 19ms, render 1-3ms, but
// tap→card-in-run p50 439ms / p95 2087ms — and request→response accounted for
// 429ms of that 439ms. The board was not slow to draw; it was deliberately
// waiting for the server before drawing anything. No amount of render tuning
// reaches that, so ordinary plays now land LOCALLY and the request follows.
//
// WHAT MAY BE PREDICTED, and why the boundary sits exactly here. The client
// holds a VIEW, not the game state — no deck, no other hands, and only the TOP
// of its own HOLD pile. So a play may be predicted only when its full effect is
// derivable from the view alone:
//   - ordinary (non-King) card. Kings open a direction modal and can trigger a
//     Jailbreak, releasing Brig Kings the view cannot enumerate.
//   - from HAND or a PORT. NOT from HOLD: the card under the top one is unknown,
//     so the new HOLD top cannot be drawn. NOT a released Jailbreak King.
//   - the play must not COMPLETE the run: completion recycles the non-Kings,
//     sends Kings to the Brig and empties the run (engine checkComplete), and
//     the recycle pile is not in the view.
//   - no active Jailbreak, and HOLD not already empty — with an empty HOLD,
//     runAfterPlay can END THE ROUND, which is not a board change to guess at.
// Anything outside that set falls back to the old wait-for-the-server path,
// which is unchanged and still correct.
//
// THE HARD RULE IS UNCHANGED: lastView stays authoritative and is never
// mutated. Predictions live in a separate view that is rebuilt from lastView on
// every confirmation, so the server can never be contradicted for longer than
// one round trip, and a rejection repaints authoritative state rather than
// leaving a board only the client believes in.
let predicted = null;            // the view being SHOWN while plays are outstanding
const playQueue = [];            // ordered predicted plays, oldest first
let draining = false;
let optimisticOff = false;       // latched off after repeated rejections
let resyncCount = 0;
const MAX_RESYNCS = 3;
let actionSeq = 0;

function shownView() { return predicted || lastView; }

// Prediction requires that the phone's rules and the server's rules ARE THE
// SAME RULES. A server that does not report its version is one that predates
// this feature, so prediction stays off — the feature switches itself on only
// once both halves are deployed.
function engineInSync() {
  return !!(lastView && lastView.engineRules && lastView.engineRules === Engine.RULES_VERSION);
}

// Mirrors engine.checkComplete's trigger condition, which is decidable from the
// run alone: a non-King top card at the far end of the run's direction.
function wouldCompleteRun(card, run) {
  if (card.rank === 'K') return false;
  let dir = run.direction;
  if (!dir) {
    if (run.cards.length === 0) dir = card.value === 1 ? 'up' : (card.value === 12 ? 'down' : null);
    else {
      const nexts = Engine.nextValuesForRun(run).filter(n => n.value === card.value);
      dir = nexts.length ? nexts[0].dir : null;
    }
  }
  return (dir === 'up' && card.value === 12) || (dir === 'down' && card.value === 1);
}

function canPredictPlay(card, zone, runIndex) {
  if (optimisticOff || !engineInSync()) return false;
  const v = shownView();
  if (!v || v.status !== 'IN_ROUND' || !v.isYourTurn) return false;
  if (card.rank === 'K') return false;
  if (zone !== 'hand' && zone !== 'discard') return false;
  if (v.brig && v.brig.active) return false;
  if (!v.yourGoalCount) return false;
  const run = v.runs[runIndex];
  if (!run || !Engine.canPlayCardOnRun(card, run)) return false;
  return !wouldCompleteRun(card, run);
}

// The non-King branch of engine.applyPlayCard, expressed against a view.
// Returns false if the card is not where it was expected — which is how a
// prediction that has been overtaken by real state gives up rather than
// duplicating a card that has already moved.
function applyPredictedPlay(v, cardId, runIndex) {
  let card = null;
  const hi = v.yourHand.findIndex(c => c.id === cardId);
  if (hi >= 0) card = v.yourHand.splice(hi, 1)[0];
  else {
    for (const pile of v.yourPorts) {
      if (pile.length && pile[pile.length - 1].id === cardId) { card = pile.pop(); break; }
    }
  }
  const run = v.runs[runIndex];
  if (!card || !run) return false;
  if (run.cards.length === 0) {
    if (card.value === 1) run.direction = 'up';
    if (card.value === 12) run.direction = 'down';
  } else if (!run.direction) {
    const nexts = Engine.nextValuesForRun(run).filter(n => n.value === card.value);
    if (nexts.length) run.direction = nexts[0].dir;
  }
  run.cards.push(card);
  return true;
}

// Rebuilt from authoritative state every time, never patched incrementally, so
// a confirmed play and a predicted one can never drift into disagreeing.
//
// The subtle case this has to survive: a poll can land carrying a play the
// server has ALREADY committed while that play is still sitting in the queue
// waiting for its own response. Replaying it would then fail to find the card
// (it is no longer in hand), and treating that as "give up on predicting" would
// throw away every LATER prediction too — the board would visibly snap
// backwards, undoing a card the player already saw land. So an action that is
// already reflected in authoritative state is skipped, not treated as a
// failure; only a genuinely unreplayable queue falls back.
function alreadyApplied(v, a) {
  const run = v.runs[a.runIndex];
  return !!(run && run.cards.some(c => c.id === a.cardId));
}

function rebuildPredicted() {
  if (!playQueue.length || !lastView) { predicted = null; return; }
  const v = JSON.parse(JSON.stringify(lastView));
  for (const a of playQueue) {
    if (alreadyApplied(v, a)) continue;
    if (!applyPredictedPlay(v, a.cardId, a.runIndex)) { predicted = null; return; }
  }
  predicted = v;
}

async function drainQueue() {
  if (draining) return;
  draining = true;
  try {
    while (playQueue.length) {
      const a = playQueue[0];
      let res;
      // Marked HERE, not when the card was tapped: a play queued behind another
      // waits for it, and folding that wait into "request→response" would report
      // the queue's own depth as network latency.
      Perf.mark(a.rec, 'request');
      try {
        res = await Api.submitAction({
          roomId, actorType: 'player', token: creds.resumeToken, playerId: creds.playerId,
          action: { type: 'PLAY_CARD', cardId: a.cardId, runIndex: a.runIndex },
          clientActionId: a.id,
          // Each send uses the version the PREVIOUS confirmation returned, so a
          // burst of taps is a chain of compare-and-swaps rather than a race.
          expectedVersion: lastView.stateVersion
        });
      } catch (e) {
        Perf.finish(a.rec, 'server-rejected');
        await reconcile(e.message);
        return;
      }
      Perf.mark(a.rec, 'response');
      if (a.rec && res && res.timing) a.rec.server = res.timing;
      Perf.finish(a.rec, 'accepted');
      playQueue.shift();
      applyView(res.view, 'action');
    }
    poller.kick();
  } finally { draining = false; }
}

// A rejected prediction means the board on screen is not the board the server
// has. Everything after it was predicted on top of a wrong assumption, so the
// whole queue goes; authoritative state is re-fetched and repainted, and the
// player is told plainly rather than left to notice a card moving back.
async function reconcile(msg) {
  playQueue.length = 0;
  predicted = null;
  resyncCount++;
  Perf.counts.resyncs++;
  Sfx.play('illegal');
  showToast(msg ? msg + ' — board resynced.' : 'That play was refused — board resynced.');
  try {
    const v = await Api.getPlayerState(roomId, creds.playerId, creds.resumeToken);
    lastView = v;
  } catch (e) { /* the poller will catch up on its own */ }
  // Repeated rejections mean the phone's rules and the server's disagree in a
  // way the version check did not catch. Stop predicting for the session rather
  // than keep showing plays that get taken back.
  if (resyncCount >= MAX_RESYNCS) {
    optimisticOff = true;
    showToast('Switching to server-confirmed plays for the rest of this game.');
  }
  render(shownView(), 'reconcile');
}

// True while ANY action POST is outstanding, not just an optimistic run play.
// pendingPlay alone covered only the run path, so a second tap on Draw or on a
// Port sent a second request against the same expectedVersion: the server's
// compare-and-swap correctly refused it (no state was ever corrupted), but the
// player got a confusing "someone else already acted" for their own double-tap,
// and every duplicate still cost a function invocation. Nick hit exactly this
// on 2026-08-09 — tapping Draw three times because it felt unresponsive.
let actionInFlight = false;

// Every gameplay entry point checks this, rather than blanket pointer-events:none
// on the board — the Menu, the Port fan and the rotate prompt must stay live.
function inputLocked() { return pendingPlay !== null || actionInFlight; }

// Anything that is NOT a predicted run play — a discard, a draw, a King, a play
// from HOLD — must also stand aside while the predicted queue is draining, or
// it would race the same expectedVersion the queue is chaining through. Selecting
// a card is deliberately not covered: that is local and must stay instant.
function nonPredictBlocked() { return inputLocked() || playQueue.length > 0 || draining; }

// Wraps an action POST so the in-flight flag is always cleared, including on
// the throw paths. Returns whatever the action returns.
async function withActionLock(fn) {
  actionInFlight = true;
  try { return await fn(); }
  finally { actionInFlight = false; }
}

// A tap that arrives while an action is in flight is dropped on purpose — but
// dropping it in TOTAL SILENCE is its own bug. "Still working" and "your tap
// did nothing" looked identical, so a normal network wait read as a dead app
// and invited more tapping. Acknowledge every swallowed tap quietly; if they
// keep tapping, say it in words too, since a sound is invisible with the
// volume down (which on a couch, next to a TV playing the game's audio, is
// the likely case).
let busyTaps = 0;
let busyTapTimer = null;
// Derived here rather than passed in by each caller, so every refusal is
// categorised the same way and no call site can forget to say why.
function busyReason() {
  if (pendingPlay) return 'awaiting-play';
  if (actionInFlight) return 'action-in-flight';
  if (draining || playQueue.length) return 'queue-draining';
  return 'unknown';
}
function noteBusyTap() {
  Perf.noteSwallowed(busyReason());
  Sfx.play('ui');                     // soft cue, NOT 'illegal' — nothing is wrong
  busyTaps++;
  if (busyTaps >= 2) showToast('Still working on your last move…');
  clearTimeout(busyTapTimer);
  busyTapTimer = setTimeout(() => { busyTaps = 0; }, 1500);
}

// The host is a player now, so this page carries their controls too. Holding a
// host token for THIS room is what makes them appear — /host saves it at
// creation time. Purely a display check: every host action is re-verified
// server-side against rooms.host_resume_token, so faking this in devtools
// reveals buttons that then get a 401.
let hostToken = roomId ? Persist.loadHost(roomId) : null;
const isHost = () => !!hostToken;

// Exactly one of these four is visible at a time. The choice bar and Port fan
// are fixed overlays that live OUTSIDE all of them, so leaving the board has to
// tear them down explicitly or they float over the lobby showing a dead game.
const SCREENS = ['waitPanel', 'lobbyPanel', 'resultsPanel', 'gameUi'];
function showScreen(id) {
  SCREENS.forEach(s => document.getElementById(s).classList.toggle('hidden', s !== id));
  if (id !== 'gameUi') { hideChoiceBar(); fannedPort = null; renderPortFan(); }
}

// Declared BEFORE the boot block below, which calls startPolling(): `const` is
// not hoisted, so defining the poller further down would put it in the temporal
// dead zone and throw on load. (poll/showPausedPanel are function declarations,
// so referencing them here is fine.)
//
// Rates are per-state on purpose: only the player actually taking a turn needs to
// feel instant. Waiting players were the bulk of the old invocation cost.
const poller = createPoller({
  poll,
  intervalFor: () => {
    // With the doorbell connected the server tells us the instant anything
    // changes, so the timer stops being how we find out and becomes a safety
    // net for a missed message. This single line is most of the invocation
    // saving — a waiting player drops from a poll every 3.5s to one every 45s.
    if (doorbell.isLive()) return 45000;
    if (!lastView) return 1200;
    if (lastView.status === 'LOBBY') return 3000;       // waiting for the host to start
    return lastView.isYourTurn ? 1200 : 3500;           // your turn vs watching
  },
  maxInterval: 10000,
  // 30 min with a still board and nobody touching the phone, plus a hard 90 min
  // since the game last changed that nothing can defer. Raised from 10 min at
  // Nick's request — a snack break should not paywall the game behind a tap —
  // and the hard stop is what makes the longer window safe.
  idleStopMs: 30 * 60 * 1000,
  hardStopMs: 90 * 60 * 1000,
  onIdleStop: showPausedPanel
});

// Declared after the poller because its handler calls poller.wake(); function
// hoisting does not apply to `const`.
const doorbell = createDoorbell({
  roomId: () => roomId,
  label: 'play',
  // wake() rather than kick(): the idle stop may already have fired and put up
  // the paused panel, and a player returning to the table should not have to
  // find the Resume button before the game starts moving again. No DOM cleanup
  // here — render() either hides waitPanel outright or rewrites its contents,
  // so the paused card clears itself on the fetch this triggers.
  // A real pulse means a human played, so it may restart a paused screen. The
  // visibility nudge is machinery and routes to refresh(), which no-ops when
  // stopped — otherwise a phone waking in a pocket revives a dead game.
  onChange: (version, meta) => {
    nextPollCause = (meta && meta.programmatic) ? 'visibility' : 'doorbell';
    return (meta && meta.programmatic) ? poller.refresh() : poller.wake();
  },
  // Recompute the delay on a connection change, so losing the socket restores
  // fast polling rather than waiting out one more 45s safety-net tick.
  //
  // reschedule(), NOT refresh() and NOT kick(). All three used to look
  // interchangeable; they are not, and this line is where that cost real money.
  // kick() would defer the idle stop on every flap (the 17-hour incident).
  // refresh() fetches immediately and resets the backoff, so a socket flapping
  // once a second produced ~2 fetches a second — ~7,200/hour, sustained, even
  // with nobody playing (the 2026-08-09 incident). reschedule() only re-reads
  // the clock: no fetch, no backoff reset. A connection changing state is not
  // news about the GAME, and only news about the game may cost an invocation.
  onLiveChange: () => poller.reschedule()
});

// One browser can now hold several seats (playing two sides yourself). With more
// than one saved and no ?pid= to disambiguate, ask rather than guess — silently
// resuming as the wrong player is worse than one extra tap.
function showSeatPicker(list) {
  const wait = document.getElementById('waitPanel');
  wait.innerHTML = '<p>Which seat is this?</p><div id="seatPicks"></div>';
  const box = document.getElementById('seatPicks');
  list.forEach(p => {
    const b = document.createElement('button');
    b.style.cssText = 'display:block;width:100%;max-width:320px;margin:8px auto;';
    b.textContent = p.name ? `${p.name} (seat ${p.seat + 1})` : `Seat ${p.seat + 1}`;
    b.onclick = () => {
      creds = p;
      if (history.replaceState) history.replaceState(null, '', '/play?room=' + roomId + '&pid=' + p.playerId);
      startPolling();
    };
    box.appendChild(b);
  });
}

if (!roomId) {
  document.getElementById('waitPanel').innerHTML = '<p>No saved seat found.</p><p><a href="/join" style="color:#ffe28a;">Join a room</a></p>';
} else if (creds) {
  startPolling();
} else {
  const saved = Persist.loadPlayers(roomId);
  if (saved.length > 1) showSeatPicker(saved);
  else document.getElementById('waitPanel').innerHTML = '<p>No saved seat found.</p><p><a href="/join" style="color:#ffe28a;">Join a room</a></p>';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 2200);
}

// A King played as a wildcard must still READ as a King. Showing only its
// effective value ("7♠") hides the King-on-King restriction and makes a legal
// board look like an illegal one. Mirrors renderCard() in app/index.html.
function cardHtml(c, extraClass) {
  if (!c) return '';
  const red = c.suit === '♥' || c.suit === '♦';
  const wild = c.rank === 'K' && c.effectiveValue;
  const arrow = c.playedDirection === 'up' ? '↑' : c.playedDirection === 'down' ? '↓' : '';
  const as = wild ? `<span class="asBadge">${Engine.VALUE_NAMES[c.effectiveValue]}${arrow}</span>` : '';
  return `<span class="card ${red ? 'red' : ''} ${wild ? 'king' : ''} ${extraClass || ''}">${c.rank}${c.suit}${as}</span>`;
}

// Spreads a whole Port pile open — mirrors togglePortFan() in app/index.html.
// Read-only: tapping a card inside the fan does nothing, same as hot-seat.
// Only the top (last) card is actually playable, so it gets marked.
function togglePortFan(i) {
  // Refuse while a King direction question is up — it occupies the same corner
  // of the screen and must be answered first.
  if (choiceBarOpen()) { showToast('Answer the King first.'); return; }
  fannedPort = (fannedPort === i) ? null : i;
  renderPortFan();
}
function renderPortFan() {
  const overlay = document.getElementById('portFanOverlay');
  // yourPorts is absent from a LOBBY view, so guard on it rather than on lastView
  // alone — a host reset can swap the view out while the fan is open.
  if (fannedPort === null || !lastView || !shownView().yourPorts) {
    fannedPort = null;
    overlay.classList.add('hidden');
    return;
  }
  const pile = shownView().yourPorts[fannedPort] || [];
  if (pile.length === 0) { fannedPort = null; overlay.classList.add('hidden'); return; }
  document.getElementById('portFanTitle').textContent = `Port ${fannedPort + 1} (${pile.length} card${pile.length === 1 ? '' : 's'})`;
  document.getElementById('portFanRow').innerHTML = pile.map((c, idx) => {
    const isTop = idx === pile.length - 1;
    return `<div class="portFanCell">${cardHtml(c, isTop ? 'top' : '')}${isTop ? '<div class="portFanTopLabel">TOP</div>' : ''}</div>`;
  }).join('');
  overlay.classList.remove('hidden');
}
document.getElementById('portFanClose').addEventListener('click', () => { fannedPort = null; renderPortFan(); });

// Selection is the ONE piece of UI state that changes nothing but a CSS class,
// so it must never go through render(). render() rebuilds the innerHTML of the
// runs, hand, Ports, HOLD and Brig and re-binds every listener; since the
// restyle those elements carry layered gradients, a border-image PNG and
// texture backgrounds, so a full rebuild on every tap is what made selecting a
// card feel laggy on a phone — a local, zero-network action. Toggling the class
// is equivalent because `selected` only ever feeds `.selected` in the markup
// (grep the render() branches: hand, port top, holdTop, brig king). If that
// stops being true, this has to grow to match, not go back to render().
function paintSelection() {
  document.querySelectorAll('#gameUi .card.selected').forEach(el => el.classList.remove('selected'));
  if (!selected) return;
  let el = null;
  if (selected.zone === 'hand') el = document.querySelector(`#handRow .card[data-id="${selected.card.id}"]`);
  else if (selected.zone === 'goal') el = document.getElementById('holdTop');
  else if (selected.zone === 'discard') el = document.querySelector(`#portsGrid .port[data-port="${selected.index}"] .card`);
  else if (selected.zone === 'jailbreak') el = document.querySelector(`#brigStrip [data-jb="${selected.card.id}"]`);
  if (el) el.classList.add('selected');
}

function selectCard(zone, card, index) {
  if (!shownView().isYourTurn) return;
  if (inputLocked()) { noteBusyTap(); return; }
  // Picking a different card abandons any King direction question still on
  // screen — that question belongs to the card you were playing a moment ago.
  hideChoiceBar();
  // Tapping the selected card again clears it. Without this you cannot get from
  // "hand card selected" back to "nothing selected", which is the state a Port
  // pickup requires.
  if (selected && selected.card.id === card.id) { selected = null; Sfx.play('deselect'); paintSelection(); return; }
  selected = { zone, card, index };
  Sfx.play('select');
  paintSelection();
}

// Mirrors window.portTap() in app/index.html: a Port tile is both the discard
// target AND the way to pick a card back out of a Port to play it to a Run.
function portTap(portIndex) {
  if (!shownView().isYourTurn) return;
  if (inputLocked()) { noteBusyTap(); return; }
  if (selected && selected.zone === 'hand') return discardTo(portIndex);
  const pile = shownView().yourPorts[portIndex] || [];
  const top = pile[pile.length - 1];
  if (top) return selectCard('discard', top, portIndex);
  showToast('Select a hand card first to discard here.');
}

function legalRunIndexes(card) {
  if (!lastView) return [];
  return lastView.runs.map((r,i)=>i).filter(i => Engine.canPlayCardOnRun(card, lastView.runs[i]));
}

async function attemptPlay(runIndex) {
  // Requirement 7: one action in flight at a time. Without this a double-tap
  // sends two plays, and the second comes back as a version conflict — a
  // confusing "someone else already acted" for a solo player.
  if (!selected) return;
  const card = selected.card;
  const zone = selected.zone;

  // A predicted play does not wait on anything, so it is not gated by the
  // in-flight lock — that lock exists to stop two requests racing the same
  // expectedVersion, and the queue serialises them instead. It must still stand
  // aside for a NON-predicted action already in flight.
  if (canPredictPlay(card, zone, runIndex) && !inputLocked()) {
    const rec = Perf.startAction('play-predicted');
    selected = null;
    playQueue.push({ id: ++actionSeq, cardId: card.id, runIndex, rec });
    Perf.counts.predicted++;
    rebuildPredicted();
    Sfx.play('place');
    render(shownView(), 'predict');
    Perf.mark(rec, 'feedback');
    Perf.mark(rec, 'rendered');   // the card is on the run NOW, not after the server agrees
    drainQueue();
    return;
  }

  // Everything else keeps the original behaviour: one action at a time, and the
  // board waits for the server before it changes.
  if (nonPredictBlocked()) { noteBusyTap(); return; }
  // Opened AFTER the lock check, so a refused tap is counted by noteBusyTap()
  // rather than becoming a timing row with nothing behind it.
  const rec = Perf.startAction(card.rank === 'K' ? 'play-king' : 'play');
  const run = shownView().runs[runIndex];
  if (!Engine.canPlayCardOnRun(card, run)) {
    Perf.finish(rec, 'illegal-local');
    Sfx.play('illegal'); showToast('Illegal play.'); return;
  }
  if (card.rank === 'K') {
    let choices;
    if (!run.direction) {
      choices = Engine.unsetNaturalKingChoices(run).map(c => ({ label: `King as ${Engine.VALUE_NAMES[c.kingValue]} — ${c.dir.toUpperCase()}`, value: c.kingValue, dir: c.dir }));
    } else {
      const required = Engine.kingRequiredValue(run);
      choices = ['up','down'].map(dir => ({ label: `Continue ${dir.toUpperCase()} as ${Engine.VALUE_NAMES[required]}`, value: required, dir }));
    }
    // Capture the card id NOW. Previously sendPlay() read `selected` at the
    // moment a choice was tapped, so changing selection while the question was
    // on screen answered it with the wrong card — committing a King and then
    // touching a hand card played the hand card instead, King untouched.
    showChoiceBar(choices, (choice) => sendPlay(card.id, runIndex, { value: choice.value, dir: choice.dir }, rec));
    return;
  }
  // Non-King, already checked legal by the same engine the server runs: give the
  // feedback now, then send. Kings above deliberately skip this — they go
  // through a modal, so there is no unanswered tap to cover.
  beginPendingPlay(card.id, runIndex);
  Perf.mark(rec, 'feedback');
  sendPlay(card.id, runIndex, undefined, rec);
}

// ---- Modal ------------------------------------------------------------------
// Lifted from hot-seat's showModal(): dimmed backdrop, titled card, a row of
// choice buttons. Replaces the old docked choiceBar, which had nowhere to live
// once the landscape layout claimed every region of the screen.
function hideChoiceBar() {
  document.getElementById('modalBackdrop').classList.remove('show');
}
function choiceBarOpen() {
  return document.getElementById('modalBackdrop').classList.contains('show');
}
function showModal(title, bodyHtml, choices) {
  // The Port fan is a bottom sheet and would sit under the backdrop looking
  // half-interactive. Close it before anything opens over the top.
  fannedPort = null; renderPortFan();
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml || '';
  const box = document.getElementById('modalChoices');
  box.innerHTML = '';
  (choices || []).forEach(c => {
    const b = document.createElement('button');
    b.textContent = c.label;
    if (c.secondary) b.className = 'secondary';
    b.onclick = () => { hideChoiceBar(); if (c.action) c.action(); };
    box.appendChild(b);
  });
  document.getElementById('modalBackdrop').classList.add('show');
}
// Kept under its old name so attemptPlay()'s King path needs no rewiring.
function showChoiceBar(choices, onPick) {
  showModal(
    'Captain’s Orders',
    '<p>Which direction does the run continue?</p>',
    choices.map(c => ({ label: c.label, action: () => onPick(c) }))
  );
}

async function sendPlay(cardId, runIndex, kingChoice, rec) {
  // Whether the tap already got its feedback. The King path does not call
  // beginPendingPlay, so it still needs the sound on success.
  const wasOptimistic = pendingPlay !== null;
  try {
    Perf.mark(rec, 'request');
    const res = await withActionLock(() => Api.submitAction({
      roomId, actorType: 'player', token: creds.resumeToken, playerId: creds.playerId,
      action: { type: 'PLAY_CARD', cardId, runIndex, kingChoice },
      clientActionId: rec ? rec.id : undefined,
      expectedVersion: lastView.stateVersion
    }));
    Perf.mark(rec, 'response');
    if (rec && res && res.timing) rec.server = res.timing;
    selected = null;
    // Cleared BEFORE applyView so render()'s paintPending has nothing to
    // re-apply — the authoritative view already has the card in the run.
    clearPendingPlay();
    if (!wasOptimistic) Sfx.play('place');
    applyView(res.view, 'action');
    // applyView can defer the draw if a finger is still down; that is rare this
    // late in a play and is counted separately as rendersDeferred, so read this
    // mark as "the board was told", not always "pixels changed".
    Perf.mark(rec, 'rendered');
    Perf.finish(rec, 'accepted');
    poller.kick();   // act, then re-sync at once rather than waiting out a backed-off delay
  } catch (e) {
    Perf.finish(rec, 'server-rejected');
    // Requirement 6: fall back to the untouched authoritative view. Nothing was
    // faked, so this is just a repaint — the faded card comes back where it was.
    clearPendingPlay();
    Sfx.play('illegal');
    showToast(e.message);
    selected = null;
    render(shownView());
  }
}

async function discardTo(portIndex) {
  if (!selected || selected.zone !== 'hand') { Sfx.play('illegal'); showToast('Select a card from your hand first.'); return; }
  // Discard had no in-flight guard at all: a double-tap on a Port fired two
  // POSTs, and the loser came back as "someone else already acted".
  if (nonPredictBlocked()) { noteBusyTap(); return; }
  try {
    const res = await withActionLock(() => Api.submitAction({
      roomId, actorType: 'player', token: creds.resumeToken, playerId: creds.playerId,
      action: { type: 'DISCARD_TO_PORT', cardId: selected.card.id, portIndex },
      expectedVersion: lastView.stateVersion
    }));
    selected = null;
    Sfx.play('discard');
    applyView(res.view, 'action');
    poller.kick();   // act, then re-sync at once rather than waiting out a backed-off delay
  } catch (e) {
    Sfx.play('illegal');
    showToast(e.message);
  }
}

document.getElementById('drawBtn').addEventListener('click', async () => {
  // Draw is not itself optimistic (requirement 8), but it must not fire while a
  // play is in flight — it would race the same expectedVersion and lose. Since
  // actionInFlight now covers draws too, this also stops Draw racing ITSELF.
  if (nonPredictBlocked()) { noteBusyTap(); return; }
  try {
    const res = await withActionLock(() => Api.submitAction({
      roomId, actorType: 'player', token: creds.resumeToken, playerId: creds.playerId,
      action: { type: 'DRAW_HAND' },
      expectedVersion: lastView.stateVersion
    }));
    Sfx.play('ui');
    applyView(res.view, 'action');
    poller.kick();   // act, then re-sync at once rather than waiting out a backed-off delay
  } catch (e) { Sfx.play('illegal'); showToast(e.message); }
});

function renderLobby(view) {
  showScreen('lobbyPanel');
  document.getElementById('lobbyCode').textContent = view.roomCode || '';
  document.getElementById('lobbyJoinHint').textContent =
    'Others join at ' + location.host + '/join and enter this code.';

  // Mark which chip is you. seat is absent on a ?tok= rejoin, in which case
  // nothing is highlighted rather than highlighting the wrong person.
  const mySeat = creds && typeof creds.seat === 'number' ? creds.seat : null;
  const players = view.players || [];
  document.getElementById('lobbyPlayers').innerHTML =
    players.map(p => `<div class="playerChip ${p.seat === mySeat ? 'you' : ''}">${p.name}</div>`).join('')
    || '<span class="meta">Nobody yet…</span>';

  document.getElementById('lobbyHostControls').classList.toggle('hidden', !isHost());
  document.getElementById('lobbyWaitText').classList.toggle('hidden', isHost());
  if (isHost()) {
    // The host occupies a seat, so this is 1 already — one other player is enough.
    document.getElementById('startBtn').disabled = players.length < 2;
  }
}

function renderResults(view) {
  showScreen('resultsPanel');
  const panel = document.getElementById('resultsPanel');
  const gameOver = view.status === 'GAME_RESULTS';
  // Lowest total wins — hand and HOLD cards are penalty points.
  const rows = gameOver ? [...view.players].sort((a, b) => a.total - b.total) : view.players;

  let html = gameOver
    ? `<h2>Game over — ${rows[0].name} wins</h2>`
    : `<h2>Round ${view.round} complete</h2>`;
  html += rows.map(p => `<div class="scoreRow"><span>${p.name}</span><span>${
    gameOver ? p.total : `+${p.roundScore} (${p.total})`
  }</span></div>`).join('');

  if (!isHost()) {
    html += '<p class="meta" style="margin-top:22px;">Waiting for the host…</p>';
  } else if (gameOver) {
    html += '<p style="margin-top:22px;"><button id="resultsResetBtn" class="secondary">Back to the lobby</button></p>';
  } else if (view.pendingClinch) {
    html += `<p style="margin-top:18px;"><b>${view.pendingClinch}</b> has clinched the game.</p>`
      + '<p><button id="endNowBtn">End game now</button></p>'
      + '<p><button id="nextRoundBtn" class="secondary">Keep playing</button></p>';
  } else {
    html += '<p style="margin-top:22px;"><button id="nextRoundBtn">Start next round</button></p>'
      + '<p style="margin-top:12px;"><button id="resultsResetBtn" class="secondary tiny">Reset game</button></p>';
  }
  panel.innerHTML = html;

  // Rebuilt every render, so these are wired fresh rather than once at load.
  const next = document.getElementById('nextRoundBtn');
  if (next) next.onclick = () => advanceRound(false, view);
  const end = document.getElementById('endNowBtn');
  if (end) end.onclick = () => advanceRound(true, view);
  const rst = document.getElementById('resultsResetBtn');
  if (rst) rst.onclick = doReset;
}

async function advanceRound(endNow, view) {
  try {
    await Api.submitAction({
      roomId, actorType: 'host', token: hostToken,
      action: { type: 'ADVANCE_ROUND', endNow },
      expectedVersion: view.stateVersion
    });
    poller.kick();
  } catch (e) { showToast(e.message); }
}

async function doReset() {
  if (!isHost()) return;
  if (!confirm('Reset this game for everyone? Progress will be lost. Players keep their seats and do not need to rejoin.')) return;
  try {
    await Api.resetGame(roomId, hostToken);
    poller.kick();
  } catch (e) { showToast(e.message); }
}

// Timing wrapper. render() is called from a dozen places; measuring it here
// rather than at each call site is what makes "is the rebuild itself expensive,
// or is it only expensive when it collides with a touch?" answerable.
function render(view, cause) {
  const t0 = Perf.now();
  try { renderImpl(view); }
  finally { Perf.noteRender(Perf.now() - t0, cause || 'other'); }
}

function renderImpl(view) {
  // A LOBBY response is getLobbyView, not getPlayerView — no hand, HOLD or
  // Ports — so the board code below would throw on view.yourHand.map(...).
  // This is also the state a host reset drops everyone into mid-game.
  if (view.status === 'LOBBY') {
    // Drop any held selection. Card ids come from a uid counter in the engine
    // that restarts at 1 on a cold function instance, so a card dealt after the
    // reset can carry the same id as the one selected before it — a stale
    // `selected` would then match the wrong card by id in the next game.
    selected = null;
    renderLobby(view);
    return;
  }
  if (view.status === 'ROUND_RESULTS' || view.status === 'GAME_RESULTS') {
    selected = null;
    renderResults(view);
    return;
  }
  showScreen('gameUi');
  // Drives the whole remote layout from CSS (see the REMOTE MODE block). Read
  // once here so every branch below agrees on the mode within a single render.
  const remote = displayMode() === 'remote';
  // Set on BOTH: the layout rules hang off #gameUi, but the Port fan and the
  // modals are siblings of it (they are fixed overlays and have to be, or the
  // board's stacking context would trap them), so a #gameUi-scoped selector
  // cannot reach their card sizes. body carries the mode for those.
  document.getElementById('gameUi').dataset.mode = remote ? 'remote' : 'couch';
  document.body.dataset.mode = remote ? 'remote' : 'couch';
  // Landscape is couch mode's designed orientation and the rotate prompt is
  // right to insist on it. Remote mode is drawn FOR portrait, so arming it there
  // would demand a rotation into a layout that does not exist.
  document.getElementById('rotatePrompt').classList.toggle('armed', !remote);

  const bar = document.getElementById('turnBar');
  document.getElementById('turnText').textContent =
    view.isYourTurn ? 'Your Turn' : `${view.currentPlayerName}'s turn`;
  document.getElementById('roundMeta').textContent = `Round ${view.round}/${view.maxRounds}`;
  bar.classList.toggle('myTurn', view.isYourTurn);

  // Runs are bare tap targets in couch mode. NO legality highlight anywhere —
  // Nick, 2026-08-02: telegraphing where a card can go removes the skill. Remote
  // mode adds the card contents back, because then no TV is carrying them.
  // The direction- class is a different thing and stays in both modes: it states
  // the run's own direction, not whether your selection fits there.
  // Opponents' HOLD piles. Couch mode leaves this empty because /tv carries the
  // plaques; remote has no /tv, and without it the player cannot see the race
  // they are in. Your own HOLD is already the big frame at the bottom, so only
  // the other seats go here.
  const oppStrip = document.getElementById('oppStrip');
  oppStrip.innerHTML = remote
    ? (view.players || []).filter(p => p.seat !== view.yourSeat).map(p =>
        `<div class="opp ${p.seat === view.currentSeat ? 'turn' : ''}">`
        + `<div class="oppName">${p.name}</div>`
        + (p.goalTop ? cardHtml(p.goalTop) : '<span class="oppClear">Cleared!</span>')
        + `<div class="oppCount">${p.goalCount} in HOLD</div></div>`).join('')
    : '';

  const showCards = remote;
  document.getElementById('runsGrid').innerHTML = view.runs.map((r, i) => {
    const cards = showCards
      ? `<div class="cardRow">${r.cards.slice(-3).map(c => cardHtml(c)).join('')}</div>`
      : '';
    // What an EMPTY run will accept. Public rule state, not a legality hint: it
    // is the same for every player and does not depend on what is in your hand,
    // so it sits with the direction wash rather than with the telegraphing Nick
    // ruled out. Shown in both modes (Nick, 2026-08-10).
    const opener = r.cards.length === 0 ? '<div class="runOpener">A or Q</div>' : '';
    return `<div class="run direction-${r.direction || 'unset'} ${showCards ? 'showCards' : ''}" data-run="${i}">`
      + `<div>RUN ${i + 1}</div>${opener}${cards}</div>`;
  }).join('');
  document.querySelectorAll('#runsGrid .run').forEach(el => {
    el.addEventListener('click', () => attemptPlay(Number(el.dataset.run)));
  });

  document.getElementById('handRow').innerHTML = view.yourHand.map(c => {
    const sel = selected && selected.zone === 'hand' && selected.card.id === c.id;
    return `<span class="card slot ${c.suit==='♥'||c.suit==='♦'?'red':''} ${sel?'selected':''}" data-id="${c.id}">${c.rank}${c.suit}</span>`;
  }).join('') || '<span class="meta">Empty</span>';
  document.querySelectorAll('#handRow .card').forEach(el => {
    el.addEventListener('click', () => {
      const c = view.yourHand.find(c => c.id === el.dataset.id);
      selectCard('hand', c);
    });
  });
  // Drawing is always a choice now. The server decides eligibility (start-of-turn
  // quota, or a refill because the hand is empty) and sends the count; 0 hides it.
  const drawBtn = document.getElementById('drawBtn');
  const drawable = view.yourDrawCount || 0;
  drawBtn.classList.toggle('hidden', !(view.isYourTurn && drawable > 0));
  // Deliberately no number: how many you are owed depends on the start-of-turn
  // quota and whether the hand has been cleared, and a label stating a count is
  // one more thing that can drift out of step with what the server deals. The
  // server decides the amount; the button just offers the choice.
  drawBtn.textContent = 'Draw\nCards';

  document.getElementById('portsGrid').innerHTML = view.yourPorts.map((pile,i) => {
    const top = pile[pile.length-1];
    const sel = selected && selected.zone === 'discard' && selected.index === i;
    const badge = pile.length > 0 ? `<span class="portBadge" data-fan="${i}">${pile.length}</span>` : '';
    return `<div class="port" data-port="${i}">${top ? cardHtml(top, sel ? 'selected' : '') : '<span class="meta">Port '+(i+1)+'</span>'}${badge}<div class="count">${pile.length}</div></div>`;
  }).join('');
  document.querySelectorAll('#portsGrid .port').forEach(el => {
    el.addEventListener('click', () => portTap(Number(el.dataset.port)));
  });
  document.querySelectorAll('#portsGrid .portBadge').forEach(el => {
    el.addEventListener('click', (e) => { e.stopPropagation(); togglePortFan(Number(el.dataset.fan)); });
  });
  renderPortFan();

  document.getElementById('holdCard').innerHTML = (() => {
    if (!view.yourGoalTop) return '<span class="meta">Cleared!</span>';
    const sel = selected && selected.zone === 'goal';
    return `<span class="card slot ${view.yourGoalTop.suit==='♥'||view.yourGoalTop.suit==='♦'?'red':''} ${sel?'selected':''}" id="holdTop">${view.yourGoalTop.rank}${view.yourGoalTop.suit}</span>`;
  })();
  const holdTop = document.getElementById('holdTop');
  if (holdTop) holdTop.addEventListener('click', () => selectCard('goal', view.yourGoalTop));
  document.getElementById('holdCount').textContent = view.yourGoalCount + ' cards';

  // Your Brig fills ONLY during your own Jailbreak. The waiting Kings are public
  // and live on /tv; what belongs here are the Kings you personally have to play
  // before you discard. Released Kings only exist on the turn of whoever sprang
  // them, so this condition already scopes it to the right player.
  const b = view.brig;
  const mineToPlay = b.active && view.isYourTurn;
  // Two different things share this frame, and only one of them is playable.
  //
  // Couch mode leaves it empty unless the Kings are YOURS to play, because the
  // waiting Kings are public and /tv is already showing them. Remote mode has no
  // /tv, so leaving it empty hides public board state from the only player who
  // cannot see it any other way — how close the Brig is to a Jailbreak is
  // information every other seat has. Waiting Kings are therefore drawn here,
  // but WITHOUT data-jb: they are not yours, tapping one must do nothing, and
  // the missing attribute is what makes that true rather than a check that could
  // be forgotten later (see the tap-target note at the top of this file).
  const jailbreakMine = mineToPlay ? b.releasedKings : [];
  // Capped on purpose. The deck is one full deck PER PLAYER, so a 6-player game
  // can put 24 Kings in the Brig — the same arithmetic that overflowed /tv's
  // Brig frame in the 2026-08-07 session. These are context, not tap targets,
  // and brigCount below states the true number, so drawing a bounded sample
  // costs nothing and cannot overflow. Released Kings above are NOT capped:
  // every one of them has to be playable.
  const BRIG_PREVIEW_MAX = 6;
  const brigWaiting = (!mineToPlay && remote)
    ? (b.waitingKings || []).slice(0, BRIG_PREVIEW_MAX)
    : [];
  document.getElementById('brigStrip').innerHTML =
    jailbreakMine.map(c => {
      const sel = selected && selected.zone === 'jailbreak' && selected.card.id === c.id;
      return `<span class="card slot ${sel ? 'selected' : ''}" data-jb="${c.id}">${c.rank}${c.suit}</span>`;
    }).join('')
    + brigWaiting.map(c => `<span class="card">${c.rank}${c.suit}</span>`).join('');
  document.getElementById('brigCount').textContent = mineToPlay
    ? `JAILBREAK — play ${b.releasedKings.length}`
    : (remote ? `${b.waitingCount} in the Brig` : '');
  document.querySelectorAll('#brigStrip [data-jb]').forEach(el => {
    el.addEventListener('click', () => {
      const c = view.brig.releasedKings.find(c => c.id === el.dataset.jb);
      selectCard('jailbreak', c);
    });
  });

  // Last, because everything above just replaced the elements it styles. A poll
  // landing while a play is in flight would otherwise restore the faded card and
  // drop the target ring, undoing the feedback mid-request.
  paintPending();
}

function applyView(view, cause) {
  // Drop a view that is older than what we already show. A poll GET issued just
  // before an action's POST commits will answer with pre-action state and arrive
  // afterwards, briefly reverting the board — your card visibly jumps back into
  // your hand. Only compare when both sides carry a version: a LOBBY view (host
  // reset) has none and must always be allowed through.
  if (lastView && typeof lastView.stateVersion === 'number'
      && typeof view.stateVersion === 'number'
      && view.stateVersion < lastView.stateVersion) {
    return;
  }

  // An UNCHANGED poll used to rebuild the entire board anyway. On your own turn
  // that is a full innerHTML replacement of the runs, hand, Ports, HOLD and Brig
  // roughly every 1.2s, forever, whether or not anything moved — wasted work at
  // best, and at worst a rebuild landing in the middle of a touch (see the
  // gesture guard above). Skip only the DRAW; the view itself is still adopted,
  // because a same-version response can still carry fields the board does not
  // paint, and dropping it wholesale would throw those away.
  const unchanged = lastView
    && typeof lastView.stateVersion === 'number'
    && typeof view.stateVersion === 'number'
    && view.stateVersion === lastView.stateVersion
    && lastView.status === view.status;

  lastView = view;
  // Predictions are re-derived from the new authoritative state, never carried
  // forward as patches. A play the server has now confirmed drops out of the
  // queue naturally; one that has been overtaken makes rebuildPredicted give up
  // and fall back to authoritative state rather than show a duplicate card.
  rebuildPredicted();

  if (unchanged) { Perf.counts.rendersSuppressed++; Perf.bump(cause, 'skipped'); return; }

  // A real change, but a finger is on the board: hold it. Only the newest view
  // matters, so this is a flag rather than a queue — flushDeferredRender()
  // draws whatever lastView has become by the time the gesture ends, which is
  // also why a later action response cannot be overtaken by an earlier poll.
  if (pointerActive) {
    renderPending = true;
    pendingCause = cause;
    Perf.counts.rendersDeferred++;
    return;
  }

  render(shownView(), cause);
}

async function poll() {
  try {
    const view = await Api.getPlayerState(roomId, creds.playerId, creds.resumeToken);
    Perf.notePoll(doorbell.isLive());
    const cause = nextPollCause;
    nextPollCause = 'timer';
    applyView(view, 'poll:' + cause);
    // Signature the poller compares to decide whether anything actually moved.
    // LOBBY views carry no stateVersion, hence the status fallback.
    return (view.status || '') + ':' + (view.stateVersion == null ? '' : view.stateVersion);
  } catch (e) {
    console.error(e);
    return 'error';
  }
}

function showPausedPanel() {
  const wait = document.getElementById('waitPanel');
  showScreen('waitPanel');
  wait.innerHTML = '<p>Paused — this tab went quiet for a while.</p>'
    + '<p class="meta">Stopped checking for updates so it isn’t running in the background.</p>'
    + '<button id="resumeBtn" style="margin-top:14px;">Resume game</button>';
  document.getElementById('resumeBtn').addEventListener('click', () => {
    wait.classList.add('hidden');
    poller.start();
  });
}

// ---- Display mode -----------------------------------------------------------
// PER-DEVICE, not per-room. The server sends every device the same payload; the
// only difference is what a device chooses to draw. "couch" hides the shared
// board because a /tv is carrying it; "remote" draws it here instead. This is
// what lets one room mix both — Nick's mother playing remote while everyone
// else is on a couch. Stored locally, so each phone keeps its own answer.
// Sound preference persists per device too. Sfx exposes setEnabled/isEnabled but
// keeps no storage of its own, so the choice would reset on every reload without
// this; the stored value is pushed back into Sfx at boot, below.
const SOUND_KEY = 'salty-sound-on';
function soundOn() { return Sfx.isEnabled(); }
function setSoundOn(v) {
  Sfx.setEnabled(v);
  localStorage.setItem(SOUND_KEY, v ? '1' : '0');
}
if (localStorage.getItem(SOUND_KEY) === '0') Sfx.setEnabled(false);

const MODE_KEY = 'salty-display-mode';
function displayMode() { return localStorage.getItem(MODE_KEY) || 'couch'; }
function setDisplayMode(m) {
  localStorage.setItem(MODE_KEY, m);
  if (lastView) render(shownView());
}

// ---- Menu -------------------------------------------------------------------
// Everything that is not a card play lives here: scoreboard, sound, the mode
// switch, and (for the host) the round controls that used to sit in a corner
// strip. Nick, 2026-08-02 — "the host controls should live in the menu also,
// along with the reset/admin page button."
function openMenu() {
  const v = lastView;
  if (!v) return;
  const mode = displayMode();

  let html = '<div class="menuSection"><h3>Scores</h3>';
  html += (v.players || []).map(p =>
    `<div class="menuScore ${p.seat === v.currentSeat ? 'turn' : ''}">`
    + `<span>${p.name}${p.seat === v.yourSeat ? ' (you)' : ''}</span>`
    + `<span>${p.goalCount} in HOLD · ${p.total} pts</span></div>`).join('');
  html += '</div>';

  html += `<div class="menuSection"><h3>This device</h3>
    <div class="menuBtns">
      <button id="mCouch" class="${mode === 'couch' ? '' : 'secondary'}">Couch mode</button>
      <button id="mRemote" class="${mode === 'remote' ? '' : 'secondary'}">Remote mode</button>
      <button id="mSound" class="secondary">Sound: ${soundOn() ? 'on' : 'off'}</button>
      <button id="mTimings" class="secondary">Timings</button>
    </div>
    <p class="meta" style="font-size:1.6dvh;margin-top:1dvh;">
      Couch mode hides the shared board because the TV is showing it.
      Remote mode draws the runs here instead.</p></div>`;

  if (isHost()) {
    const roundBtn = v.status === 'ROUND_RESULTS'
      ? '<button id="mNextRound">Next round</button>' : '';
    html += `<div class="menuSection"><h3>Host</h3><div class="menuBtns">
      ${roundBtn}
      <button id="mReset" class="secondary">Reset game</button>
      <button id="mAdmin" class="secondary">Admin page</button>
    </div></div>`;
  }

  showModal('Menu', html, [{ label: 'Close', secondary: true }]);

  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on('mCouch', () => { setDisplayMode('couch'); hideChoiceBar(); });
  on('mRemote', () => { setDisplayMode('remote'); hideChoiceBar(); });
  on('mSound', () => {
    setSoundOn(!soundOn());
    hideChoiceBar();
    openMenu();   // reopen so the label reflects the new state
  });
  on('mTimings', () => { hideChoiceBar(); showTimings(); });
  on('mNextRound', () => { hideChoiceBar(); advanceRound(false, v); });
  on('mReset', () => { hideChoiceBar(); doReset(); });
  on('mAdmin', () => { location.href = '/admin'; });
}
// The whole point of the instrumentation is the PHONE, which has no console —
// so the numbers have to be readable on the device that has the problem, and
// copyable off it afterwards.
function showTimings() {
  showModal('Timings',
    '<pre style="white-space:pre-wrap;font-size:1.5dvh;line-height:1.5;text-align:left;">'
      + Perf.text() + '</pre>',
    [{ label: 'Copy', action: copyTimings }, { label: 'Close', secondary: true }]);
}
function copyTimings() {
  const txt = Perf.text() + '\n\n' + JSON.stringify(Perf.summary(), null, 2);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt)
      .then(() => showToast('Timings copied'), () => showToast('Could not copy'));
  } else {
    showToast('Clipboard unavailable here');
  }
}
document.getElementById('menuBtn').addEventListener('click', openMenu);
// setDisplayMode re-renders, and render() disarms the prompt in remote mode, so
// this both switches the layout and dismisses the overlay in one tap.
document.getElementById('rotateRemoteBtn').addEventListener('click', () => setDisplayMode('remote'));

// Host-only controls. These live in static markup rather than being rebuilt per
// render, so they are wired once here. They stay inert for non-hosts: the
// panels holding them are hidden, and every handler re-checks isHost().
document.getElementById('startBtn').addEventListener('click', async () => {
  if (!isHost()) return;
  const btn = document.getElementById('startBtn');
  btn.disabled = true;
  try {
    await Api.startGame(roomId, hostToken);
    poller.kick();
  } catch (e) {
    showToast(e.message);
    btn.disabled = false;   // re-enable so a failed start can be retried
  }
});
document.getElementById('lobbyResetBtn').addEventListener('click', doReset);
// (The in-game Reset button moved into the Menu modal — see openMenu().)

function startPolling() {
  poller.start();
  doorbell.start();
}
</script>
</body>
</html>
