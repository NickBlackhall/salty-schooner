    box.appendChild(b);
  });
}

if (!roomId) {
  document.getElementById('waitPanel').innerHTML = '<p>No saved seat found.</p><p><a href="/join" style="color:#ffe28a;">Join a room</a></p>';
} else if (creds) {
  startPolling();
} else {
  const saved = Persist.loadPlayers(roomId);
  if (saved.length > 1) showSeatPicker(saved);
  else document.getElementById('waitPanel').innerHTML = '<p>No saved seat found.</p><p><a href="/join" style="color:#ffe28a;">Join a room</a></p>';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 2200);
}

// A King played as a wildcard must still READ as a King. Showing only its
// effective value ("7♠") hides the King-on-King restriction and makes a legal
// board look like an illegal one. Mirrors renderCard() in app/index.html.
function cardHtml(c, extraClass) {
  if (!c) return '';
  const red = c.suit === '♥' || c.suit === '♦';
  const wild = c.rank === 'K' && c.effectiveValue;
  const arrow = c.playedDirection === 'up' ? '↑' : c.playedDirection === 'down' ? '↓' : '';
  const as = wild ? `<span class="asBadge">${Engine.VALUE_NAMES[c.effectiveValue]}${arrow}</span>` : '';
  return `<span class="card ${red ? 'red' : ''} ${wild ? 'king' : ''} ${extraClass || ''}">${c.rank}${c.suit}${as}</span>`;
}

// Spreads a whole Port pile open — mirrors togglePortFan() in app/index.html.
// Read-only: tapping a card inside the fan does nothing, same as hot-seat.
// Only the top (last) card is actually playable, so it gets marked.
function togglePortFan(i) {
  // Refuse while a King direction question is up — it occupies the same corner
  // of the screen and must be answered first.
  if (choiceBarOpen()) { showToast('Answer the King first.'); return; }
  fannedPort = (fannedPort === i) ? null : i;
  renderPortFan();
}
function renderPortFan() {
  const overlay = document.getElementById('portFanOverlay');
  // yourPorts is absent from a LOBBY view, so guard on it rather than on lastView
  // alone — a host reset can swap the view out while the fan is open.
  if (fannedPort === null || !lastView || !shownView().yourPorts) {
    fannedPort = null;
    overlay.classList.add('hidden');
    return;
  }
  const pile = shownView().yourPorts[fannedPort] || [];
  if (pile.length === 0) { fannedPort = null; overlay.classList.add('hidden'); return; }
  document.getElementById('portFanTitle').textContent = `Port ${fannedPort + 1} (${pile.length} card${pile.length === 1 ? '' : 's'})`;
  document.getElementById('portFanRow').innerHTML = pile.map((c, idx) => {
    const isTop = idx === pile.length - 1;
    return `<div class="portFanCell">${cardHtml(c, isTop ? 'top' : '')}${isTop ? '<div class="portFanTopLabel">TOP</div>' : ''}</div>`;
  }).join('');
  overlay.classList.remove('hidden');
}
document.getElementById('portFanClose').addEventListener('click', () => { fannedPort = null; renderPortFan(); });

// Selection is the ONE piece of UI state that changes nothing but a CSS class,
// so it must never go through render(). render() rebuilds the innerHTML of the
// runs, hand, Ports, HOLD and Brig and re-binds every listener; since the
// restyle those elements carry layered gradients, a border-image PNG and
// texture backgrounds, so a full rebuild on every tap is what made selecting a
// card feel laggy on a phone — a local, zero-network action. Toggling the class
// is equivalent because `selected` only ever feeds `.selected` in the markup
// (grep the render() branches: hand, port top, holdTop, brig king). If that
// stops being true, this has to grow to match, not go back to render().
function paintSelection() {
  document.querySelectorAll('#gameUi .card.selected, #jailbreakEvent [data-jb].selected')
    .forEach(el => el.classList.remove('selected'));
  if (!selected) return;
  let el = null;
  if (selected.zone === 'hand') el = document.querySelector(`#handRow .card[data-id="${selected.card.id}"]`);
  else if (selected.zone === 'goal') el = document.getElementById('holdTop');
  else if (selected.zone === 'discard') el = document.querySelector(`#portsGrid .port[data-port="${selected.index}"] .card`);
  else if (selected.zone === 'jailbreak') {
    el = document.querySelector(`#jailbreakEvent [data-jb="${selected.card.id}"]`)
      || document.querySelector(`#brigStrip [data-jb="${selected.card.id}"]`);
  }
  if (el) el.classList.add('selected');
}

function selectCard(zone, card, index) {
  if (!shownView().isYourTurn) return;
  if (inputLocked()) { noteBusyTap(); return; }
  // Picking a different card abandons any King direction question still on
  // screen — that question belongs to the card you were playing a moment ago.
  hideChoiceBar();
  // Tapping the selected card again clears it. Without this you cannot get from
  // "hand card selected" back to "nothing selected", which is the state a Port
  // pickup requires.
  if (selected && selected.card.id === card.id) { selected = null; Sfx.play('deselect'); paintSelection(); return; }
  selected = { zone, card, index };
  Sfx.play('select');
  paintSelection();
}

// Mirrors window.portTap() in app/index.html: a Port tile is both the discard
// target AND the way to pick a card back out of a Port to play it to a Run.
function portTap(portIndex) {
  if (!shownView().isYourTurn) return;
  if (inputLocked()) { noteBusyTap(); return; }
  if (selected && selected.zone === 'hand') return discardTo(portIndex);
  const pile = shownView().yourPorts[portIndex] || [];
  const top = pile[pile.length - 1];
  if (top) return selectCard('discard', top, portIndex);
  showToast('Select a hand card first to discard here.');
}

function legalRunIndexes(card) {
  if (!lastView) return [];
  return lastView.runs.map((r,i)=>i).filter(i => Engine.canPlayCardOnRun(card, lastView.runs[i]));
}

async function attemptPlay(runIndex) {
  // Requirement 7: one action in flight at a time. Without this a double-tap
  // sends two plays, and the second comes back as a version conflict — a
  // confusing "someone else already acted" for a solo player.
  if (!selected) return;
  const card = selected.card;
  const zone = selected.zone;

  // A predicted play does not wait on anything, so it is not gated by the
  // in-flight lock — that lock exists to stop two requests racing the same
  // expectedVersion, and the queue serialises them instead. It must still stand
  // aside for a NON-predicted action already in flight.
  if (canPredictPlay(card, zone, runIndex) && !inputLocked()) {
    const rec = Perf.startAction('play-predicted');
    selected = null;
    playQueue.push({ id: ++actionSeq, cardId: card.id, runIndex, rec });
    Perf.counts.predicted++;
    rebuildPredicted();
    Sfx.play('place');
    render(shownView(), 'predict');
    Perf.mark(rec, 'feedback');
    Perf.mark(rec, 'rendered');   // the card is on the run NOW, not after the server agrees
    drainQueue();
    return;
  }

  // Everything else keeps the original behaviour: one action at a time, and the
  // board waits for the server before it changes.
  if (nonPredictBlocked()) { noteBusyTap(); return; }
  // Opened AFTER the lock check, so a refused tap is counted by noteBusyTap()
  // rather than becoming a timing row with nothing behind it.
  const rec = Perf.startAction(card.rank === 'K' ? 'play-king' : 'play');
  const run = shownView().runs[runIndex];
  if (!Engine.canPlayCardOnRun(card, run)) {
    Perf.finish(rec, 'illegal-local');
    Sfx.play('illegal'); showToast('Illegal play.'); return;
  }
  if (card.rank === 'K') {
    let choices;
    if (!run.direction) {
      choices = Engine.unsetNaturalKingChoices(run).map(c => ({ label: `King as ${Engine.VALUE_NAMES[c.kingValue]} — ${c.dir.toUpperCase()}`, value: c.kingValue, dir: c.dir }));
    } else {
      const required = Engine.kingRequiredValue(run);
      choices = ['up','down'].map(dir => ({ label: `Continue ${dir.toUpperCase()} as ${Engine.VALUE_NAMES[required]}`, value: required, dir }));
    }
    // Capture the card id NOW. Previously sendPlay() read `selected` at the
    // moment a choice was tapped, so changing selection while the question was
    // on screen answered it with the wrong card — committing a King and then
    // touching a hand card played the hand card instead, King untouched.
    showChoiceBar(choices, (choice) => sendPlay(card.id, runIndex, { value: choice.value, dir: choice.dir }, rec));
    return;
  }
  // Non-King, already checked legal by the same engine the server runs: give the
  // feedback now, then send. Kings above deliberately skip this — they go
  // through a modal, so there is no unanswered tap to cover.
  beginPendingPlay(card.id, runIndex);
  Perf.mark(rec, 'feedback');
  sendPlay(card.id, runIndex, undefined, rec);
}

// ---- Modal ------------------------------------------------------------------
// Lifted from hot-seat's showModal(): dimmed backdrop, titled card, a row of
// choice buttons. Replaces the old docked choiceBar, which had nowhere to live
// once the landscape layout claimed every region of the screen.
function hideChoiceBar() {
  document.getElementById('modalBackdrop').classList.remove('show');
}
function choiceBarOpen() {
  return document.getElementById('modalBackdrop').classList.contains('show');
}
function showModal(title, bodyHtml, choices) {
  // The Port fan is a bottom sheet and would sit under the backdrop looking
  // half-interactive. Close it before anything opens over the top.
  fannedPort = null; renderPortFan();
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHtml || '';
  const box = document.getElementById('modalChoices');
  box.innerHTML = '';
  (choices || []).forEach(c => {
    const b = document.createElement('button');
    b.textContent = c.label;
    if (c.secondary) b.className = 'secondary';
    b.onclick = () => { hideChoiceBar(); if (c.action) c.action(); };
    box.appendChild(b);
  });
  document.getElementById('modalBackdrop').classList.add('show');
}
// Kept under its old name so attemptPlay()'s King path needs no rewiring.
function showChoiceBar(choices, onPick) {
  showModal(
    'Captain’s Orders',
    '<p>Which direction does the run continue?</p>',
    choices.map(c => ({ label: c.label, action: () => onPick(c) }))
  );
}

async function sendPlay(cardId, runIndex, kingChoice, rec) {
  // Whether the tap already got its feedback. The King path does not call
  // beginPendingPlay, so it still needs the sound on success.
  const wasOptimistic = pendingPlay !== null;
  try {
    Perf.mark(rec, 'request');
    const res = await withActionLock(() => Api.submitAction({
      roomId, actorType: 'player', token: creds.resumeToken, playerId: creds.playerId,
      action: { type: 'PLAY_CARD', cardId, runIndex, kingChoice },
      clientActionId: rec ? rec.id : undefined,
      expectedVersion: lastView.stateVersion
    }));
    Perf.mark(rec, 'response');
    if (rec && res && res.timing) rec.server = res.timing;
    selected = null;
    // Cleared BEFORE applyView so render()'s paintPending has nothing to
    // re-apply — the authoritative view already has the card in the run.
    clearPendingPlay();
    if (!wasOptimistic) Sfx.play('place');
    applyView(res.view, 'action');
    // applyView can defer the draw if a finger is still down; that is rare this
    // late in a play and is counted separately as rendersDeferred, so read this
    // mark as "the board was told", not always "pixels changed".
    Perf.mark(rec, 'rendered');
    Perf.finish(rec, 'accepted');
    settleHeldPulse();
    poller.kick();   // act, then re-sync at once rather than waiting out a backed-off delay
  } catch (e) {
    Perf.finish(rec, 'server-rejected');
    // Requirement 6: fall back to the untouched authoritative view. Nothing was
    // faked, so this is just a repaint — the faded card comes back where it was.
    clearPendingPlay();
    Sfx.play('illegal');
    showToast(e.message);
    selected = null;
    render(shownView());
  }
}

async function discardTo(portIndex) {
  if (!selected || selected.zone !== 'hand') { Sfx.play('illegal'); showToast('Select a card from your hand first.'); return; }
  // Discard had no in-flight guard at all: a double-tap on a Port fired two
  // POSTs, and the loser came back as "someone else already acted".
  if (nonPredictBlocked()) { noteBusyTap(); return; }
  try {
    const res = await withActionLock(() => Api.submitAction({
      roomId, actorType: 'player', token: creds.resumeToken, playerId: creds.playerId,
      action: { type: 'DISCARD_TO_PORT', cardId: selected.card.id, portIndex },
      expectedVersion: lastView.stateVersion
    }));
    selected = null;
    Sfx.play('discard');
    applyView(res.view, 'action');
    settleHeldPulse();
    poller.kick();   // act, then re-sync at once rather than waiting out a backed-off delay
  } catch (e) {
    Sfx.play('illegal');
    showToast(e.message);
  }
}

document.getElementById('drawBtn').addEventListener('click', async () => {
  // Draw is not itself optimistic (requirement 8), but it must not fire while a
  // play is in flight — it would race the same expectedVersion and lose. Since
  // actionInFlight now covers draws too, this also stops Draw racing ITSELF.
  if (nonPredictBlocked()) { noteBusyTap(); return; }
  try {
    const res = await withActionLock(() => Api.submitAction({
      roomId, actorType: 'player', token: creds.resumeToken, playerId: creds.playerId,
      action: { type: 'DRAW_HAND' },
      expectedVersion: lastView.stateVersion
    }));
    Sfx.play('ui');
    applyView(res.view, 'action');
    settleHeldPulse();
    poller.kick();   // act, then re-sync at once rather than waiting out a backed-off delay
  } catch (e) { Sfx.play('illegal'); showToast(e.message); }
});

function renderLobby(view) {
  showScreen('lobbyPanel');
  document.getElementById('lobbyCode').textContent = view.roomCode || '';
  document.getElementById('lobbyJoinHint').textContent =
    'Others join at ' + location.host + '/join and enter this code.';

  // Mark which chip is you. seat is absent on a ?tok= rejoin, in which case
  // nothing is highlighted rather than highlighting the wrong person.
  const mySeat = creds && typeof creds.seat === 'number' ? creds.seat : null;
  const players = view.players || [];
  document.getElementById('lobbyPlayers').innerHTML =
    players.map(p => `<div class="playerChip ${p.seat === mySeat ? 'you' : ''}">${p.name}</div>`).join('')
    || '<span class="meta">Nobody yet…</span>';

  document.getElementById('lobbyHostControls').classList.toggle('hidden', !isHost());
  document.getElementById('lobbyWaitText').classList.toggle('hidden', isHost());
  if (isHost()) {
    // The host occupies a seat, so this is 1 already — one other player is enough.
    document.getElementById('startBtn').disabled = players.length < 2;
  }
}

function renderResults(view) {
  showScreen('resultsPanel');
  const panel = document.getElementById('resultsPanel');
  const gameOver = view.status === 'GAME_RESULTS';
  // Lowest total wins — hand and HOLD cards are penalty points.
  const rows = gameOver ? [...view.players].sort((a, b) => a.total - b.total) : view.players;

  let html = gameOver
    ? `<h2>Game over — ${rows[0].name} wins</h2>`
    : `<h2>Round ${view.round} complete</h2>`;
  html += rows.map(p => `<div class="scoreRow"><span>${p.name}</span><span>${
    gameOver ? p.total : `+${p.roundScore} (${p.total})`
  }</span></div>`).join('');

  if (!isHost()) {
    html += '<p class="meta" style="margin-top:22px;">Waiting for the host…</p>';
  } else if (gameOver) {
    html += '<p style="margin-top:22px;"><button id="resultsResetBtn" class="secondary">Back to the lobby</button></p>';
  } else if (view.pendingClinch) {
    html += `<p style="margin-top:18px;"><b>${view.pendingClinch}</b> has clinched the game.</p>`
      + '<p><button id="endNowBtn">End game now</button></p>'
      + '<p><button id="nextRoundBtn" class="secondary">Keep playing</button></p>';
  } else {
    html += '<p style="margin-top:22px;"><button id="nextRoundBtn">Start next round</button></p>'
      + '<p style="margin-top:12px;"><button id="resultsResetBtn" class="secondary tiny">Reset game</button></p>';
  }
  panel.innerHTML = html;

  // Rebuilt every render, so these are wired fresh rather than once at load.
  const next = document.getElementById('nextRoundBtn');
  if (next) next.onclick = () => advanceRound(false, view);
  const end = document.getElementById('endNowBtn');
  if (end) end.onclick = () => advanceRound(true, view);
  const rst = document.getElementById('resultsResetBtn');
  if (rst) rst.onclick = doReset;
}

async function advanceRound(endNow, view) {
  try {
    await Api.submitAction({
      roomId, actorType: 'host', token: hostToken,
      action: { type: 'ADVANCE_ROUND', endNow },
      expectedVersion: view.stateVersion
    });
    poller.kick();
  } catch (e) { showToast(e.message); }
}

async function doReset() {
  if (!isHost()) return;
  if (!confirm('Reset this game for everyone? Progress will be lost. Players keep their seats and do not need to rejoin.')) return;
  try {
    await Api.resetGame(roomId, hostToken);
    poller.kick();
  } catch (e) { showToast(e.message); }
}

// Timing wrapper. render() is called from a dozen places; measuring it here
// rather than at each call site is what makes "is the rebuild itself expensive,
// or is it only expensive when it collides with a touch?" answerable.
function render(view, cause) {
  const t0 = Perf.now();
  try { renderImpl(view); }
  finally { Perf.noteRender(Perf.now() - t0, cause || 'other'); }
}

function renderImpl(view) {
  // A LOBBY response is getLobbyView, not getPlayerView — no hand, HOLD or
  // Ports — so the board code below would throw on view.yourHand.map(...).
  // This is also the state a host reset drops everyone into mid-game.
  if (view.status === 'LOBBY') {
    // Drop any held selection. Card ids come from a uid counter in the engine
    // that restarts at 1 on a cold function instance, so a card dealt after the
    // reset can carry the same id as the one selected before it — a stale
    // `selected` would then match the wrong card by id in the next game.
    selected = null;
    renderLobby(view);
    return;
  }
  if (view.status === 'ROUND_RESULTS' || view.status === 'GAME_RESULTS') {
    selected = null;
    renderResults(view);
    return;
  }
  showScreen('gameUi');
  // Drives the whole remote layout from CSS (see the REMOTE MODE block). Read
  // once here so every branch below agrees on the mode within a single render.
  const remote = displayMode() === 'remote';
  // Set on BOTH: the layout rules hang off #gameUi, but the Port fan and the
  // modals are siblings of it (they are fixed overlays and have to be, or the
  // board's stacking context would trap them), so a #gameUi-scoped selector
  // cannot reach their card sizes. body carries the mode for those.
  document.getElementById('gameUi').dataset.mode = remote ? 'remote' : 'couch';
  document.body.dataset.mode = remote ? 'remote' : 'couch';
  // Landscape is couch mode's designed orientation and the rotate prompt is
  // right to insist on it. Remote mode is drawn FOR portrait, so arming it there
  // would demand a rotation into a layout that does not exist.
  document.getElementById('rotatePrompt').classList.toggle('armed', !remote);

  const bar = document.getElementById('turnBar');
  document.getElementById('turnText').textContent =
    view.isYourTurn ? 'Your Turn' : `${view.currentPlayerName}'s turn`;
  document.getElementById('roundMeta').textContent = `Round ${view.round}/${view.maxRounds}`;
  bar.classList.toggle('myTurn', view.isYourTurn);

  // Runs are bare tap targets in couch mode. NO legality highlight anywhere —
  // Nick, 2026-08-02: telegraphing where a card can go removes the skill. Remote
  // mode adds the card contents back, because then no TV is carrying them.
  // The direction- class is a different thing and stays in both modes: it states
  // the run's own direction, not whether your selection fits there.
  // Opponents' HOLD piles. Couch mode leaves this empty because /tv carries the
  // plaques; remote has no /tv, and without it the player cannot see the race
  // they are in. Your own HOLD is already the big frame at the bottom, so only
  // the other seats go here.
  const oppStrip = document.getElementById('oppStrip');
  oppStrip.innerHTML = remote
    ? (view.players || []).filter(p => p.seat !== view.yourSeat).map(p => {
        const red = p.goalTop && (p.goalTop.suit === '♥' || p.goalTop.suit === '♦');
        const status = p.goalTop
          ? `<div class="oppHold"><span class="oppRank ${red ? 'red' : ''}">${p.goalTop.rank}${p.goalTop.suit}</span></div>`
          : '<div class="oppHold"><span class="oppClear">Cleared!</span></div>';
        return `<div class="opp ${p.seat === view.currentSeat ? 'turn' : ''}">`
          + `<div class="oppName">${p.name}</div>${status}`
          + `<div class="oppCount">${p.goalCount} in HOLD</div></div>`;
      }).join('')
    : '';

  const showCards = remote;
  document.getElementById('runsGrid').innerHTML = view.runs.map((r, i) => {
    const cards = showCards
      ? `<div class="cardRow">${r.cards.slice(-3).map(c => cardHtml(c)).join('')}</div>`
      : '';
    // What an EMPTY run will accept. Public rule state, not a legality hint: it
    // is the same for every player and does not depend on what is in your hand,
    // so it sits with the direction wash rather than with the telegraphing Nick
    // ruled out. Shown in both modes (Nick, 2026-08-10).
    const opener = r.cards.length === 0 ? '<div class="runOpener">A or Q</div>' : '';
    return `<div class="run direction-${r.direction || 'unset'} ${showCards ? 'showCards' : ''}" data-run="${i}">`
      + `<div class="runLabel">RUN ${i + 1}</div>${opener}${cards}</div>`;
  }).join('');
  document.querySelectorAll('#runsGrid .run').forEach(el => {
    el.addEventListener('click', () => attemptPlay(Number(el.dataset.run)));
  });

  document.getElementById('handRow').innerHTML = view.yourHand.map(c => {
    const sel = selected && selected.zone === 'hand' && selected.card.id === c.id;
    return `<span class="card slot ${c.suit==='♥'||c.suit==='♦'?'red':''} ${sel?'selected':''}" data-id="${c.id}">${c.rank}${c.suit}</span>`;
  }).join('') || '<span class="meta">Empty</span>';
  document.querySelectorAll('#handRow .card').forEach(el => {
    el.addEventListener('click', () => {
      const c = view.yourHand.find(c => c.id === el.dataset.id);
      selectCard('hand', c);
    });
  });
  // Drawing is always a choice now. The server decides eligibility (start-of-turn
  // quota, or a refill because the hand is empty) and sends the count; 0 hides it.
  const drawBtn = document.getElementById('drawBtn');
  const drawable = view.yourDrawCount || 0;
  drawBtn.classList.toggle('hidden', !(view.isYourTurn && drawable > 0));
  // Deliberately no number: how many you are owed depends on the start-of-turn
  // quota and whether the hand has been cleared, and a label stating a count is
  // one more thing that can drift out of step with what the server deals. The
  // server decides the amount; the button just offers the choice.
  drawBtn.textContent = 'Draw\nCards';

  document.getElementById('portsGrid').innerHTML = view.yourPorts.map((pile,i) => {
    const top = pile[pile.length-1];
    const sel = selected && selected.zone === 'discard' && selected.index === i;
    const badge = pile.length > 0 ? `<span class="portBadge" data-fan="${i}">${pile.length}</span>` : '';
    // Occupied Ports already carry the gold pile-count badge; repeating the
    // same number below the card is visual noise. Empty Ports retain their 0
    // because there is no badge and the value helps distinguish them at a glance.
    const emptyCount = top ? '' : '<div class="count">0</div>';
    return `<div class="port" data-port="${i}">${top ? cardHtml(top, sel ? 'selected' : '') : '<span class="meta">Port '+(i+1)+'</span>'}${badge}${emptyCount}</div>`;
  }).join('');
  document.querySelectorAll('#portsGrid .port').forEach(el => {
    el.addEventListener('click', () => portTap(Number(el.dataset.port)));
  });
  document.querySelectorAll('#portsGrid .portBadge').forEach(el => {
    el.addEventListener('click', (e) => { e.stopPropagation(); togglePortFan(Number(el.dataset.fan)); });
  });
  renderPortFan();

  document.getElementById('holdCard').innerHTML = (() => {
    if (!view.yourGoalTop) return '<span class="meta">Cleared!</span>';
    const sel = selected && selected.zone === 'goal';
    return `<span class="card slot ${view.yourGoalTop.suit==='♥'||view.yourGoalTop.suit==='♦'?'red':''} ${sel?'selected':''}" id="holdTop">${view.yourGoalTop.rank}${view.yourGoalTop.suit}</span>`;
  })();
  const holdTop = document.getElementById('holdTop');
  if (holdTop) holdTop.addEventListener('click', () => selectCard('goal', view.yourGoalTop));
  document.getElementById('holdCount').textContent = view.yourGoalCount + ' cards';

  // A remote Jailbreak gets a state shelf above the board. On your turn its
  // released-King group is playable; on another turn it is status only. The
  // Brig row itself becomes a banner in both cases, preserving the board's
  // physical layout while making the exceptional state unmistakable.
  const b = view.brig;
  const mineToPlay = b.active && view.isYourTurn;
  const jailbreakState = remote ? (mineToPlay ? 'mine' : (b.active ? 'other' : 'none')) : 'none';
  document.getElementById('gameUi').dataset.jailbreak = jailbreakState;
  // Two different things share this frame, and only one of them is playable.
  //
  // Couch mode leaves it empty unless the Kings are YOURS to play, because the
  // waiting Kings are public and /tv is already showing them. Remote mode has no
  // /tv, so leaving it empty hides public board state from the only player who
  // cannot see it any other way — how close the Brig is to a Jailbreak is
  // information every other seat has. Waiting Kings are therefore drawn here,
  // but WITHOUT data-jb: they are not yours, tapping one must do nothing, and
  // the missing attribute is what makes that true rather than a check that could
  // be forgotten later (see the tap-target note at the top of this file).
  const jailbreakMine = mineToPlay ? b.releasedKings : [];
  const jailbreakEvent = document.getElementById('jailbreakEvent');
  if (remote && mineToPlay) {
    const visibleKings = jailbreakMine.slice(0, 4);
    const firstKing = jailbreakMine[0];
    const selectedKing = firstKing && selected && selected.zone === 'jailbreak'
      && selected.card.id === firstKing.id;
    const cards = visibleKings.map(c => `<span class="jailbreakCard ${c.suit==='♥'||c.suit==='♦'?'red':''}">${c.rank}${c.suit}</span>`).join('');
    const source = firstKing
      ? `<button class="jailbreakSource ${selectedKing ? 'selected' : ''}" data-jb="${firstKing.id}" type="button" aria-label="Select a released King">`
        + `<span class="jailbreakCards">${cards}</span>`
        + `<span class="jailbreakEventCount">×${jailbreakMine.length}</span></button>`
      : '';
    jailbreakEvent.innerHTML = source
      + '<div class="jailbreakMessage" id="jailbreakMessage">The Crown demands every King!</div>';
  } else if (remote && b.active) {
    const count = (b.releasedKings || []).length;
    jailbreakEvent.innerHTML = `<div class="jailbreakMessage" id="jailbreakMessage">${view.currentPlayerName} is resolving a Jailbreak — ${count} King${count === 1 ? '' : 's'} remain</div>`;
  } else {
    jailbreakEvent.innerHTML = '<div class="jailbreakMessage" id="jailbreakMessage"></div>';
  }
  // Waiting Kings are context rather than tap targets, so their preview stays
  // capped. During a remote Jailbreak the event shelf above draws up to four
  // faces with a total-count badge. The whole group points at the first real
  // King, and the count decrements after each authoritative play. Nothing in
  // the rules or server state changes — this is still "select a released King."
  const BRIG_PREVIEW_MAX = 6;
  const brigWaiting = (!mineToPlay && remote)
    ? (b.waitingKings || []).slice(0, BRIG_PREVIEW_MAX)
    : [];
  const jailbreakHtml = remote ? '' : jailbreakMine.map(c => {
      const sel = selected && selected.zone === 'jailbreak' && selected.card.id === c.id;
      return `<span class="card slot ${c.suit==='♥'||c.suit==='♦'?'red':''} ${sel ? 'selected' : ''}" data-jb="${c.id}">${c.rank}${c.suit}</span>`;
    }).join('');
  document.getElementById('brigStrip').innerHTML = jailbreakHtml
    + brigWaiting.map(c => `<span class="card ${c.suit==='♥'||c.suit==='♦'?'red':''}">${c.rank}${c.suit}</span>`).join('');
  document.getElementById('brigCount').textContent = remote && b.active
    ? 'JAILBREAK'
    : mineToPlay
      ? `JAILBREAK — ${b.releasedKings.length} TO PLAY`
    : (remote ? `${b.waitingCount} in the Brig` : '');
  // Move the Brig frame to wherever THIS mode/state needs it. appendChild MOVES
  // an existing node — nothing is re-created, so #brigStrip's own listeners
  // (bound below, every render) are unaffected by which parent it currently
  // sits under.
  //
  //   couch            -> .rightCol, next to HOLD (unchanged, always was here)
  //   remote           -> inside the tilted board (grid-area: brig); an active
  //                       state changes its contents to a responsive banner
  const brigBoxEl = document.querySelector('.brigBox');
  brigBoxEl.classList.toggle('jailbreakActive', remote && b.active);
  if (remote) {
    // .tiltBoard, NOT #runsGrid — appending inside #runsGrid would place the
    // Brig exactly where the very next render()'s innerHTML rebuild wipes it.
    // (Found this the hard way: it throws on the SECOND render, once
    // #brigStrip has been destroyed along with everything else that was
    // sitting inside #runsGrid.)
    const tiltBoardEl = document.getElementById('tiltBoard');
    if (brigBoxEl.parentElement !== tiltBoardEl) tiltBoardEl.appendChild(brigBoxEl);
  } else {
    const rightColEl = document.querySelector('.rightCol');
    if (brigBoxEl.parentElement !== rightColEl) rightColEl.appendChild(brigBoxEl);
  }

  // HOLD and Draw Cards, same appendChild-moves-not-recreates technique as the
  // Brig above. Nick, 2026-08-14: Draw Cards should read as a full-width
  // banner rather than the floating pill, and HOLD should sit beside the hand
  // — its own simpler box, not sharing the hand's wood panel — instead of its
  // own separate row at the bottom. .leftCol becomes a small grid in remote
  // mode for exactly this (see the CSS), which needs #drawBtn and .holdBox as
  // DIRECT children of .leftCol alongside the two that were already there.
  //
  // Neither #handSection nor .handInner is ever innerHTML-rebuilt (only
  // #handRow, a child, is) — the same fact that made the Brig fix safe applies
  // here: these are stable containers, safe to hold a moved node indefinitely.
  const drawBtnEl = document.getElementById('drawBtn');
  const holdBoxEl2 = document.querySelector('.holdBox');
  const leftColEl = document.querySelector('.leftCol');
  const handInnerEl = document.querySelector('.handInner');
  if (remote) {
    if (drawBtnEl.parentElement !== leftColEl) leftColEl.insertBefore(drawBtnEl, leftColEl.firstChild);
    if (holdBoxEl2.parentElement !== leftColEl) leftColEl.appendChild(holdBoxEl2);
  } else {
    // Couch: exactly where they always were — first in .handInner (beside the
    // hand row), and in .rightCol (beside the Brig, handled above).
    if (drawBtnEl.parentElement !== handInnerEl) handInnerEl.insertBefore(drawBtnEl, handInnerEl.firstChild);
    const rightColEl2 = document.querySelector('.rightCol');
    if (holdBoxEl2.parentElement !== rightColEl2) rightColEl2.insertBefore(holdBoxEl2, rightColEl2.firstChild);
  }

  document.querySelectorAll('#jailbreakEvent [data-jb], #brigStrip [data-jb]').forEach(el => {
    el.addEventListener('click', () => {
      const c = view.brig.releasedKings.find(c => c.id === el.dataset.jb);
      selectCard('jailbreak', c);
    });
  });

  // Last, because everything above just replaced the elements it styles. A poll
  // landing while a play is in flight would otherwise restore the faded card and
  // drop the target ring, undoing the feedback mid-request.
  paintPending();
}

function applyView(view, cause) {
  // Drop a view that is older than what we already show. A poll GET issued just
  // before an action's POST commits will answer with pre-action state and arrive
  // afterwards, briefly reverting the board — your card visibly jumps back into
  // your hand. Only compare when both sides carry a version: a LOBBY view (host
  // reset) has none and must always be allowed through.
  if (lastView && typeof lastView.stateVersion === 'number'
      && typeof view.stateVersion === 'number'
      && view.stateVersion < lastView.stateVersion) {
    return;
  }

  // An UNCHANGED poll used to rebuild the entire board anyway. On your own turn
  // that is a full innerHTML replacement of the runs, hand, Ports, HOLD and Brig
  // roughly every 1.2s, forever, whether or not anything moved — wasted work at
  // best, and at worst a rebuild landing in the middle of a touch (see the
  // gesture guard above). Skip only the DRAW; the view itself is still adopted,
  // because a same-version response can still carry fields the board does not
  // paint, and dropping it wholesale would throw those away.
  const unchanged = lastView
    && typeof lastView.stateVersion === 'number'
    && typeof view.stateVersion === 'number'
    && view.stateVersion === lastView.stateVersion
    && lastView.status === view.status;

  lastView = view;
  // Predictions are re-derived from the new authoritative state, never carried
  // forward as patches. A play the server has now confirmed drops out of the
  // queue naturally; one that has been overtaken makes rebuildPredicted give up
  // and fall back to authoritative state rather than show a duplicate card.
  rebuildPredicted();

  if (unchanged) {
    Perf.counts.rendersSuppressed++;
    Perf.bump(cause, 'skipped');
    // Resolved, but nothing was drawn — the fetch came back with news we already
    // had. Recorded as 'applied' rather than 'painted' so paint latency is never
    // credited for a frame that never existed.
    closePulseObs('toApplied');
    return;
  }

  // A real change, but a finger is on the board: hold it. Only the newest view
  // matters, so this is a flag rather than a queue — flushDeferredRender()
  // draws whatever lastView has become by the time the gesture ends, which is
  // also why a later action response cannot be overtaken by an earlier poll.
  if (pointerActive) {
    renderPending = true;
    pendingCause = cause;
    Perf.counts.rendersDeferred++;
    // Deliberately left OPEN. The finger is still down and the board still shows
    // the old state, so the pulse is not yet resolved; flushDeferredRender()
    // closes it when the render actually runs. Closing here would report a paint
    // that had not happened.
    return;
  }

  render(shownView(), cause);
  closePulseObs('toPainted');
}

async function poll() {
  // Claimed BEFORE the fetch, for two reasons: this poll's cause is whatever
  // asked for it, and a pulse arriving mid-flight must not retag a request
  // already on the wire. (Reading it after the await also put it in its own
  // temporal dead zone for the line below, which threw on every single poll
  // into the catch — silently, since the catch returns 'error' and the poller
  // simply backs off. The tests caught it; nothing on screen would have.)
  const cause = nextPollCause;
  nextPollCause = 'timer';
  try {
    // Measured before the await so the span ends where the fetch BEGINS, not
    // where it returns. Scoped to doorbell-caused polls only: a timer poll that
    // happens to run first must not be credited with doorbell latency. The
    // observation is NOT cleared here — it stays open until the screen actually
    // reflects it, which is a different moment.
    if (cause === 'doorbell' && pulseObs) Perf.notePulseSpan('toFetch', Perf.now() - pulseObs.receivedAt);
    const view = await Api.getPlayerState(roomId, creds.playerId, creds.resumeToken);
    Perf.notePoll(doorbell.isLive());
    applyView(view, 'poll:' + cause);
    // Signature the poller compares to decide whether anything actually moved.
    // LOBBY views carry no stateVersion, hence the status fallback.
    return (view.status || '') + ':' + (view.stateVersion == null ? '' : view.stateVersion);
  } catch (e) {
    console.error(e);
    return 'error';
  }
}

function showPausedPanel() {
  const wait = document.getElementById('waitPanel');
  showScreen('waitPanel');
  wait.innerHTML = '<p>Paused — this tab went quiet for a while.</p>'
    + '<p class="meta">Stopped checking for updates so it isn’t running in the background.</p>'
    + '<button id="resumeBtn" style="margin-top:14px;">Resume game</button>';
  document.getElementById('resumeBtn').addEventListener('click', () => {
    wait.classList.add('hidden');
    poller.start();
  });
}

// ---- Display mode -----------------------------------------------------------
// PER-DEVICE, not per-room. The server sends every device the same payload; the
// only difference is what a device chooses to draw. "couch" hides the shared
// board because a /tv is carrying it; "remote" draws it here instead. This is
// what lets one room mix both — Nick's mother playing remote while everyone
// else is on a couch. Stored locally, so each phone keeps its own answer.
// Sound preference persists per device too. Sfx exposes setEnabled/isEnabled but
// keeps no storage of its own, so the choice would reset on every reload without
// this; the stored value is pushed back into Sfx at boot, below.
const SOUND_KEY = 'salty-sound-on';
function soundOn() { return Sfx.isEnabled(); }
function setSoundOn(v) {
  Sfx.setEnabled(v);
  localStorage.setItem(SOUND_KEY, v ? '1' : '0');
}
if (localStorage.getItem(SOUND_KEY) === '0') Sfx.setEnabled(false);

const MODE_KEY = 'salty-display-mode';
function displayMode() { return localStorage.getItem(MODE_KEY) || 'couch'; }
function setDisplayMode(m) {
  localStorage.setItem(MODE_KEY, m);
  if (lastView) render(shownView());
}

// ---- Menu -------------------------------------------------------------------
// Everything that is not a card play lives here: scoreboard, sound, the mode
// switch, and (for the host) the round controls that used to sit in a corner
// strip. Nick, 2026-08-02 — "the host controls should live in the menu also,
// along with the reset/admin page button."
function openMenu() {
  const v = lastView;
  if (!v) return;
  const mode = displayMode();

  let html = '<div class="menuSection"><h3>Scores</h3>';
  html += (v.players || []).map(p =>
    `<div class="menuScore ${p.seat === v.currentSeat ? 'turn' : ''}">`
    + `<span>${p.name}${p.seat === v.yourSeat ? ' (you)' : ''}</span>`
    + `<span>${p.goalCount} in HOLD · ${p.total} pts</span></div>`).join('');
  html += '</div>';

  html += `<div class="menuSection"><h3>This device</h3>
    <div class="menuBtns">
      <button id="mCouch" class="${mode === 'couch' ? '' : 'secondary'}">Couch mode</button>
      <button id="mRemote" class="${mode === 'remote' ? '' : 'secondary'}">Remote mode</button>
      <button id="mSound" class="secondary">Sound: ${soundOn() ? 'on' : 'off'}</button>
      <button id="mTimings" class="secondary">Timings</button>
    </div>
    <p class="meta" style="font-size:1.6dvh;margin-top:1dvh;">
      Couch mode hides the shared board because the TV is showing it.
      Remote mode draws the runs here instead.</p></div>`;

  if (isHost()) {
    const roundBtn = v.status === 'ROUND_RESULTS'
      ? '<button id="mNextRound">Next round</button>' : '';
    html += `<div class="menuSection"><h3>Host</h3><div class="menuBtns">
      ${roundBtn}
      <button id="mReset" class="secondary">Reset game</button>
      <button id="mAdmin" class="secondary">Admin page</button>
    </div></div>`;
  }

  showModal('Menu', html, [{ label: 'Close', secondary: true }]);

  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on('mCouch', () => { setDisplayMode('couch'); hideChoiceBar(); });
  on('mRemote', () => { setDisplayMode('remote'); hideChoiceBar(); });
  on('mSound', () => {
    setSoundOn(!soundOn());
    hideChoiceBar();
    openMenu();   // reopen so the label reflects the new state
  });
  on('mTimings', () => { hideChoiceBar(); showTimings(); });
  on('mNextRound', () => { hideChoiceBar(); advanceRound(false, v); });
  on('mReset', () => { hideChoiceBar(); doReset(); });
  on('mAdmin', () => { location.href = '/admin'; });
}
// The whole point of the instrumentation is the PHONE, which has no console —
// so the numbers have to be readable on the device that has the problem, and
// copyable off it afterwards.
function showTimings() {
  showModal('Timings',
    '<pre style="white-space:pre-wrap;font-size:1.5dvh;line-height:1.5;text-align:left;">'
      + Perf.text() + '</pre>',
    [{ label: 'Copy', action: copyTimings }, { label: 'Close', secondary: true }]);
}
function copyTimings() {
  const txt = Perf.text() + '\n\n' + JSON.stringify(Perf.summary(), null, 2);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt)
      .then(() => showToast('Timings copied'), () => showToast('Could not copy'));
  } else {
    showToast('Clipboard unavailable here');
  }
}
document.getElementById('menuBtn').addEventListener('click', openMenu);
// setDisplayMode re-renders, and render() disarms the prompt in remote mode, so
// this both switches the layout and dismisses the overlay in one tap.
document.getElementById('rotateRemoteBtn').addEventListener('click', () => setDisplayMode('remote'));

// Host-only controls. These live in static markup rather than being rebuilt per
// render, so they are wired once here. They stay inert for non-hosts: the
// panels holding them are hidden, and every handler re-checks isHost().
document.getElementById('startBtn').addEventListener('click', async () => {
  if (!isHost()) return;
  const btn = document.getElementById('startBtn');
  btn.disabled = true;
  try {
    await Api.startGame(roomId, hostToken);
    poller.kick();
  } catch (e) {
    showToast(e.message);
    btn.disabled = false;   // re-enable so a failed start can be retried
  }
});
document.getElementById('lobbyResetBtn').addEventListener('click', doReset);
// (The in-game Reset button moved into the Menu modal — see openMenu().)

function startPolling() {
  poller.start();
  doorbell.start();
}
</script>
</body>
