<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salty Schooner — Host</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/theme.css">
<style>
  :root { color-scheme: dark; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 2.2rem; margin: 0 0 4px; }
  .sub { color: rgba(240,208,137,.72); margin-bottom: 24px; }
  .panel { background:var(--wood); border:1px solid rgba(201,162,39,.35); border-radius:14px;
           padding:24px; margin-bottom:20px; box-shadow:0 4px 18px rgba(0,0,0,.45); }
  label { display:block; margin: 10px 0 4px; color:var(--gold-lt); font-family:var(--serif); font-size:.95rem; }
  input[type=number] { width:100px; padding:7px 9px; border-radius:6px; border:1px solid var(--gold);
                       background:rgba(10,20,26,.85); color:var(--gold-lt); font-size:1rem; }
  button { font-size:1.05rem; padding:12px 22px; border-radius:10px; cursor:pointer;
           font-family:var(--serif); font-weight:700; color:#25190a; border:1px solid #8a6c15;
           background:linear-gradient(#f0d089, #c9a227); box-shadow:0 2px 0 #6f5510; }
  button:active { transform:translateY(1px); box-shadow:0 1px 0 #6f5510; }
  button:disabled { opacity:.4; cursor:not-allowed; box-shadow:none; }
  button.secondary { background:rgba(20,12,7,.92); color:var(--gold-lt); border:1px solid #c99a43; box-shadow:none; }
  .roomCode { font-family:var(--serif); font-size:4.5rem; letter-spacing:.22em; text-align:center;
              color:var(--gold-lt); margin:12px 0; text-shadow:0 3px 12px rgba(0,0,0,.6); }
  .playerList { display:flex; flex-wrap:wrap; gap:12px; margin-top:16px; }
  .playerChip { font-family:var(--serif); background:var(--teal); border:1px solid var(--gold);
                padding:9px 18px; border-radius:999px; font-size:1.05rem; color:var(--gold-lt); }
  .scoreboard { display:flex; flex-wrap:wrap; gap:16px; margin-bottom:20px; }
  .seat { background:var(--wood); border:1px solid rgba(201,162,39,.35); border-radius:12px; padding:14px 18px; min-width:150px; }
  .seat.turn { border-color:var(--gold); box-shadow:0 0 0 2px rgba(201,162,39,.5), 0 0 20px rgba(201,162,39,.3); }
  .seat .name { font-family:var(--serif); font-size:1.15rem; color:var(--gold-lt); }
  .card { width:38px; aspect-ratio:5/7; font-size:.95rem; margin:2px; }
  .asBadge { font-size:9px; }
  .runsRow { display:flex; flex-wrap:wrap; gap:14px; margin-bottom:20px; }
  .run { background:var(--teal); border:1px solid rgba(201,162,39,.35); border-radius:12px; padding:12px; min-width:160px; min-height:76px; }
  .brigBox { border-radius:12px; padding:14px; margin-bottom:20px; border:1px solid rgba(201,162,39,.3);
             background:linear-gradient(rgba(40,10,10,.72), rgba(40,10,10,.82)), url("/assets/tex-stone.webp") center / 300px; }
  .log { font-size:.9rem; color:rgba(240,208,137,.68); max-height:140px; overflow-y:auto; line-height:1.5; }
  .hidden { display:none; }
  .center { text-align:center; }
</style>
</head>
<body class="saltyBoard">
<div class="wrap">
  <h1>🏴‍☠️ Salty Schooner</h1>
  <div class="sub">Host screen — shared, public information only
    <button id="resetBtn" class="secondary hidden" style="margin-left:14px;padding:4px 12px;font-size:.85rem;">Reset Game</button>
  </div>

  <div id="setupPanel" class="panel">
    <h2>Start a new room</h2>
    <label>Rounds <input id="roundsInput" type="number" min="1" max="10" value="4"></label>
    <label>HOLD cards per player <input id="holdInput" type="number" min="5" max="20" value="10"></label>
    <p><button id="createBtn">Create Room</button></p>
  </div>

  <div id="lobbyPanel" class="panel hidden">
    <h2>Waiting for players</h2>
    <div class="roomCode" id="roomCodeDisplay"></div>
    <p class="center meta">Players: open <b id="joinUrlText"></b> and enter this code.</p>
    <p class="center meta">Showing the board on a TV? Open <b id="tvUrlText"></b> there — no sign-in, display only.</p>
    <div class="playerList" id="playerList"></div>
    <p class="center" style="margin-top:20px;"><button id="startBtn" disabled>Start Game</button></p>
  </div>

  <div id="gamePanel" class="hidden">
    <div class="panel">
      <div id="turnBanner" style="font-size:1.3rem;font-weight:700;"></div>
      <div class="meta" id="roundMeta"></div>
    </div>
    <div class="scoreboard" id="scoreboard"></div>
    <div class="panel">
      <h3 style="margin-top:0;">Runs</h3>
      <div class="runsRow" id="runsRow"></div>
    </div>
    <div class="panel brigBox">
      <h3 style="margin-top:0;">The Brig</h3>
      <div id="brigContent"></div>
    </div>
    <div class="panel">
      <h3 style="margin-top:0;">Log</h3>
      <div class="log" id="logBox"></div>
    </div>
  </div>

  <div id="resultsPanel" class="panel hidden center"></div>
</div>

<script src="/shared/api.js"></script>
<script src="/shared/engine.js"></script>
<script src="/shared/poller.js"></script>
<script>
// A King played as a wildcard must still READ as a King. Showing only its
// effective value ("7♠") hides the King-on-King restriction and makes a legal
// board look like an illegal one. Mirrors renderCard() in app/index.html.
const cardHtml = (c) => {
  if (!c) return '';
  const red = c.suit === '♥' || c.suit === '♦';
  const wild = c.rank === 'K' && c.effectiveValue;
  const arrow = c.playedDirection === 'up' ? '↑' : c.playedDirection === 'down' ? '↓' : '';
  const as = wild ? `<span class="asBadge">${Engine.VALUE_NAMES[c.effectiveValue]}${arrow}</span>` : '';
  return `<span class="card ${red ? 'red' : ''} ${wild ? 'king' : ''}">${c.rank}${c.suit}${as}</span>`;
};

let roomId = null, hostToken = null;

function showPanel(id) {
  ['setupPanel','lobbyPanel','gamePanel','resultsPanel'].forEach(p => {
    document.getElementById(p).classList.toggle('hidden', p !== id);
  });
}

document.getElementById('joinUrlText').textContent = location.origin + '/join';
document.getElementById('tvUrlText').textContent = location.host + '/tv';

document.getElementById('createBtn').addEventListener('click', async () => {
  const rounds = Number(document.getElementById('roundsInput').value);
  const holdCards = Number(document.getElementById('holdInput').value);
  const res = await Api.createRoom({ rounds, holdCards });
  roomId = res.roomId; hostToken = res.hostResumeToken;
  Persist.saveHost(roomId, hostToken);
  document.getElementById('roomCodeDisplay').textContent = res.roomCode;
  document.getElementById('resetBtn').classList.remove('hidden');
  showPanel('lobbyPanel');
  startPolling();
});

document.getElementById('startBtn').addEventListener('click', async () => {
  await Api.startGame(roomId, hostToken);
  poller.kick();
});

// Wipes game progress and returns to the lobby, keeping the same room code
// and the same seated players (their tokens are untouched) — nobody rejoins.
document.getElementById('resetBtn').addEventListener('click', async () => {
  if (!roomId) return;
  if (!confirm('Reset this game for everyone? Current progress will be lost. Players stay in the room and do not need to rejoin.')) return;
  await Api.resetGame(roomId, hostToken);
  poller.kick();
});

function renderLobby(view) {
  document.getElementById('roomCodeDisplay').textContent = view.roomCode;
  const list = document.getElementById('playerList');
  list.innerHTML = view.players.map(p => `<div class="playerChip">${p.name}</div>`).join('') || '<span class="meta">Nobody yet…</span>';
  document.getElementById('startBtn').disabled = view.players.length < 2;
}

function renderGame(view) {
  document.getElementById('turnBanner').textContent = `${view.currentPlayerName}'s turn`;
  document.getElementById('roundMeta').textContent = `Round ${view.round} / ${view.maxRounds} · Draw deck: ${view.deckCount} · Recycle: ${view.recycleCount}`;
  document.getElementById('scoreboard').innerHTML = view.players.map(p => `
    <div class="seat ${p.seat === view.currentSeat ? 'turn' : ''}">
      <div class="name">${p.name}</div>
      <div>${cardHtml(p.goalTop)} <span class="meta">${p.goalCount} in HOLD</span></div>
      <div class="meta">Total: ${p.total}</div>
    </div>`).join('');
  document.getElementById('runsRow').innerHTML = view.runs.map((r,i) => `
    <div class="run">
      <div class="meta">Run ${i+1} ${r.direction ? '('+r.direction+')' : ''}</div>
      <div>${r.cards.map(cardHtml).join('') || '<span class="meta">A or Q only</span>'}</div>
    </div>`).join('');
  const b = view.brig;
  document.getElementById('brigContent').innerHTML = b.active
    ? `<b>JAILBREAK ACTIVE</b> — released: ${b.releasedKings.map(cardHtml).join('')}`
    : `Waiting Kings: ${b.waitingKings.map(cardHtml).join('') || '<span class="meta">none</span>'}`;
  document.getElementById('logBox').innerHTML = view.log.map(l => `<div>${l}</div>`).join('');

  if (view.status === 'ROUND_RESULTS' || view.status === 'GAME_RESULTS') {
    showPanel('resultsPanel');
    const panel = document.getElementById('resultsPanel');
    if (view.status === 'GAME_RESULTS') {
      const sorted = [...view.players].sort((a,b)=>a.total-b.total);
      panel.innerHTML = `<h2>Game Over — ${sorted[0].name} wins!</h2>` +
        sorted.map(p => `<div>${p.name}: ${p.total}</div>`).join('');
    } else {
      panel.innerHTML = `<h2>Round ${view.round} complete</h2>` +
        view.players.map(p => `<div>${p.name}: +${p.roundScore} (${p.total} total)</div>`).join('') +
        (view.pendingClinch ? `<p><b>${view.pendingClinch}</b> has clinched the game.</p>
          <button id="endNowBtn">End game now — ${view.pendingClinch} wins</button>
          <button class="secondary" id="keepPlayingBtn">Keep playing</button>` :
          `<p><button id="nextRoundBtn">Start Next Round</button></p>`);
      const advance = (endNow) => Api.submitAction({ roomId, actorType:'host', token:hostToken, action:{type:'ADVANCE_ROUND', endNow}, expectedVersion: view.stateVersion }).then(() => poller.kick());
      const next = document.getElementById('nextRoundBtn'); if (next) next.onclick = () => advance(false);
      const end = document.getElementById('endNowBtn'); if (end) end.onclick = () => advance(true);
      const keep = document.getElementById('keepPlayingBtn'); if (keep) keep.onclick = () => advance(false);
    }
  } else {
    showPanel('gamePanel');
  }
}

let lastHostStatus = null;

async function poll() {
  try {
    const view = await Api.getHostState(roomId, hostToken);
    lastHostStatus = view.status;
    if (view.status === 'LOBBY') { showPanel('lobbyPanel'); renderLobby(view); }
    else renderGame(view);
    // Signature for the poller. LOBBY has no stateVersion, so fold in the player
    // count — otherwise the lobby would look unchanged as people join and back off.
    return view.status === 'LOBBY'
      ? 'LOBBY:' + (view.players ? view.players.length : 0)
      : view.status + ':' + view.stateVersion;
  } catch (e) {
    console.error(e);
    return 'error';
  }
}

function showHostPaused() {
  const panel = document.getElementById('resultsPanel');
  ['setupPanel','lobbyPanel','gamePanel'].forEach(p => document.getElementById(p).classList.add('hidden'));
  panel.classList.remove('hidden');
  panel.innerHTML = '<h2>Paused</h2>'
    + '<p class="meta">This screen went quiet for a while, so it stopped checking for updates.</p>'
    + '<p><button id="hostResumeBtn">Resume</button></p>';
  document.getElementById('hostResumeBtn').addEventListener('click', () => poller.start());
}

// The host screen mostly watches. Only the lobby needs to feel live (players
// appearing as they join); once play starts the host just advances rounds.
const poller = createPoller({
  poll,
  intervalFor: () => (lastHostStatus === 'LOBBY' ? 2000 : 3000),
  maxInterval: 12000,
  idleStopMs: 10 * 60 * 1000,
  onIdleStop: showHostPaused
});

function startPolling() {
  poller.start();
}

// Resume an in-progress room on refresh.
(function tryResume() {
  const last = Persist.lastRoom();
  if (!last) return;
  const token = Persist.loadHost(last);
  if (!token) return;
  roomId = last; hostToken = token;
  document.getElementById('resetBtn').classList.remove('hidden');
  startPolling();
})();
</script>
</body>
</html>
