<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salty Schooner — TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/theme.css">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { padding: clamp(12px, 2vw, 30px); min-height:100dvh; }
  .hidden { display:none !important; }

  /* ---- code entry (shown once, then never again on this screen) ---- */
  #codeEntry { min-height:88vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:clamp(12px,2vh,26px); }
  .logo { width:min(62vw, 620px); max-height:34vh; object-fit:contain; filter:drop-shadow(0 6px 18px rgba(0,0,0,.6)); }
  #codeInput { font-family:var(--serif); font-size:clamp(2rem,6vw,4.5rem); width:min(90vw,7em); text-align:center;
               letter-spacing:.25em; text-transform:uppercase; padding:.15em; border-radius:12px;
               border:2px solid var(--gold); background:rgba(10,20,26,.85); color:var(--gold-lt); }
  button { font-size:clamp(1rem,2vw,1.4rem); padding:.55em 1.5em; }
  .err { color:#ff8a7a; min-height:1.4em; font-size:clamp(1rem,2vw,1.3rem); }
  .hint { font-size:clamp(.95rem,1.8vw,1.3rem); }

  /* ---- lobby ---- */
  #lobby { text-align:center; }
  #lobby .logo { max-height:22vh; margin-bottom:.2em; }
  .bigCode { font-size:clamp(4rem,15vw,10rem); line-height:1; margin:.05em 0; }
  .joinAt { font-size:clamp(1.05rem,2.6vw,2rem); color:var(--gold-lt); }
  .joinAt b { color:#fff; font-family:var(--serif); }
  .lobbyPlayers { display:flex; flex-wrap:wrap; gap:clamp(8px,1.5vw,18px); justify-content:center; margin-top:clamp(14px,3vh,34px); }
  .chip { font-family:var(--serif); background:var(--teal); border:1px solid var(--gold); border-radius:999px;
          padding:clamp(7px,1.1vw,15px) clamp(16px,2.4vw,32px); font-size:clamp(1.05rem,2.4vw,1.9rem);
          font-weight:700; color:var(--gold-lt); }

  /* ---- game ---- */
  .turnBanner { text-align:center; font-family:var(--serif); font-size:clamp(1.5rem,4.6vw,3.4rem);
                color:var(--gold-lt); line-height:1.1; text-shadow:0 3px 12px rgba(0,0,0,.7); }
  .roundLine { text-align:center; font-size:clamp(.85rem,1.7vw,1.3rem); margin-bottom:clamp(10px,2vh,20px); }
  .seats { display:flex; flex-wrap:wrap; gap:clamp(8px,1.5vw,20px); justify-content:center; margin-bottom:clamp(12px,2.5vh,26px); }
  .seat { background:var(--wood); border:1px solid rgba(201,162,39,.4); border-radius:14px;
          padding:clamp(9px,1.4vw,18px) clamp(13px,2vw,26px); min-width:clamp(128px,15vw,220px); text-align:center; }
  .seat.turn { border-color:var(--gold); box-shadow:0 0 0 3px rgba(201,162,39,.5), 0 0 26px rgba(201,162,39,.35); }
  .seat .nm { font-family:var(--serif); font-size:clamp(1.05rem,2.2vw,1.8rem); color:var(--gold-lt); }
  .seat .sc { font-size:clamp(.75rem,1.4vw,1.1rem); color:rgba(240,208,137,.72); }
  .seat .card { margin:.25em 0; }
  .runsRow { display:grid; grid-template-columns:repeat(4,1fr); gap:clamp(8px,1.4vw,18px); margin-bottom:clamp(12px,2vh,22px); }
  .run { background:var(--teal); border:1px solid rgba(201,162,39,.35); border-radius:14px;
         padding:clamp(8px,1.2vw,15px); min-height:clamp(78px,11vw,150px); }
  .runLbl { font-family:var(--serif); font-size:clamp(.72rem,1.3vw,1.05rem); color:var(--gold-lt); margin-bottom:.35em; }
  .cardRow { display:flex; flex-wrap:wrap; gap:clamp(3px,.5vw,7px); }

  /* 5:7 faces, matching the hot-seat build. */
  .card { width:clamp(30px,4.2vw,64px); aspect-ratio:5/7; font-size:clamp(.8rem,1.5vw,1.5rem); }
  .asBadge { font-size:clamp(.5rem,.85vw,.8rem); }

  .brigBar { border-radius:14px; padding:clamp(10px,1.5vw,18px); margin-bottom:clamp(10px,2vh,18px);
             background:linear-gradient(rgba(40,10,10,.72), rgba(40,10,10,.82)), url("/assets/tex-stone.webp") center / 300px;
             border:1px solid rgba(201,162,39,.3); }
  .brigBar.active { border-color:#ff9a5a; box-shadow:0 0 0 3px rgba(255,154,90,.45), 0 0 34px rgba(255,120,60,.4); }
  .brigTitle { font-family:var(--serif); font-size:clamp(.9rem,1.7vw,1.35rem); color:var(--gold-lt); margin-bottom:.4em; }
  .logBox { font-size:clamp(.78rem,1.4vw,1.1rem); color:rgba(240,208,137,.68); line-height:1.55; }
  .results { text-align:center; }
  .results h2 { font-size:clamp(1.8rem,5vw,3.4rem); margin:.2em 0; }
  .results .row { font-family:var(--serif); font-size:clamp(1.05rem,2.4vw,1.9rem); margin:.15em 0; color:var(--ink); }
  .banner { text-align:center; font-size:clamp(1rem,2.1vw,1.5rem); color:var(--gold-lt); margin-bottom:.6em; }

  /* ---- The Brig bursting open, lifted from app/index.html ---------------- */
  .brigBar.bursting { animation:brigShake 1.1s cubic-bezier(.4,0,.7,1) both, brigGlow 1.1s ease-in both; }
  @keyframes brigShake{
    0%{ transform:translate(0,0) rotate(0); }
    22%{ transform:translate(-2px,0) rotate(-.4deg); }
    40%{ transform:translate(2px,1px) rotate(.4deg); }
    55%{ transform:translate(-3px,-1px) rotate(-.7deg); }
    67%{ transform:translate(3px,1px) rotate(.8deg); }
    76%{ transform:translate(-4px,-1px) rotate(-1deg); }
    83%{ transform:translate(5px,1px) rotate(1.1deg); }
    88%{ transform:translate(-6px,-1px) rotate(-1.4deg); }
    92%{ transform:translate(6px,1px) rotate(1.5deg); }
    96%{ transform:translate(-7px,-1px) rotate(-1.7deg); }
    100%{ transform:translate(6px,0) rotate(1.6deg); }
  }
  @keyframes brigGlow{
    0%{ filter:drop-shadow(0 0 4px rgba(255,180,70,.35)) brightness(1.02); }
    60%{ filter:drop-shadow(0 0 16px rgba(255,120,50,.6)) brightness(1.14) saturate(1.25); }
    100%{ filter:drop-shadow(0 0 34px rgba(255,60,70,.95)) brightness(1.42) saturate(1.5); }
  }

  /* ---- Full-screen moment. Unlike hot-seat's splash this AUTO-DISMISSES:
     nobody is going to walk over and tap the television. ------------------- */
  .tvSplash { position:fixed; inset:0; z-index:100; display:none; background:#06131a; opacity:0;
              transition:opacity .22s ease; }
  .tvSplash.show { display:block; opacity:1; animation:splashHit .32s cubic-bezier(.15,.9,.2,1); }
  .tvSplash.departing { opacity:0; }
  @keyframes splashHit { from { transform:scale(1.12); filter:brightness(2) saturate(1.45); } }
  /* contain, not cover: the art is a portrait poster and cover would crop its
     own JAILBREAK lettering off the top on a 16:9 screen. */
  .tvSplash img { position:absolute; inset:0; width:100%; height:100%; object-fit:contain; object-position:center; }
  .tvSplashPanel { position:absolute; left:0; right:0; bottom:4vh; text-align:center; z-index:1;
                   padding:0 4vw; text-shadow:0 3px 14px rgba(0,0,0,1), 0 0 30px rgba(0,0,0,.9); }
  .tvSplashTitle { font-family:var(--serif); font-size:clamp(2.4rem,9vw,7rem); line-height:1;
                   color:#ffd76a; letter-spacing:.04em; }
  .tvSplashText { font-size:clamp(1.1rem,2.8vw,2.2rem); color:#f7e4b2; margin-top:.35em; }
  .tvSplash.failure { background:#1a0606; }
  .tvSplash.failure .tvSplashTitle { color:#ff8a5a; }
  .tvSplash.success .tvSplashTitle { color:#8ce6a8; }

  .muteBtn { position:fixed; top:10px; right:12px; z-index:120; font-size:.9rem; padding:.35em .9em;
             background:rgba(20,12,7,.9); color:var(--gold-lt); border:1px solid #c99a43; }
</style>
</head>
<body class="saltyBoard">

<div id="codeEntry">
  <img class="logo" src="/assets/logo.webp" alt="Salty Schooner">
  <div class="meta hint">Enter the room code shown on the host's device</div>
  <input id="codeInput" maxlength="4" autocapitalize="characters" placeholder="ABCD" autofocus>
  <button id="watchBtn" class="salty">Show Game</button>
  <div class="err" id="err"></div>
</div>

<div id="lobby" class="hidden">
  <img class="logo" src="/assets/logo.webp" alt="Salty Schooner">
  <div class="joinAt">Join at <b id="joinUrl"></b></div>
  <div class="bigCode roomCodeBig" id="lobbyCode"></div>
  <div class="joinAt meta">Waiting for the host to start…</div>
  <div class="lobbyPlayers" id="lobbyPlayers"></div>
</div>

<div id="game" class="hidden">
  <div class="turnBanner" id="turnBanner"></div>
  <div class="roundLine" id="roundLine"></div>
  <div class="seats" id="seats"></div>
  <div class="runsRow" id="runsRow"></div>
  <div class="brigBar" id="brigBar">
    <div class="brigTitle" id="brigTitle">The Brig</div>
    <div class="cardRow" id="brigCards"></div>
  </div>
  <div class="logBox" id="logBox"></div>
</div>

<div id="results" class="hidden results"></div>

<div id="tvSplash" class="tvSplash">
  <img id="tvSplashArt" src="/assets/jailbreak-tropical-kings.webp" alt="">
  <div class="tvSplashPanel">
    <div class="tvSplashTitle" id="tvSplashTitle"></div>
    <div class="tvSplashText" id="tvSplashText"></div>
  </div>
</div>
<button id="muteBtn" class="muteBtn hidden">Sound: on</button>

<script src="/shared/api.js"></script>
<script src="/shared/engine.js"></script>
<script src="/shared/sfx.js"></script>
<script>
// Display-only screen. It never sends an action and holds no token — it just
// polls the public board by room code. All controls stay on the host device.
const CODE_KEY = 'salty-tv-code';
let roomCode = null;
let pollTimer = null;

function show(id) {
  ['codeEntry','lobby','game','results'].forEach(p => document.getElementById(p).classList.toggle('hidden', p !== id));
}

function cardHtml(c) {
  if (!c) return '';
  const red = c.suit === '♥' || c.suit === '♦';
  const wild = c.rank === 'K' && c.effectiveValue;
  const arrow = c.playedDirection === 'up' ? '↑' : c.playedDirection === 'down' ? '↓' : '';
  const as = wild ? `<span class="asBadge">${Engine.VALUE_NAMES[c.effectiveValue]}${arrow}</span>` : '';
  return `<span class="card ${red ? 'red' : ''} ${wild ? 'king' : ''}">${c.rank}${c.suit}${as}</span>`;
}

document.getElementById('joinUrl').textContent = location.host + '/join';

// ---- Deriving events from the polled snapshot ------------------------------
// get-public-state returns a board, not an event stream, so the TV works out what
// just happened by diffing the log — which is newest-first and capped at 8 lines.
// Tracks the previously-seen top line and treats everything above it as new.
//
// Two cases must stay SILENT rather than fire a burst of cues:
//   • the very first poll (otherwise the whole visible history plays at once);
//   • the old top line no longer being present, which means either more than 8
//     events landed between polls or the round was re-dealt. Re-baseline quietly.
let lastTopLogLine = null;
let splashTimer = null;

function newLogLines(log) {
  if (!Array.isArray(log) || log.length === 0) return [];
  if (lastTopLogLine === null) { lastTopLogLine = log[0]; return []; }   // first poll
  if (log[0] === lastTopLogLine) return [];                              // nothing new
  const idx = log.indexOf(lastTopLogLine);
  lastTopLogLine = log[0];
  if (idx === -1) return [];                                            // fell out of window
  return log.slice(0, idx).reverse();                                   // oldest-new first
}

function showSplash(kind, title, text, holdMs) {
  const el = document.getElementById('tvSplash');
  clearTimeout(splashTimer);
  el.classList.remove('jailbreak', 'success', 'failure', 'departing');
  if (kind) el.classList.add(kind);
  const art = kind === 'jailbreak';
  document.getElementById('tvSplashArt').style.display = art ? '' : 'none';
  // The Jailbreak artwork already reads "JAILBREAK" in the illustration, so
  // repeating it in text just covers the picture. Only add the part the art
  // can't know — how many Kings got out. Success/Curse have no art and do need
  // a heading.
  const titleEl = document.getElementById('tvSplashTitle');
  titleEl.style.display = art ? 'none' : '';
  titleEl.textContent = title;
  document.getElementById('tvSplashText').textContent = text;
  el.classList.add('show');
  // Nobody taps a television, so it takes itself away.
  splashTimer = setTimeout(() => {
    el.classList.add('departing');
    setTimeout(() => el.classList.remove('show', 'departing', 'jailbreak', 'success', 'failure'), 260);
  }, holdMs);
}

function reactToLog(log) {
  newLogLines(log).forEach(line => {
    if (/triggered a Jailbreak with/.test(line)) {
      const n = (line.match(/(\d+) Brig King/) || [])[1] || '';
      // Brig rattles and glows first, then bursts into the splash — same beat as
      // the hot-seat build (JAILBREAK_BUILDUP_MS there).
      const bar = document.getElementById('brigBar');
      if (bar) { bar.classList.remove('bursting'); void bar.offsetWidth; bar.classList.add('bursting'); }
      Sfx.play('jailbreak-buildup');
      setTimeout(() => {
        if (bar) bar.classList.remove('bursting');
        Sfx.play('jailbreak-trigger');
        showSplash('jailbreak', 'JAILBREAK', n ? `${n} King${n === '1' ? '' : 's'} loose!` : 'The Brig is open!', 2600);
      }, 1100);
      return;
    }
    if (/^Jailbreak failed/.test(line)) {
      Sfx.play('jailbreak-failure');
      showSplash('failure', 'CURSE OF THE CROWN', 'Unplayed Kings escape — penalty cards dealt.', 2600);
      return;
    }
    if (/played every released Brig King|Jailbreak complete/.test(line)) {
      Sfx.play('jailbreak-success');
      showSplash('success', 'BRIG SECURED', 'Every freed King played.', 1800);
      return;
    }
    if (/discarded .* to Port/.test(line)) { Sfx.play('discard'); return; }
    if (/played .* (to|on) Run/.test(line)) { Sfx.play('place'); return; }
  });
}

const muteBtn = document.getElementById('muteBtn');
muteBtn.addEventListener('click', () => {
  Sfx.setEnabled(!Sfx.isEnabled());
  muteBtn.textContent = 'Sound: ' + (Sfx.isEnabled() ? 'on' : 'off');
});

function start(code) {
  roomCode = code;
  localStorage.setItem(CODE_KEY, code);
  // Pointing the screen at a different room must baseline the log afresh, or the
  // first poll is diffed against the previous room's history.
  lastTopLogLine = null;
  clearInterval(pollTimer);
  poll();
  pollTimer = setInterval(poll, 1000);
}

document.getElementById('watchBtn').addEventListener('click', async () => {
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  const err = document.getElementById('err');
  err.textContent = '';
  if (!code) { err.textContent = 'Enter the room code.'; return; }
  try {
    await Api.getPublicState(code);   // verify before committing the screen to it
    start(code);
  } catch (e) {
    err.textContent = e.message;
  }
});
document.getElementById('codeInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('watchBtn').click();
});

function renderLobby(v) {
  show('lobby');
  document.getElementById('lobbyCode').textContent = v.roomCode;
  document.getElementById('lobbyPlayers').innerHTML =
    v.players.map(p => `<div class="chip">${p.name}</div>`).join('')
    || '<div class="chip meta">Nobody yet…</div>';
}

function renderGame(v) {
  show('game');
  document.getElementById('turnBanner').textContent = `${v.currentPlayerName}'s turn`;
  document.getElementById('roundLine').textContent =
    `Round ${v.round} of ${v.maxRounds}  ·  Draw deck ${v.deckCount}  ·  Recycle ${v.recycleCount}  ·  Room ${v.roomCode}`;

  document.getElementById('seats').innerHTML = v.players.map(p => `
    <div class="seat ${p.seat === v.currentSeat ? 'turn' : ''}">
      <div class="nm">${p.name}</div>
      <div>${cardHtml(p.goalTop)}</div>
      <div class="sc">${p.goalCount} in HOLD · ${p.total} pts</div>
    </div>`).join('');

  document.getElementById('runsRow').innerHTML = v.runs.map((r,i) => `
    <div class="run">
      <div class="runLbl">Run ${i+1}${r.direction ? ' · ' + r.direction : ''}</div>
      <div class="cardRow">${r.cards.map(cardHtml).join('') || '<span class="meta">A or Q</span>'}</div>
    </div>`).join('');

  const b = v.brig;
  const bar = document.getElementById('brigBar');
  bar.classList.toggle('active', b.active);
  document.getElementById('brigTitle').textContent = b.active
    ? `⚔ JAILBREAK — ${b.releasedKings.length} King${b.releasedKings.length === 1 ? '' : 's'} loose!`
    : 'The Brig';
  document.getElementById('brigCards').innerHTML =
    (b.active ? b.releasedKings : b.waitingKings).map(cardHtml).join('') || '<span class="meta">Empty</span>';

  document.getElementById('logBox').innerHTML = v.log.slice(0,5).map(l => `<div>${l}</div>`).join('');
}

function renderResults(v) {
  show('results');
  const sorted = [...v.players].sort((a,b) => a.total - b.total);
  const panel = document.getElementById('results');
  if (v.status === 'GAME_RESULTS') {
    panel.innerHTML = `<h2>🏆 ${sorted[0].name} wins!</h2>`
      + sorted.map(p => `<div class="row">${p.name} — ${p.total}</div>`).join('')
      + (v.endedEarly ? '<div class="banner">Ended early — already decided.</div>' : '');
  } else {
    panel.innerHTML = `<h2>Round ${v.round} complete</h2>`
      + v.players.map(p => `<div class="row">${p.name}: +${p.roundScore} (${p.total} total)</div>`).join('')
      + (v.pendingClinch ? `<div class="banner">${v.pendingClinch} has clinched the game.</div>` : '')
      + '<div class="banner meta">Waiting for the host…</div>';
  }
}

async function poll() {
  try {
    const v = await Api.getPublicState(roomCode);
    muteBtn.classList.remove('hidden');
    if (v.status === 'LOBBY') {
      // A reset re-deals, so the old log is gone — re-baseline silently rather
      // than replaying a dead game's events.
      lastTopLogLine = null;
      renderLobby(v);
    } else if (v.status === 'ROUND_RESULTS' || v.status === 'GAME_RESULTS') {
      renderResults(v);
    } else {
      renderGame(v);
      // Render first so the Brig element exists for the burst animation.
      reactToLog(v.log);
    }
  } catch (e) {
    // A deleted/expired room shouldn't strand the screen — fall back to entry.
    if (e.status === 404) {
      clearInterval(pollTimer);
      localStorage.removeItem(CODE_KEY);
      show('codeEntry');
      document.getElementById('err').textContent = 'That room is no longer available.';
    }
  }
}

// ?code=ABCD for a bookmarkable TV link; otherwise resume the last code so a
// TV that reboots comes straight back to the game.
(function boot() {
  const urlCode = new URLSearchParams(location.search).get('code');
  const code = (urlCode || localStorage.getItem(CODE_KEY) || '').trim().toUpperCase();
  if (code) start(code);
})();
</script>
</body>
</html>
